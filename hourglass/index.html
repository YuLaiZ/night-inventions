<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙漏</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
    text-align: center;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; }
  .sub em { font-style: normal; color: var(--gold); }

  .glass {
    margin-top: clamp(20px, 4vw, 26px);
    display: inline-block;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: #070a12;
    cursor: pointer;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .glass.flipping { transform: rotate(180deg); }
  canvas { display: block; }

  .status {
    margin-top: 14px;
    font-size: 14px;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
  }
  .status .num { font-family: var(--mono); color: var(--ice); }

  .say { margin-top: 8px; color: var(--ink); font-size: 14.5px; min-height: 1.6em; }

  .go-row { margin-top: 12px; }
  button.flip {
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.12em;
    color: var(--bg-0);
    background: var(--gold);
    border: none;
    border-radius: 999px;
    padding: 10px 28px;
    cursor: pointer;
  }
  button.flip:hover { filter: brightness(1.08); }
  button.flip:disabled { opacity: 0.45; cursor: default; }

  .hint {
    margin-top: clamp(20px, 4vw, 26px);
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { margin-top: 12px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>沙漏</h1>
  <p class="sub">两百粒沙，粒粒可数。<em>点一下翻转</em>，时间就换了个方向继续漏。</p>

  <div class="glass" id="glass">
    <canvas id="cv" width="280" height="360"></canvas>
  </div>
  <p class="status">上室 <span class="num" id="top-n">--</span> 粒 · 下室 <span class="num" id="bot-n">--</span> 粒</p>
  <p class="say" id="say">沙子不多，刚好够翻着玩一整夜。</p>

  <div class="go-row">
    <button class="flip" id="flip" type="button">翻转沙漏</button>
  </div>

  <p class="hint">流完不用等——反正翻转一下，又是满的。时间这东西，在玩具里最慷慨。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var TOTAL = 200;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var gateY = H / 2;

  var remaining = TOTAL;   // 上室沙量
  var landed = 0;          // 下室沙量
  var falling = [];        // 正在下落的粒 {x, y, vy}
  var lastPass = 0;
  var flipping = false;

  var SAND = '#e2c07a';
  var SAND_DIM = 'rgba(226, 192, 122, 0.85)';

  // 上室粒子表：撒满漏斗后按深度降序（贴底的在前），
  // 显示前 remaining 粒——沙体始终坐在斗底，表面随漏出水平下降
  var topGrid = [];
  var botGrid = [];

  var TOP_Y = 26;                 // 漏斗内顶
  var TOP_BOT = gateY - 12;       // 漏斗内底（喉口上方）
  var TOP_HALF = 84;              // 漏斗顶口半宽
  var NECK_HALF = 4;              // 喉口半宽

  function wallHalf(y) {
    var t = (y - TOP_Y) / (TOP_BOT - TOP_Y);
    return TOP_HALF * (1 - t) + NECK_HALF * t;
  }

  function buildTop() {
    topGrid = [];
    while (topGrid.length < TOTAL) {
      var y = TOP_Y + Math.random() * (TOP_BOT - TOP_Y);
      var hw = wallHalf(y);
      topGrid.push({ x: W / 2 + (Math.random() * 2 - 1) * (hw - 3), y: y });
    }
    topGrid.sort(function (a, b) { return b.y - a.y; });
  }

  // 下室堆位表：底部摊平、上部圆顶；粒位带大抖动，堆出来才有颗粒感
  function buildBot() {
    botGrid = [];
    var i = 0;
    var level = 0;
    while (i < TOTAL && level < 40) {
      var y = H - 18 - level * (2.1 + Math.random() * 1.2) + (Math.random() - 0.5) * 3;
      var half;
      if (level < 3) {
        half = 80;                      // 摊平的堆底
      } else {
        var t = (level - 2) / 15;
        half = Math.max(7, 80 * Math.sqrt(Math.max(0, 1 - t * t)));
      }
      var perRow = Math.max(2, Math.round(half / 4.6));
      for (var k = 0; k < perRow && i < TOTAL; k++, i++) {
        var fx = (perRow === 1) ? 0.5 : k / (perRow - 1);
        botGrid.push({
          x: W / 2 + (fx - 0.5) * 2 * half + (Math.random() - 0.5) * (half * 0.3 + 6),
          y: y + (Math.random() - 0.5) * 2
        });
      }
      level++;
    }
    while (i < TOTAL) {                 // 兜底：极少数塞进堆体
      botGrid.push({ x: W / 2 + (Math.random() - 0.5) * 30, y: H - 24 - Math.random() * 34 });
      i++;
    }
  }

  function surfaceY() {
    return landed > 0 ? botGrid[landed - 1].y - 2 : H - 18;
  }

  function drawGlass() {
    var cy = W / 2;
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(199, 208, 226, 0.55)';
    ctx.beginPath();
    // 左壁：上口 → 喉 → 下口
    ctx.moveTo(cy - TOP_HALF, 16);
    ctx.lineTo(cy - NECK_HALF - 2, gateY - 4);
    ctx.lineTo(cy - TOP_HALF, H - 16);
    // 右壁
    ctx.moveTo(cy + TOP_HALF, 16);
    ctx.lineTo(cy + NECK_HALF + 2, gateY - 4);
    ctx.lineTo(cy + TOP_HALF, H - 16);
    ctx.stroke();

    // 上下口沿（木框感）
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(199, 208, 226, 0.4)';
    ctx.beginPath();
    ctx.moveTo(cy - TOP_HALF - 4, 16); ctx.lineTo(cy + TOP_HALF + 4, 16);
    ctx.moveTo(cy - TOP_HALF - 4, H - 16); ctx.lineTo(cy + TOP_HALF + 4, H - 16);
    ctx.stroke();

    // 玻璃高光
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(220, 232, 255, 0.14)';
    ctx.beginPath();
    ctx.moveTo(cy - TOP_HALF + 10, 24);
    ctx.lineTo(cy - NECK_HALF - 6, gateY - 12);
    ctx.moveTo(cy + TOP_HALF - 10, H - 24);
    ctx.lineTo(cy + NECK_HALF + 6, gateY + 12);
    ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var cy = W / 2;
    drawGlass();

    // 上室沙堆：前 remaining 粒（表在顶部，随漏出下降）
    ctx.fillStyle = SAND;
    var i, p;
    for (i = 0; i < remaining; i++) {
      p = topGrid[i];
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    // 堆面一层提亮，读起来有"沙堆"的体积
    if (remaining > 0) {
      ctx.fillStyle = SAND_DIM;
      var surf = topGrid[remaining - 1].y;   // 最浅的显示粒即表面
      for (i = 0; i < remaining; i++) {
        p = topGrid[i];
        if (p.y < surf + 6) ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      }
    }

    // 下室沙堆：前 landed 粒
    ctx.fillStyle = SAND;
    for (i = 0; i < landed; i++) {
      p = botGrid[i];
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }

    // 下落中的沙：喉口到堆面的一条细流
    ctx.fillStyle = SAND_DIM;
    for (i = 0; i < falling.length; i++) {
      ctx.fillRect(falling[i].x - 1.5, falling[i].y - 1.5, 3, 3);
    }
  }

  function tick() {
    var now = Date.now();
    if (!flipping) {
      // 漏口限流：每 90ms 放行一粒，全程约二十秒，与文案一致
      if (remaining > 0 && now - lastPass > 90) {
        lastPass = now;
        remaining--;
        falling.push({
          x: W / 2 + (Math.random() - 0.5) * 6,
          y: gateY - 2,
          vy: 0.25 + Math.random() * 0.35,
          vx: (Math.random() - 0.5) * 0.34   // 每帧横向漂移，落成散乱的沙流
        });
      }
      var floor = surfaceY();
      for (var i = falling.length - 1; i >= 0; i--) {
        var f = falling[i];
        f.vy += 0.12;
        f.x += f.vx;
        f.y += f.vy;
        if (f.y >= floor) {
          falling.splice(i, 1);
          landed++;
        }
      }
    }
    draw();
  }

  var accAngle = 0;   // 累计翻转角

  function flip() {
    if (flipping) return;
    flipping = true;
    // 绕纵轴转半圈：沙漏左右对称，内容翻转无感；
    // 不能把画布转 180°——那样画布里的"下落"在屏幕上会变成上升
    accAngle += 180;
    var glass = document.getElementById('glass');
    glass.style.transform = 'perspective(600px) rotateY(' + accAngle + 'deg)';
    $('say').textContent = '哗——整个世界倒了个个儿。';
    updateCount();
    setTimeout(function () {
      // 悬在半空的沙归入下室，然后上下对调
      landed += falling.length;
      falling = [];
      var total = remaining + landed;
      remaining = landed;
      landed = total - remaining;
      buildTop();
      buildBot();
      flipping = false;
      updateCount();
      $('say').textContent = '翻好了。沙子假装什么都没发生，继续漏。';
    }, 640);
  }

  function updateCount() {
    $('top-n').textContent = String(remaining);
    $('bot-n').textContent = String(landed);
  }

  var glassEl = document.getElementById('glass');
  glassEl.addEventListener('click', flip);
  $('flip').addEventListener('click', flip);

  buildTop();
  buildBot();
  updateCount();
  tick();
  // 用 interval 驱动而非 rAF：后台标签页 rAF 会停摆，沙漏就整个冻住了
  setInterval(tick, 33);
  setInterval(updateCount, 500);
  window.__hgReady = true;
})();
</script>
</body>
</html>
