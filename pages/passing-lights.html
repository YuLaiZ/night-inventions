<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车灯扫过天花板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06070a;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #8d97a6;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #c8ccd2; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #6d7683; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #c8ccd2;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #3d434c;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #6d7683;
    text-decoration: none;
    border-bottom: 1px dotted #6d7683;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #c8ccd2; border-color: #c8ccd2; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>车灯扫过天花板</h1>
  <p>睡不着的时候，就数窗外开过去的车。<br>光从墙这头走到那头——一觉，就这么短。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var seed = 20260917;
  function mulberry(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry(seed);

  function say(text, holdLong) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!holdLong) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5600);
  }

  var L = {};
  function layout() {
    L.w = window.innerWidth;
    L.h = window.innerHeight;
    L.wallY = L.h * 0.16;        // 天花板线
    L.bedY = L.h * 0.8;          // 被窝上沿
  }
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  window.addEventListener('resize', function () {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  });

  // ── 车流状态机 ──
  var count = 0;
  var achieved = false;
  var nextAt = Date.now() + 3200 + rng() * 4000;   // 首辆快点来
  var sweep = null;   // {t0, dur, dir, wide, hue}
  var frozenP = null; // QA 冻结相位
  var saidFirst = false;

  function nextGap() { return (11 + rng() * 24) * 1000; }

  function spawnCar() {
    count++;
    var wide = rng() < 0.22;                        // 公交/货车：更宽的双光带
    sweep = {
      t0: Date.now(),
      dur: (4.5 + rng() * 2.5) * 1000,
      dir: rng() < 0.5 ? 1 : -1,
      wide: wide,
      skew: (rng() - 0.5) * 0.5,
      flick: 0.85 + rng() * 0.15
    };
    if (count === 1 && !saidFirst) { saidFirst = true; say('第一辆。夜里的街，还醒着。'); }
    if (count === 5) say('五辆了。有一辆大概是送晚归的人。');
    if (count >= 10 && !achieved) {
      achieved = true;
      say('第十辆。光走累了吧，你也眯一会儿——它还替你守着街。', true);
    }
    nextAt = Date.now() + nextGap();
  }

  canvas.addEventListener('pointerdown', function () {
    ensureAudio();
    // 眯一下：下一辆立刻来
    if (!sweep && Date.now() > nextAt - 900) return;
    if (!sweep) nextAt = Date.now() + 600;
  });

  // ── 声音：光扫过时一闪极低的街噪 ──
  var AC = null, noiseGain = null;
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      var len = AC.sampleRate * 2;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      var lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 320;
      noiseGain = AC.createGain();
      noiseGain.gain.value = 0;
      src.connect(lp); lp.connect(noiseGain); noiseGain.connect(AC.destination);
      src.start();
    } catch (e) { AC = null; }
  }

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.08, (now - last) / 1000);
    last = now;
    var w = L.w, h = L.h;

    if (!sweep && now >= nextAt) spawnCar();

    var glow = 0;          // 当前光带强度 0..1
    var pos = 0;           // 光带中心 0..1（屏幕横向）
    if (sweep) {
      var p = frozenP !== null ? frozenP : (now - sweep.t0) / sweep.dur;
      if (p >= 1) {
        sweep = null;
      } else {
        var ease = Math.pow(Math.sin(p * Math.PI), 0.6);
        glow = Math.min(1, ease * sweep.flick * 1.12);
        pos = sweep.dir > 0 ? p : 1 - p;
        if (noiseGain) noiseGain.gain.value = glow * 0.018;
      }
    }
    if (!sweep && noiseGain) noiseGain.gain.value *= Math.max(0, 1 - dt * 6);

    // ── 绘制 ──
    // 房间底色（天花板略暖于墙）
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#0a0c11');
    bg.addColorStop(1, '#05060a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // 车灯光带（模糊梯形，斜切天花板）
    if (sweep && glow > 0.01) {
      var bandW = (sweep.wide ? 0.34 : 0.2) * w;
      var cx = pos * (w + bandW * 2) - bandW;
      var topY = L.wallY, botY = L.bedY;
      var lean = sweep.skew * w;
      var g = ctx.createLinearGradient(0, topY, 0, botY);
      var a1 = glow * 0.38, a2 = glow * 0.13;
      g.addColorStop(0, 'rgba(255,240,206,' + a1.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,236,196,' + a2.toFixed(3) + ')');
      ctx.save();
      ctx.filter = 'blur(26px)';
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx - bandW / 2 + lean, topY);
      ctx.lineTo(cx + bandW / 2 + lean, topY);
      ctx.lineTo(cx + bandW / 2, botY);
      ctx.lineTo(cx - bandW / 2, botY);
      ctx.closePath();
      ctx.fill();
      if (sweep.wide) {
        // 双光带：中间一道暗缝
        ctx.fillStyle = 'rgba(5,6,10,' + (glow * 0.3).toFixed(3) + ')';
        ctx.fillRect(cx - bandW * 0.06 + lean * 0.6, topY, bandW * 0.12, botY - topY);
      }
      ctx.restore();
    }

    // 墙与天花板的接缝剪影
    ctx.fillStyle = 'rgba(3,4,6,0.9)';
    ctx.fillRect(0, L.wallY - 3, w, 3);
    // 被窝一角（右下）
    ctx.fillStyle = '#0c1017';
    ctx.beginPath();
    ctx.moveTo(w * 0.55, h);
    ctx.quadraticCurveTo(w * 0.72, L.bedY + 26, w, L.bedY + 6);
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,134,156,0.22)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(w * 0.55, h);
    ctx.quadraticCurveTo(w * 0.72, L.bedY + 26, w, L.bedY + 6);
    ctx.stroke();
    // 枕头
    ctx.fillStyle = '#141a24';
    ctx.beginPath();
    ctx.ellipse(w * 0.82, L.bedY + 44, w * 0.13, 30, -0.06, 0, Math.PI * 2);
    ctx.fill();

    // 车灯把枕沿照亮一点
    if (sweep && glow > 0.01) {
      ctx.fillStyle = 'rgba(255,240,206,' + (glow * 0.1).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(w * 0.82, L.bedY + 34, w * 0.1, 18, -0.06, 0, Math.PI * 2);
      ctx.fill();
    }

    // 计数（纯数字用等宽）
    ctx.fillStyle = 'rgba(120,132,150,0.75)';
    ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(String(count).padStart(2, '0') + ' 辆', w - 20, h - 20);
    ctx.textAlign = 'left';

    // 引导
    if (count === 0) {
      ctx.fillStyle = 'rgba(200,204,210,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
      ctx.font = '13px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('等一辆——或者点一下天花板，催催它', w / 2, L.wallY + 46);
      ctx.textAlign = 'left';
    }
    if (achieved) {
      ctx.fillStyle = 'rgba(200,204,210,' + (0.2 + 0.1 * Math.sin(now / 640)) + ')';
      ctx.font = '12px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('接着数也行，睡也行', w / 2, L.wallY + 46);
      ctx.textAlign = 'left';
    }
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // QA 钩子（无私人信息；与真实状态机共用）
  window.__passing = {
    count: function () { return count; },
    done: function () { return achieved; },
    trigger: function () { if (!sweep) spawnCar(); },
    sweeping: function () { return !!sweep; },
    nextIn: function () { return Math.max(0, nextAt - Date.now()); },
    freeze: function (p) {
      // 定住一条光带便于目验：p 0..1 为扫过进度
      frozenP = Math.min(0.99, Math.max(0.01, p || 0.45));
      spawnCar();
    }
  };
})();
</script>
</body>
</html>
