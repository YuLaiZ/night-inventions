<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨雾</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .stage {
    position: relative;
    margin-top: clamp(18px, 4vw, 26px);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    touch-action: manipulation;
  }
  .stage canvas { display: block; width: 100%; }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>晨雾</h1>
  <p class="sub">夜班结束的时候，雾就上来了。<em>它不是遮住夜——是把夜轻轻盖好。</em></p>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
  </div>

  <p class="hint">伸手进去搅一搅，雾会散开，再慢慢合上——像所有没说完的话。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var W = 0, H = 0;

  var ridges = [];
  var fog = [];
  var stir = { x: -999, y: -999, t: 0 };
  var lastFrame = Date.now();

  function resize() {
    var w = stage.clientWidth;
    var h = Math.round(Math.min(400, Math.max(300, w * 0.72)));
    cv.width = w;
    cv.height = h;
    cv.style.height = h + 'px';
    W = w; H = h;
    buildRidges();
    if (fog.length === 0) seedFog();
  }

  function buildRidges() {
    ridges = [];
    var layers = [
      { y: 0.46, amp: 0.10, col: 'rgba(20, 34, 46, 0.9)', seed: Math.random() * 10 },
      { y: 0.56, amp: 0.08, col: 'rgba(26, 42, 54, 0.9)', seed: Math.random() * 10 },
      { y: 0.68, amp: 0.07, col: 'rgba(34, 52, 62, 0.9)', seed: Math.random() * 10 },
      { y: 0.80, amp: 0.05, col: 'rgba(44, 62, 70, 0.9)', seed: Math.random() * 10 }
    ];
    layers.forEach(function (L) {
      var pts = [];
      for (var x = -10; x <= W + 10; x += 14) {
        var y = H * L.y + Math.sin(x / 90 + L.seed) * H * L.amp * 0.5 +
          Math.sin(x / 37 + L.seed * 2) * H * L.amp * 0.28;
        pts.push({ x: x, y: y });
      }
      ridges.push({ pts: pts, col: L.col });
    });
  }

  function seedFog() {
    fog = [];
    for (var i = 0; i < 26; i++) {
      fog.push({
        x: Math.random() * W,
        y: H * 0.38 + Math.random() * H * 0.5,
        r: 34 + Math.random() * 60,
        vx: (Math.random() < 0.5 ? -1 : 1) * (3 + Math.random() * 5),
        dx: 0, dy: 0,               /* 被搅动后的位移 */
        a: 0.05 + Math.random() * 0.06
      });
    }
  }

  function step(dt, now) {
    var stirring = now - stir.t < 900;
    for (var i = 0; i < fog.length; i++) {
      var f = fog[i];
      f.x += f.vx * dt;
      if (f.x < -f.r) f.x = W + f.r;
      if (f.x > W + f.r) f.x = -f.r;
      /* 搅动：靠近手指的雾被推开，随后弹回 */
      if (stirring) {
        var dx = f.x - stir.x, dy = f.y - stir.y;
        var d2 = dx * dx + dy * dy;
        var R = 110;
        if (d2 < R * R && d2 > 1) {
          var d = Math.sqrt(d2);
          var push = (1 - d / R) * 46 * dt;
          f.dx += dx / d * push;
          f.dy += dy / d * push * 0.6;
        }
      }
      f.dx *= (1 - 1.4 * dt);
      f.dy *= (1 - 1.4 * dt);
    }
  }

  function draw(now) {
    /* 天色：夜蓝向晨灰蓝缓变（按页面打开后 3 分钟内完成一轮微变） */
    var k = Math.min(1, (now % 180000) / 180000);
    var top = mix([7, 11, 18], [42, 58, 74], k * 0.5);
    var bot = mix([13, 21, 34], [88, 104, 116], k * 0.4);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(top));
    g.addColorStop(1, rgb(bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 山影 */
    for (var r = 0; r < ridges.length; r++) {
      ctx.fillStyle = ridges[r].col;
      ctx.beginPath();
      var pts = ridges[r].pts;
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.lineTo(W + 10, H + 10);
      ctx.lineTo(-10, H + 10);
      ctx.closePath();
      ctx.fill();
    }

    /* 雾：大半径低透明圆，随搅动位移 */
    for (var f = 0; f < fog.length; f++) {
      var fo = fog[f];
      var fg = ctx.createRadialGradient(fo.x + fo.dx, fo.y + fo.dy, 0, fo.x + fo.dx, fo.y + fo.dy, fo.r);
      fg.addColorStop(0, 'rgba(196, 210, 224, ' + fo.a + ')');
      fg.addColorStop(1, 'rgba(196, 210, 224, 0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(fo.x + fo.dx, fo.y + fo.dy, fo.r, 0, 6.29);
      ctx.fill();
    }
  }

  function mix(a, b, k) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * k),
      Math.round(a[1] + (b[1] - a[1]) * k),
      Math.round(a[2] + (b[2] - a[2]) * k)
    ];
  }
  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  function loop() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    step(dt, now);
    draw(now);
    setTimeout(loop, 60);
  }

  stage.addEventListener('pointermove', function (ev) {
    var rect = stage.getBoundingClientRect();
    stir.x = ev.clientX - rect.left;
    stir.y = ev.clientY - rect.top;
    stir.t = Date.now();
  });
  stage.addEventListener('pointerdown', function (ev) {
    var rect = stage.getBoundingClientRect();
    stir.x = ev.clientX - rect.left;
    stir.y = ev.clientY - rect.top;
    stir.t = Date.now();
  });

  window.addEventListener('resize', function () { resize(); draw(Date.now()); });
  resize();
  loop();
})();
</script>
</body>
</html>
