<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡前一签</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d0c0a;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #8a857c;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #b09468; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #6e695c; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #93876f;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #57534b;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #6d675c;
    text-decoration: none;
    border-bottom: 1px dotted #6d675c;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #b09468; border-color: #b09468; }

  /* 签纸 */
  .stick {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -52%);
    width: 150px; min-height: 340px;
    background: linear-gradient(178deg, #efe5c8 0%, #e0d3ae 100%);
    border-radius: 8px 8px 60px 60px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.55), inset 0 0 40px rgba(150,120,70,0.14);
    padding: 26px 16px 30px;
    z-index: 2;
    text-align: center;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .stick.hidden { opacity: 0; transform: translate(-50%, -44%) scale(0.96); }
  .stick .no {
    font-size: 15px; letter-spacing: 0.3em;
    color: #7a5c38; font-weight: 600;
    margin-bottom: 4px;
  }
  .stick .grade {
    display: inline-block;
    font-size: 13px; letter-spacing: 0.34em; padding-left: 0.34em;
    color: #b4472f;
    border-top: 1px solid rgba(122,92,56,0.4);
    border-bottom: 1px solid rgba(122,92,56,0.4);
    padding-top: 8px; padding-bottom: 8px;
    margin: 10px 0 16px;
  }
  .stick .line {
    font-size: 13.5px; line-height: 2.1; letter-spacing: 0.1em;
    color: #4a4438;
    margin: 0 0 6px;
  }
  .stick .line b { color: #8a5a28; font-weight: 600; }
  .stick .note {
    font-size: 11.5px; line-height: 1.9; letter-spacing: 0.08em;
    color: #857a5f;
    border-top: 1px dashed rgba(122,92,56,0.35);
    padding-top: 12px; margin-top: 14px;
  }
  .btns {
    position: absolute;
    left: 0; right: 0; bottom: 15vh;
    display: flex; justify-content: center; gap: 18px;
    z-index: 3;
  }
  .btns button {
    background: none;
    border: 1px solid rgba(190,170,130,0.5);
    color: #bfae86;
    font-family: inherit;
    font-size: 13px; letter-spacing: 0.22em; padding-left: calc(0.22em + 20px);
    padding: 10px 20px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.25s, color 0.25s;
  }
  .btns button:hover { border-color: #b09468; color: #e0d0a8; }
  .shake {
    position: absolute;
    left: 50%; top: 58%;
    transform: translateX(-50%);
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>睡前一签</h1>
  <p>床头的签筒，摇一支今晚的签。<br>不求前程，只问：今晚睡不睡得着。</p>
</div>

<div class="shake" id="shakezone">
  <svg id="tube" width="120" height="150" viewBox="0 0 120 150">
    <g id="tubeg">
      <path d="M30 30 L90 30 L82 140 L38 140 Z" fill="#3a3026" stroke="#5a4c38" stroke-width="2"/>
      <ellipse cx="60" cy="30" rx="30" ry="9" fill="#4a3f30" stroke="#5a4c38" stroke-width="2"/>
      <g id="sticks" stroke="#c8b088" stroke-width="3" stroke-linecap="round">
        <line x1="45" y1="28" x2="42" y2="6"/>
        <line x1="58" y1="27" x2="59" y2="4"/>
        <line x1="72" y1="28" x2="76" y2="8"/>
        <line x1="52" y1="27" x2="50" y2="2"/>
      </g>
    </g>
  </svg>
</div>

<div class="stick hidden" id="stick">
  <div class="no" id="ono">第 X 签</div>
  <div class="grade" id="grade">——</div>
  <div class="line" id="yi"></div>
  <div class="line" id="ji"></div>
  <div class="note" id="note"></div>
</div>

<div class="btns">
  <button id="draw">摇一支</button>
  <button id="again" style="display:none">再摇一支</button>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  function say(text, hold) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!hold) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5200);
  }

  // ── 签文池 ──
  var GRADES = ['上上签', '上吉签', '中吉签', '中平签'];
  var YI = ['宜：早睡', '宜：把手机放远一点', '宜：缩进被窝', '宜：原谅今天的自己', '宜：听一会儿雨', '宜：什么都不想'];
  var JI = ['忌：数楼下的车', '忌：复盘今天说过的每句话', '忌：再刷十分钟', '忌：惦记明天的会', '忌：追究失眠的原因', '忌：跟月亮较劲'];
  var NOTES = [
    '今夜的你已经做得够多了。剩下的交给枕头。',
    '签文仅供参考。真正护你的是你自己的困意。',
    '此签有效期至天亮。过期自动作废，不用管它。',
    '摇到这支的人，今晚允许什么都不想。',
    '烦躁是还没卸的行李。签上说：可以卸了。',
    '解签人睡着了。她的意思是：你也睡吧。'
  ];

  var stick = document.getElementById('stick');
  var ono = document.getElementById('ono');
  var grade = document.getElementById('grade');
  var yiEl = document.getElementById('yi');
  var jiEl = document.getElementById('ji');
  var noteEl = document.getElementById('note');
  var drawBtn = document.getElementById('draw');
  var againBtn = document.getElementById('again');
  var tubeg = document.getElementById('tubeg');
  var shakezone = document.getElementById('shakezone');

  var shaking = false;
  var shakeA = 0;
  var drawn = false;

  function rnd(i) { return Math.abs(Math.sin(i * 127.1 + 231.7) * 43758.5453) % 1; }

  function drawFortune() {
    shaking = true;
    drawn = true;
    stick.classList.add('hidden');
    againBtn.style.display = 'none';
    var shakeStart = Date.now();
    var iv = setInterval(function () {
      var t = (Date.now() - shakeStart) / 1000;
      shakeA = Math.sin(t * 22) * Math.max(0, 1 - t / 1.4) * 10;
      tubeg.setAttribute('transform', 'rotate(' + shakeA + ' 60 140)');
      if (t > 1.5) {
        clearInterval(iv);
        shaking = false;
        shakeA = 0;
        tubeg.setAttribute('transform', '');
        reveal();
      }
    }, 40);
  }

  function reveal() {
    var no = 1 + Math.floor(rnd(Date.now() | 0) * 64);
    var gr = GRADES[Math.floor(Math.random() * GRADES.length)];
    var yi = YI[Math.floor(Math.random() * YI.length)];
    var ji = JI[Math.floor(Math.random() * JI.length)];
    var note = NOTES[Math.floor(Math.random() * NOTES.length)];
    ono.textContent = '第 ' + no + ' 签';
    grade.textContent = gr;
    yiEl.innerHTML = '<b>宜</b>　' + yi.replace('宜：', '');
    jiEl.innerHTML = '<b>忌</b>　' + ji.replace('忌：', '');
    noteEl.textContent = note;
    stick.classList.remove('hidden');
    if (no <= 64) say('签文纯属好玩。睡意才是正解。');
  }

  drawBtn.addEventListener('click', drawFortune);
  againBtn.addEventListener('click', drawFortune);

  // ── 背景氛围：暗殿+烛光 ──
  function layout() {
    canvas.width = innerWidth * DPR;
    canvas.height = innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', layout);
  layout();

  function tick() {
    var nowT = Date.now();
    var w = innerWidth, h = innerHeight;
    var bg = ctx.createRadialGradient(w / 2, h * 0.55, 20, w / 2, h * 0.55, Math.max(w, h) * 0.7);
    var flick = 0.9 + 0.1 * Math.sin(nowT / 230) + 0.04 * Math.sin(nowT / 71);
    bg.addColorStop(0, 'rgba(60,48,30,' + 0.5 * flick + ')');
    bg.addColorStop(1, '#0b0a08');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    // 供桌一线
    ctx.fillStyle = 'rgba(80,64,40,' + 0.25 * flick + ')';
    ctx.fillRect(0, h * 0.78, w, 3);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // QA 钩子（无私人信息）
  window.__oracle = {
    shaking: function () { return shaking; },
    drawn: function () { return drawn; },
    draw: drawFortune,
    no: function () { return ono.textContent; }
  };
})();
</script>
</body>
</html>
