<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜的声音</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0c0d10;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #7f828a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #8b90a0; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #61646e; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #85889a;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #53555e;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #666872;
    text-decoration: none;
    border-bottom: 1px dotted #666872;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #8b90a0; border-color: #8b90a0; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>深夜的声音</h1>
  <p>房间黑下来之后，其实并不安静。<br>按住屏幕，闭上眼听——数一数，有几种声音。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  function say(text, hold) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!hold) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5200);
  }

  var listening = false;    // 按住聆听
  var listenT = 0;          // 聆听累计
  var revealed = 0;         // 已浮现的声源数
  var saidBreath = false, saidQuiet = false, saidOff = false;

  // 声源定义（相对布局系数）
  var SOURCES = [
    { fx: 0.18, fy: 0.30, name: '冰箱的嗡嗡', period: 3.2, label: true },   // 左上
    { fx: 0.80, fy: 0.24, name: '远处的车',   period: 4.6, label: true },   // 右上
    { fx: 0.72, fy: 0.66, name: '楼上的水管', period: 2.4, label: true },   // 右下
    { fx: 0.26, fy: 0.68, name: '窗缝的风',   period: 3.8, label: true }    // 左下
  ];

  var L = {};
  function layout() {
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * DPR;
    canvas.height = h * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var s = Math.max(0.62, Math.min(1, Math.min(w / 780, h / 880)));
    L.w = w; L.h = h; L.s = s;
    L.cx = w / 2; L.cy = h * 0.52;
  }
  window.addEventListener('resize', layout);
  layout();

  canvas.addEventListener('pointerdown', function () { listening = true; });
  window.addEventListener('pointerup', function () { listening = false; });
  window.addEventListener('pointercancel', function () { listening = false; });

  function rnd(i) { return Math.abs(Math.sin(i * 127.1 + 451.3) * 43758.5453) % 1; }

  var last = Date.now();
  function tick() {
    var nowT = Date.now();
    var dt = Math.min(0.05, (nowT - last) / 1000);
    last = nowT;
    var w = L.w, h = L.h, s = L.s;

    if (listening) {
      listenT += dt;
      revealed = Math.min(SOURCES.length + 1, Math.floor(listenT / 2.6));  // 每 2.6 秒醒一个
      if (revealed >= SOURCES.length && !saidBreath) {
        saidBreath = true;
        say('还有一种声音，是你自己的呼吸。');
      }
    } else {
      listenT = Math.max(0, listenT - dt * 1.4);
      revealed = Math.min(revealed, Math.floor(listenT / 2.6));
      if (saidBreath && !saidQuiet && listenT <= 0.2) {
        saidQuiet = true;
        say('深夜的房间，从来都不安静。但它们都在陪你。', true);
      }
      if (listenT < 0.1 && !saidOff && saidQuiet) { saidOff = true; }
    }

    // ── 背景：黑暗房间俯视 ──
    var bg = ctx.createRadialGradient(L.cx, L.cy, 30, L.cx, L.cy, Math.max(w, h) * 0.75);
    bg.addColorStop(0, '#16151c');
    bg.addColorStop(1, '#0b0b0e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // 地板暗纹
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    for (var fl = 0; fl < 6; fl++) {
      var fy2 = h * (0.12 + fl * 0.15);
      ctx.beginPath(); ctx.moveTo(0, fy2); ctx.lineTo(w, fy2 + 8); ctx.stroke();
    }

    // ── 声源 ──
    for (var i = 0; i < SOURCES.length; i++) {
      var sc = SOURCES[i];
      var sx = sc.fx * w, sy = sc.fy * h;
      var awake = listening && revealed > i;
      // 声源小剪影
      ctx.fillStyle = awake ? 'rgba(180,190,215,0.5)' : 'rgba(120,125,140,0.22)';
      if (i === 0) {           // 冰箱（矩形）
        ctx.fillRect(sx - 12 * s, sy - 18 * s, 24 * s, 34 * s);
        ctx.fillRect(sx - 10 * s, sy - 14 * s, 8 * s, 2 * s);
      } else if (i === 1) {    // 窗/街（竖窗框）
        ctx.strokeStyle = awake ? 'rgba(180,190,215,0.5)' : 'rgba(120,125,140,0.22)';
        ctx.lineWidth = 2.4 * s;
        ctx.strokeRect(sx - 14 * s, sy - 20 * s, 28 * s, 34 * s);
        ctx.beginPath(); ctx.moveTo(sx, sy - 20 * s); ctx.lineTo(sx, sy + 14 * s); ctx.stroke();
      } else if (i === 2) {    // 水管（竖管两道）
        ctx.fillRect(sx - 10 * s, sy - 22 * s, 6 * s, 40 * s);
        ctx.fillRect(sx + 2 * s, sy - 16 * s, 6 * s, 34 * s);
      } else {                 // 风缝（斜线两道）
        ctx.strokeStyle = awake ? 'rgba(180,190,215,0.5)' : 'rgba(120,125,140,0.22)';
        ctx.lineWidth = 2 * s;
        ctx.beginPath(); ctx.moveTo(sx - 12 * s, sy - 14 * s); ctx.lineTo(sx + 4 * s, sy + 14 * s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx + 2 * s, sy - 18 * s); ctx.lineTo(sx + 18 * s, sy + 10 * s); ctx.stroke();
      }
      // 涟漪（醒着时按各自节奏泛圈）
      if (awake) {
        var ph = (nowT / 1000 / sc.period + i * 0.37) % 1;
        var rr = 12 * s + ph * (52 + i * 8) * s;
        ctx.strokeStyle = 'rgba(185,195,225,' + (1 - ph) * 0.35 + ')';
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(sx, sy, rr, 0, Math.PI * 2); ctx.stroke();
        if (ph > 0.3) {
          var rr2 = 12 * s + (ph - 0.3) / 0.7 * (40 + i * 7) * s;
          ctx.strokeStyle = 'rgba(185,195,225,' + (1 - (ph - 0.3) / 0.7) * 0.2 + ')';
          ctx.beginPath(); ctx.arc(sx, sy, rr2, 0, Math.PI * 2); ctx.stroke();
        }
      }
      // 标签（醒着时浮现）
      if (awake && sc.label) {
        var la = Math.min(1, (listenT - (i + 1) * 2.6 + 1.2)) * 0.55;
        if (la > 0) {
          ctx.fillStyle = 'rgba(195,200,225,' + la + ')';
          ctx.font = Math.round(12 * s) + 'px system-ui, "PingFang SC", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(sc.name, sx, sy + (i === 0 || i === 1 ? 40 * s : -30 * s));
        }
      }
    }

    // ── 床与呼吸（中央）——最后一个「声源」──
    var breathA = (revealed >= SOURCES.length && listening) ? 1 : 0;
    if (breathA) saidBreath = saidBreath || false;
    var pw = 200 * s, ph = 74 * s;
    var br = 0.5 + 0.5 * Math.sin(nowT / 1000 * Math.PI * 2 / 4.5);
    ctx.fillStyle = 'rgba(216,210,196,' + (0.75 - breathA * 0.1) + ')';
    roundRect(L.cx - pw / 2, L.cy - ph / 2 - br * 3 * s, pw, ph + br * 3 * s, 30 * s);
    ctx.fill();
    // 你（小剪影躺在枕上）
    ctx.fillStyle = 'rgba(60,58,80,0.85)';
    ctx.beginPath();
    ctx.ellipse(L.cx - 30 * s, L.cy - 6 * s, 26 * s, 16 * s, 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(60,58,80,0.85)';
    ctx.beginPath(); ctx.arc(L.cx + 2 * s, L.cy - 14 * s + br * 2 * s, 10 * s, 0, Math.PI * 2); ctx.fill();
    // 呼吸涟漪（从胸口）
    if (breathA) {
      var bph = (nowT / 1000 / 4.5) % 1;
      ctx.strokeStyle = 'rgba(200,205,230,' + (1 - bph) * 0.3 * br + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(L.cx, L.cy, 30 * s + bph * 70 * s, 16 * s + bph * 34 * s, 0, 0, Math.PI * 2);
      ctx.stroke();
      if (saidBreath) {
        ctx.fillStyle = 'rgba(200,205,230,' + 0.55 * br + ')';
        ctx.font = Math.round(12 * s) + 'px system-ui, "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('你的呼吸', L.cx, L.cy - 56 * s);
      }
    }

    // 引导
    if (!listening && listenT < 0.1) {
      ctx.fillStyle = 'rgba(160,164,180,' + (0.3 + 0.2 * Math.sin(nowT / 520)) + ')';
      ctx.font = '13px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('按住屏幕，闭上眼听', w / 2, h * 0.88);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // QA 钩子（无私人信息）
  window.__sound = {
    listening: function () { return listening; },
    listenT: function () { return +listenT.toFixed(1); },
    revealed: function () { return revealed; },
    press: function () { listening = true; },
    release: function () { listening = false; }
  };
})();
</script>
</body>
</html>
