<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拨算盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d1218;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #4a4a44;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #c88a6a; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #7a6250; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #c88a6a;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #565a54;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #7a6250;
    text-decoration: none;
    border-bottom: 1px dotted #7a6250;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #c88a6a; border-color: #c88a6a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>拨算盘</h1>
  <p>打烊了，账要平。一颗珠一句账——<br>上珠一句「进货」，下珠一句「卖粥」，拨完睡个踏实觉。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var TARGET = 10;      // 拨满 10 颗账平
  var counted = 0;
  var beads = [];       // {col, row, pos(0左1右), anim, from, to}
  var saidStart = false;
  var resting = false;
  var seed = 20260916;
  var clickFlash = 0;
  var flashX = 0, flashY = 0;

  var LINES = [
    '豆浆三碗，收九文',
    '油条两根，赊了',
    '茶叶蛋四颗，收八文',
    '煤钱，支出十五文',
    '抹零，让了一文',
    '老主顾还了上月的账',
    '新到的豆子，订金五文',
    '烟囱修一回，两文',
    '碎碗一只，自认',
    '明日的豆子，泡上了'
  ];

  function mulberry(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function say(text, holdLong) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!holdLong) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5600);
  }

  var L = {};
  function layout() {
    L.w = window.innerWidth;
    L.h = window.innerHeight;
    L.floorY = L.h * 0.78;
    L.ax = L.w * 0.46;               // 算盘中心
    L.ay = L.h * 0.56;
    L.aW = Math.min(L.w * 0.72, L.h * 0.6, 640);   // 算盘宽
    L.aH = L.aW * 0.52;              // 算盘高
    L.cols = 7;                      // 7 档
    L.rows = 2;                      // 上梁 1 珠 / 下梁 4 珠（每档可拨的）
    // 可拨珠：每档上梁 1 颗 + 下梁 1 颗（只取代表珠），共 14 颗
  }
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  window.addEventListener('resize', function () {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  });

  // 可拨珠：col 0..6，row 0（上梁）或 1（下梁）
  (function () {
    var rng = mulberry(seed);
    for (var c = 0; c < 7; c++) {
      for (var r = 0; r < 2; r++) {
        beads.push({
          col: c, row: r,
          pos: rng() < 0.5 ? 0 : 1,   // 0 左/靠梁左，1 右
          anim: 1, from: 0, to: 0,
          counted: false
        });
      }
    }
  })();

  function beadXY(b) {
    var cellW = (L.aW - L.aW * 0.1) / 7;
    var x = L.ax - L.aW / 2 + L.aW * 0.05 + cellW * (b.col + 0.5);
    var y;
    if (b.row === 0) {
      y = L.ay - L.aH * 0.24 + (b.pos ? 14 : -14);
    } else {
      y = L.ay + L.aH * 0.26 + (b.pos ? 14 : -14);
    }
    return { x: x, y: y, cellW: cellW };
  }

  // 嗒声
  var AC = null;
  function click() {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      var osc = AC.createOscillator();
      var g2 = AC.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 1400 + Math.random() * 300;
      var t0 = AC.currentTime;
      g2.gain.setValueAtTime(0.12, t0);
      g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.07);
      osc.connect(g2); g2.connect(AC.destination);
      osc.start(t0); osc.stop(t0 + 0.08);
    } catch (e) { AC = null; }
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (resting) {
      resting = false;
      counted = 0;
      var rng = mulberry(seed);
      for (var i = 0; i < beads.length; i++) {
        beads[i].pos = rng() < 0.5 ? 0 : 1;
        beads[i].counted = false;
        beads[i].anim = 1;
      }
      saidStart = false;
      return;
    }
    if (counted >= TARGET) return;
    // 找最近的可拨珠
    var best = -1, bestD = 1e9;
    for (var i = 0; i < beads.length; i++) {
      var b = beads[i];
      if (b.anim < 1) continue;
      var p = beadXY(b);
      var dx = p.x - ev.clientX, dy = p.y - ev.clientY;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0 && bestD < Math.pow(L.aH * 0.16, 2)) {
      var bb = beads[best];
      var p2 = beadXY(bb);
      bb.from = bb.pos;
      bb.to = 1 - bb.pos;
      bb.anim = 0.001;
      bb.pos = bb.to;
      if (!bb.counted) {
        bb.counted = true;
        counted++;
      }
      click();
      clickFlash = 1; flashX = p2.x; flashY = p2.y;
      if (counted === 1) { saidStart = true; say('「' + LINES[0] + '」。' + (TARGET - counted) + ' 句没念。'); }
      else if (counted < TARGET) say('「' + LINES[(counted - 1) % LINES.length] + '」。还差 ' + (TARGET - counted) + ' 句。');
      if (counted >= TARGET) {
        resting = true;
        say('账平了。一分不差——睡个踏实觉。', true);
      }
    }
  });

  var last = Date.now();

  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var w = L.w, h = L.h;

    for (var i = 0; i < beads.length; i++) {
      if (beads[i].anim < 1) beads[i].anim = Math.min(1, beads[i].anim + dt * 5);
    }
    if (clickFlash > 0) clickFlash = Math.max(0, clickFlash - dt * 3);

    // ── 背景：灯下账桌 ──
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#0c0f14');
    bg.addColorStop(1, '#15120e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    // 灯光晕
    var lg = ctx.createRadialGradient(L.ax, L.ay - L.aH * 0.2, 0, L.ax, L.ay - L.aH * 0.2, L.aW * 0.75);
    lg.addColorStop(0, 'rgba(232,176,104,0.13)');
    lg.addColorStop(1, 'rgba(232,176,104,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, w, h);
    // 桌面
    ctx.fillStyle = '#1c150e';
    ctx.fillRect(0, L.floorY, w, h - L.floorY);
    ctx.fillStyle = 'rgba(122,96,62,0.35)';
    ctx.fillRect(0, L.floorY, w, 2);

    // ── 账本（左上摊开）──
    var bkX = Math.max(30, L.ax - L.aW * 0.62);
    var bkY = L.h * 0.24;
    ctx.save();
    ctx.translate(bkX, bkY);
    ctx.rotate(-0.03);
    ctx.fillStyle = '#d8cba8';
    ctx.fillRect(0, 0, 150, 92);
    ctx.strokeStyle = 'rgba(120,100,70,0.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, 0, 150, 92);
    ctx.fillStyle = 'rgba(90,74,52,0.75)';
    ctx.font = '11px system-ui, "PingFang SC", sans-serif';
    for (var li = 0; li < Math.min(counted, LINES.length); li++) {
      ctx.fillText('· ' + LINES[li], 10, 22 + li * 14);
    }
    if (counted === 0) {
      ctx.fillText('（今日流水）', 10, 22);
    }
    ctx.restore();

    // ── 算盘 ──
    var ax = L.ax, ay = L.ay, aW = L.aW, aH = L.aH;
    // 框
    var fr = ctx.createLinearGradient(ax - aW / 2, 0, ax + aW / 2, 0);
    fr.addColorStop(0, '#6b4a28');
    fr.addColorStop(0.5, '#8a6236');
    fr.addColorStop(1, '#5c3f20');
    ctx.fillStyle = fr;
    ctx.fillRect(ax - aW / 2, ay - aH / 2, aW, aH * 0.1);
    ctx.fillRect(ax - aW / 2, ay + aH / 2 - aH * 0.1, aW, aH * 0.1);
    ctx.fillRect(ax - aW / 2, ay - aH / 2, aW * 0.04, aH);
    ctx.fillRect(ax + aW / 2 - aW * 0.04, ay - aH / 2, aW * 0.04, aH);
    // 横梁
    ctx.fillStyle = '#5c3f20';
    ctx.fillRect(ax - aW / 2, ay - aH * 0.02, aW, aH * 0.05);
    // 档杆
    ctx.strokeStyle = 'rgba(40,28,15,0.8)';
    ctx.lineWidth = 2;
    var cellW = (aW - aW * 0.1) / 7;
    for (var c2 = 0; c2 <= 7; c2++) {
      var rx2 = ax - aW / 2 + aW * 0.05 + cellW * c2;
      ctx.beginPath();
      ctx.moveTo(rx2, ay - aH / 2 + aH * 0.1);
      ctx.lineTo(rx2, ay + aH / 2 - aH * 0.1);
      ctx.stroke();
    }

    // 算珠（先画未动画的，动画中的后画盖顶）
    var order = [];
    for (var bi = 0; bi < beads.length; bi++) order.push(bi);
    order.sort(function (a, b) { return beads[a].anim - beads[b].anim; });
    for (var oi = 0; oi < order.length; oi++) {
      var b2 = beads[order[oi]];
      var p0 = beadXY({ col: b2.col, row: b2.row, pos: b2.anim < 1 ? b2.from : b2.pos });
      var p1 = beadXY({ col: b2.col, row: b2.row, pos: b2.pos });
      var ease = 1 - Math.pow(1 - b2.anim, 3);
      var bx2 = p0.x + (p1.x - p0.x) * ease;
      var by2 = p0.y + (p1.y - p0.y) * ease;
      var br = Math.min(cellW * 0.34, aH * 0.14);
      var bg3 = ctx.createRadialGradient(bx2 - br * 0.3, by2 - br * 0.4, br * 0.15, bx2, by2, br);
      bg3.addColorStop(0, '#a5793e');
      bg3.addColorStop(0.7, '#7d5626');
      bg3.addColorStop(1, '#5e3f1a');
      ctx.fillStyle = bg3;
      ctx.beginPath();
      ctx.arc(bx2, by2, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,230,180,0.35)';
      ctx.beginPath();
      ctx.ellipse(bx2 - br * 0.3, by2 - br * 0.35, br * 0.24, br * 0.13, -0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 点击闪光
    if (clickFlash > 0) {
      ctx.globalAlpha = clickFlash;
      ctx.strokeStyle = '#f0d9a8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(flashX, flashY, 12 + (1 - clickFlash) * 16, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 进度（账本下角：句号点）
    for (var ni = 0; ni < TARGET; ni++) {
      ctx.fillStyle = ni < counted ? 'rgba(216,203,168,0.85)' : 'rgba(216,203,168,0.18)';
      ctx.beginPath();
      ctx.arc(bkX + 160 + ni * 14, bkY + 46, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 引导
    if (!saidStart && counted === 0) {
      ctx.fillStyle = 'rgba(200,138,106,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
      ctx.font = '13px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('点一颗算珠，念一句账', ax, ay + aH / 2 + 30);
      ctx.textAlign = 'left';
    }
    if (resting) {
      ctx.fillStyle = 'rgba(230,210,170,' + (0.34 + 0.16 * Math.sin(now / 600)) + ')';
      ctx.font = '12px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('再对一遍账', ax, ay + aH / 2 + 30);
      ctx.textAlign = 'left';
    }
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // QA 钩子（无私人信息；与真实点击共用判定）
  window.__abacus = {
    counted: function () { return counted; },
    done: function () { return resting; },
    beadCount: function () { return beads.length; },
    tap: function (i) {
      if (resting || counted >= TARGET) return;
      var bb = beads[i];
      if (!bb || bb.anim < 1) return;
      var p2 = beadXY(bb);
      bb.from = bb.pos;
      bb.to = 1 - bb.pos;
      bb.anim = 0.001;
      bb.pos = bb.to;
      if (!bb.counted) { bb.counted = true; counted++; }
      click();
      if (counted >= TARGET) { resting = true; say('账平了。一分不差——睡个踏实觉。', true); }
      else if (!saidStart) { saidStart = true; say('「' + LINES[0] + '」。' + (TARGET - counted) + ' 句没念。'); }
    }
  };
})();
</script>
</body>
</html>
