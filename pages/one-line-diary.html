<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一句话日记</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .write {
    margin-top: clamp(18px, 4vw, 26px);
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(16, 24, 40, 0.6);
    padding: clamp(16px, 4vw, 24px);
  }
  textarea {
    width: 100%;
    min-height: 84px;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--ink-strong);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.8;
  }
  textarea::placeholder { color: var(--ink-dim); opacity: 0.7; }
  .wrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }
  .wrow .cnt { color: var(--ink-dim); font-size: 12.5px; font-family: var(--mono); }
  button.act {
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.1em;
    border: none;
    border-radius: 999px;
    padding: 9px 26px;
    cursor: pointer;
    color: var(--bg-0);
    background: var(--gold);
  }
  button.act:hover { filter: brightness(1.08); }
  button.act:active { transform: scale(0.97); }
  button.act:disabled { opacity: 0.45; cursor: default; }

  .shelf { margin-top: clamp(16px, 4vw, 22px); }
  .shelf .s-head {
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.14em;
    margin-bottom: 8px;
  }
  .drawer {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(10, 14, 24, 0.6);
    padding: 6px 16px;
    max-height: 260px;
    overflow-y: auto;
  }
  .drawer .d-row {
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .drawer .d-row:last-child { border-bottom: none; }
  .drawer .d-date {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--gold);
    font-size: 12.5px;
    flex: 0 0 auto;
  }
  .drawer .d-text { color: var(--ink); font-size: 14.5px; }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>一句话日记</h1>
  <p class="sub">一天只许写一句。<em>写多了就不是日记，是检讨。</em></p>

  <div class="write">
    <textarea id="input" maxlength="60" placeholder="今天，只挑一件最值得记住的——一句话就够。"></textarea>
    <div class="wrow">
      <span class="cnt" id="cnt">0 / 60</span>
      <button class="act" id="lockBtn" type="button">锁进抽屉</button>
    </div>
  </div>

  <div class="shelf">
    <div class="s-head">抽屉里的日子（只存在这台设备上）</div>
    <div class="drawer" id="drawer"></div>
  </div>

  <p class="hint">锁进去就改不了了。日子和字一样，写完那天就算数。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var input = document.getElementById('input');
  var cnt = document.getElementById('cnt');
  var lockBtn = document.getElementById('lockBtn');
  var drawer = document.getElementById('drawer');
  var KEY = 'night-diary-v1';

  function todayKey() {
    var d = new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }

  function loadAll() {
    try {
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function saveAll(obj) {
    try { localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) { /* 隐私模式：只能陪你这一晚 */ }
  }

  function render() {
    var all = loadAll();
    var keys = Object.keys(all).sort().reverse();
    drawer.innerHTML = '';
    if (keys.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'd-row';
      empty.innerHTML = '<span class="d-text" style="color:var(--ink-dim)">抽屉是空的。第一句，从今晚开始。</span>';
      drawer.appendChild(empty);
      return;
    }
    keys.forEach(function (k) {
      var row = document.createElement('div');
      row.className = 'd-row';
      var date = document.createElement('span');
      date.className = 'd-date';
      date.textContent = k;
      var text = document.createElement('span');
      text.className = 'd-text';
      text.textContent = all[k];
      row.appendChild(date);
      row.appendChild(text);
      drawer.appendChild(row);
    });
  }

  function refreshLock() {
    var all = loadAll();
    var done = all[todayKey()] !== undefined;
    lockBtn.disabled = done;
    lockBtn.textContent = done ? '今天已锁 ✓' : '锁进抽屉';
    input.disabled = done;
    if (done) input.value = all[todayKey()];
  }

  input.addEventListener('input', function () {
    cnt.textContent = input.value.length + ' / 60';
  });

  lockBtn.addEventListener('click', function () {
    var txt = input.value.trim();
    if (!txt || lockBtn.disabled) return;
    var all = loadAll();
    all[todayKey()] = txt;
    saveAll(all);
    render();
    refreshLock();
  });

  render();
  refreshLock();
})();
</script>
</body>
</html>
