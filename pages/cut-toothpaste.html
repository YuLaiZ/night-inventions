<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剪开牙膏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #e8e2d2;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #4a4438;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .copy {
    position: absolute; top: 36px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #6a6456; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #7a7466; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 6vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; line-height: 2;
    letter-spacing: 0.08em;
    color: #4a4438;
    min-height: 30px;
    opacity: 0;
    transition: opacity 0.9s ease;
    z-index: 3;
    padding: 0 30px;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #8a8578;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #6a6558;
    text-decoration: none;
    border-bottom: 1px dotted #6a6558;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #8a8578; border-color: #8a8578; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>剪开牙膏</h1>
  <p>这支牙膏怎么挤都挤不出来了。<br>但你懂的——剪开一看，里面还藏着两次的量。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var squeezes = 0;        // 已挤次数（管尾卷起进度）
  var cut = false;         // 是否已剪开
  var pasteOnBrush = 0;    // 刷子上牙膏量 0..2
  var capTimer2 = null;

  function say(text) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    capTimer = setTimeout(function () { caption.classList.remove('show'); }, 4600);
  }

  function resize() {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = now;
    var w = window.innerWidth, h = window.innerHeight;

    // 浴室台面背景（浅色）
    ctx.fillStyle = '#dcd5c2';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(0, 0, w, h * 0.35);

    // 牙刷（左下，斜放）
    var bx = w * 0.22, by = h * 0.66;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(-0.5);
    ctx.fillStyle = '#5a7a9a';
    roundRect(-16, -9, 130, 18, 8);
    ctx.fill();
    ctx.fillStyle = '#e8e2d2';
    roundRect(88, -12, 44, 24, 6);
    ctx.fill();
    // 刷毛上的牙膏
    if (pasteOnBrush > 0) {
      ctx.fillStyle = '#7ac9c9';
      var amount = pasteOnBrush * 16;
      ctx.beginPath();
      ctx.ellipse(110, -14, 12 + amount * 0.4, 7 + amount * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 牙膏管（右上，随挤压逐渐卷起）
    var tx = w * 0.62, ty = h * 0.38;
    var roll = Math.min(1, squeezes / 5);   // 卷起程度
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(0.12);
    // 管尾（卷起的卷）
    var rollW = 14 + roll * 10;
    ctx.fillStyle = '#8a9ab0';
    roundRect(-150, -16, rollW, 32, 4);
    ctx.fill();
    // 管身（长度随卷起缩短）
    var bodyLen = 210 - roll * 90;
    var bodyGrad = ctx.createLinearGradient(0, -22, 0, 22);
    bodyGrad.addColorStop(0, '#e8e2d2');
    bodyGrad.addColorStop(1, '#c2bcab');
    ctx.fillStyle = bodyGrad;
    roundRect(-150 + rollW, -20, bodyLen, 40, 6);
    ctx.fill();
    // 管身字
    if (bodyLen > 60) {
      ctx.fillStyle = '#7a8aa0';
      ctx.font = '12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('牙膏 · 夜班牌', -150 + rollW + bodyLen / 2, 4);
    }
    // 管口+盖
    ctx.fillStyle = '#8a9ab0';
    roundRect(-150 + rollW + bodyLen, -9, 18, 18, 3);
    ctx.fill();
    ctx.restore();

    // 剪开状态：管身裂开露出内壁挂膏
    if (cut) {
      ctx.save();
      ctx.translate(tx + 40, ty + 120);
      ctx.rotate(-0.05);
      // 上半壳
      ctx.fillStyle = '#d8d2c2';
      roundRect(-90, -26, 180, 26, 5);
      ctx.fill();
      // 内壁挂膏（两大条）
      ctx.fillStyle = '#7ac9c9';
      roundRect(-78, -20, 70, 14, 4);
      ctx.fill();
      roundRect(10, -20, 70, 14, 4);
      ctx.fill();
      // 下半壳
      ctx.fillStyle = '#c2bcab';
      roundRect(-90, 4, 180, 26, 5);
      ctx.fill();
      ctx.restore();
    }

    // 剪刀提示（挤压 3 次后出现）
    if (squeezes >= 3 && !cut) {
      ctx.fillStyle = 'rgba(90,84,72,' + (0.4 + 0.25 * Math.sin(t * 0.004)) + ')';
      ctx.font = '12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('剪刀在右边抽屉里——剪开它', w * 0.62, ty + 120);
    }
  }

  function roundRect(x, y, w2, h2, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w2, y, x + w2, y + h2, r);
    ctx.arcTo(x + w2, y + h2, x, y + h2, r);
    ctx.arcTo(x, y + h2, x, y, r);
    ctx.arcTo(x, y, x + w2, y, r);
    ctx.closePath();
    ctx.fill();
  }

  var clicks = 0;
  canvas.addEventListener('click', function (e) {
    clicks++;
    // 剪开后点挂膏：挤到牙刷
    if (cut) {
      var w = window.innerWidth, h = window.innerHeight;
      if (e.clientX > w * 0.5 - 120 && e.clientX < w * 0.5 + 120 && e.clientY > h * 0.38) {
        if (pasteOnBrush < 2) {
          pasteOnBrush++;
          say(pasteOnBrush === 1 ? '第一条。比你以为的多。' : '第二条。剪对了。');
        } else {
          say('牙刷满了。真的去刷个牙吧。');
        }
      }
      return;
    }
    // 未剪开：点击挤牙膏
    if (squeezes < 5) {
      squeezes++;
      say(['再挤挤，还有。', '从尾巴往前推。', '扁了，但没完全扁。', '挤不出了？再试试。', '……真的挤不出了。'][squeezes - 1]);
    } else if (!cut) {
      cut = true;
      say('咔嚓——剪开了。内壁上还挂着两大条。');
    }
  });
  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动
})();
</script>
</body>
</html>
