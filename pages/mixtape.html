<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜磁带</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  /* 磁带壳 */
  .cassette {
    margin-top: clamp(18px, 4vw, 26px);
    background: linear-gradient(180deg, #1b2334 0%, #151c2b 100%);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px 16px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  }
  .label {
    background: linear-gradient(180deg, #e9dfc8 0%, #ddd0b4 100%);
    border-radius: 6px;
    padding: 10px 14px 14px;
    color: #3a3428;
  }
  .label .title {
    font-size: 14.5px;
    letter-spacing: 0.12em;
    border-bottom: 1.5px solid rgba(58, 52, 40, 0.4);
    padding-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .label .title b { font-weight: 700; }
  .label .title span { font-size: 11.5px; letter-spacing: 0.2em; }
  .window {
    margin-top: 10px;
    background: #10151f;
    border-radius: 40px;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .reel {
    position: relative;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: conic-gradient(#2b3140 0 25%, #232939 0 50%, #2b3140 0 75%, #232939 0);
  }
  .reel .tape-ring {
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 50%;
    background: #3d3327;
  }
  .reel .hub {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #0c101a;
    border: 2px solid #4a4232;
  }
  .reel .hub::after {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: conic-gradient(#4a4232 0 30%, transparent 0 50%, #4a4232 0 80%, transparent 0);
  }
  .belt {
    flex: 1;
    height: 3px;
    margin: 0 -6px;
    background: linear-gradient(180deg, #3d3327 0%, #241f17 100%);
    position: relative;
    z-index: 2;
  }
  .scrTape { display: flex; align-items: center; }

  .lyrics {
    margin-top: 16px;
    min-height: 262px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(16, 24, 40, 0.6);
    padding: clamp(14px, 3vw, 20px);
  }
  .line {
    padding: 5px 2px;
    color: var(--ink-dim);
    font-size: 14.5px;
    opacity: 0.25;
    transition: opacity 0.8s ease, color 0.8s ease;
    display: flex;
    gap: 10px;
  }
  .line .no {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--ink-dim);
    padding-top: 2px;
  }
  .line.on { opacity: 1; color: var(--ink-strong); }
  .line.on .no { color: var(--gold); }
  .line.past { opacity: 0.45; }

  .status {
    margin-top: 10px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 12.5px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .actions {
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  button.act {
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.12em;
    border: none;
    border-radius: 999px;
    padding: 10px 30px;
    cursor: pointer;
    color: var(--bg-0);
    background: var(--gold);
  }
  button.act.ghostBtn {
    color: var(--ink);
    background: rgba(16, 24, 40, 0.8);
    border: 1px solid var(--line);
  }
  button.act:hover { filter: brightness(1.08); }
  button.act:active { transform: scale(0.97); }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>深夜磁带</h1>
  <p class="sub">一盘没有声音的磁带。<em>词在就行，曲你自己哼。</em></p>

  <div class="cassette">
    <div class="label">
      <div class="title"><b>深夜 Mixtape</b><span>SIDE A</span></div>
      <div class="window scrTape">
        <div class="reel" id="reelL"><div class="tape-ring" id="ringL"></div><div class="hub"></div></div>
        <div class="belt"></div>
        <div class="reel" id="reelR"><div class="tape-ring" id="ringR"></div><div class="hub"></div></div>
      </div>
    </div>
  </div>

  <div class="lyrics" id="lyrics"></div>
  <div class="status" id="status">■ STOP · 磁带已就位</div>

  <div class="actions">
    <button class="act" id="playBtn" type="button">▶ 播放</button>
    <button class="act ghostBtn" id="rewBtn" type="button">◁◁ 倒带</button>
  </div>

  <p class="hint">A 面四十秒，唱完自动停。B 面不做了——你听到一半就会睡着，后面的歌留给你梦里自己写。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var LINES = [
    '第一首送给没关严的窗。',
    '风把楼下的猫叫都录了进去。',
    '副歌部分是冰箱的嗡嗡声。',
    '有人在你楼上跺了跺脚，算打击乐。',
    '这一首写给你的枕头。',
    '高潮是远处一声汽笛。',
    '中间那段留白，是留给翻身的你的。',
    '间奏太长，你差点睡着——那就对了。',
    '最后一首没有名字。',
    '它只唱一句：晚安。'
  ];
  var DUR = 40000;        /* A 面走带时长 */
  var R_MAX = 30;         /* 满卷半径 px */
  var R_MIN = 12;

  var ringL = document.getElementById('ringL');
  var ringR = document.getElementById('ringR');
  var reelL = document.getElementById('reelL');
  var reelR = document.getElementById('reelR');
  var lyrics = document.getElementById('lyrics');
  var statusEl = document.getElementById('status');
  var playBtn = document.getElementById('playBtn');
  var rewBtn = document.getElementById('rewBtn');

  var rows = [];
  LINES.forEach(function (t, i) {
    var row = document.createElement('div');
    row.className = 'line';
    var no = document.createElement('span');
    no.className = 'no';
    no.textContent = (i + 1 < 10 ? '0' : '') + (i + 1);
    var txt = document.createElement('span');
    txt.textContent = t;
    row.appendChild(no);
    row.appendChild(txt);
    lyrics.appendChild(row);
    rows.push(row);
  });

  var playing = false;
  var t0 = 0;
  var timer = null;

  function setReels(progress) {
    /* 带量从左卷转移到右卷 */
    var rL = R_MAX - (R_MAX - R_MIN) * progress;
    var rR = R_MIN + (R_MAX - R_MIN) * progress;
    ringL.style.width = ringL.style.height = rL * 2 + 'px';
    ringR.style.width = ringR.style.height = rR * 2 + 'px';
    /* 角速度与半径成反比：内圈转得快 */
    var rot = progress * DUR / 1000;
    reelL.style.transform = 'rotate(' + (rot * (R_MAX / Math.max(1, rL))) * 40 + 'deg)';
    reelR.style.transform = 'rotate(' + (rot * (R_MAX / Math.max(1, rR))) * 40 + 'deg)';
  }

  function markRows(progress) {
    var active = Math.min(rows.length - 1, Math.floor(progress * rows.length));
    rows.forEach(function (row, i) {
      row.classList.toggle('on', i === active);
      row.classList.toggle('past', i < active);
    });
  }

  function tick() {
    if (!playing) return;
    var p = Math.min(1, (Date.now() - t0) / DUR);
    setReels(p);
    markRows(p);
    statusEl.textContent = p >= 1
      ? '■ A 面播完。翻面是 B 面——但你已经睡着了。'
      : '▶ PLAY · ' + Math.floor(p * 40) + 's / 40s';
    if (p >= 1) {
      playing = false;
      playBtn.textContent = '▶ 重播';
      return;
    }
    setTimeout(tick, 100);
  }

  function play() {
    if (playing) return;
    if (playBtn.textContent.indexOf('▶') === -1 || playBtn.dataset.done === '1') {
      /* 播完后重按 = 从头再来 */
      t0 = Date.now();
    }
    if (Date.now() - t0 >= DUR || !t0) t0 = Date.now();
    playing = true;
    playBtn.textContent = '❚❚ 进行中';
    playBtn.dataset.done = '';
    setTimeout(tick, 100);
  }

  function rewind() {
    playing = false;
    t0 = Date.now();
    setReels(0);
    markRows(0);
    playBtn.textContent = '▶ 播放';
    playBtn.dataset.done = '';
    statusEl.textContent = '◁◁ REW · 倒回开头';
  }

  playBtn.addEventListener('click', play);
  rewBtn.addEventListener('click', rewind);
  setReels(0);
  markRows(0);
})();
</script>
</body>
</html>
