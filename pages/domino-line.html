<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多米诺</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .stage {
    position: relative;
    margin-top: clamp(18px, 4vw, 26px);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
  }
  .stage canvas { display: block; width: 100%; }
  .stage .fin {
    position: absolute;
    left: 0; right: 0; bottom: 18px;
    text-align: center;
    color: var(--gold);
    font-size: 15px;
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  .stage .fin.show { opacity: 1; }

  .actions {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  button.act {
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.12em;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 26px;
    cursor: pointer;
    color: var(--ink);
    background: rgba(16, 24, 40, 0.8);
  }
  button.act:hover { filter: brightness(1.08); }
  button.act:active { transform: scale(0.97); }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>多米诺</h1>
  <p class="sub">一整排牌站了一整晚，就是在等<em>轻轻的一下</em>。</p>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="fin" id="fin">然后，就看天亮了。</div>
  </div>

  <div class="actions">
    <button class="act" id="resetBtn" type="button">重新摆牌</button>
  </div>

  <p class="hint">点在哪张牌上，就从哪张开始倒。后面的牌只认识前面的牌——这是规矩。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var fin = document.getElementById('fin');
  var resetBtn = document.getElementById('resetBtn');
  var W = 0, H = 0, DPR = 1;

  var N = 34;
  var tiles = [];          /* {x, angle, vel, falling, down} */
  var groundY = 0, tileH = 0, tileW = 0, gap = 0, x0 = 0;
  var lastFrame = Date.now();
  var allDown = false;

  var TRIGGER = 0.12;      /* 触发连锁的最小倾角（几何命中为主，此为下限） */

  function resize() {
    var w = stage.clientWidth;
    var h = Math.round(Math.min(300, Math.max(230, w * 0.52)));
    DPR = window.devicePixelRatio || 1;
    cv.width = w * DPR;
    cv.height = h * DPR;
    cv.style.height = h + 'px';
    W = w; H = h;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    groundY = H * 0.78;
    tileH = Math.min(88, H * 0.40);
    tileW = Math.max(9, tileH * 0.17);
    /* 自适应：N 张牌（含厚度）恰好排满可用宽度 */
    x0 = W * 0.045;
    N = Math.max(14, Math.floor((W - 2 * x0) / (tileW * 1.05)));
    gap = (W - 2 * x0 - tileW) / (N - 1);
    layout();
  }

  function layout() {
    tiles = [];
    for (var i = 0; i < N; i++) {
      tiles.push({ x: x0 + i * gap, angle: 0, vel: 0, falling: false, down: false });
    }
    allDown = false;
    fin.classList.remove('show');
  }

  function step(dt) {
    for (var i = 0; i < N; i++) {
      var t = tiles[i];
      if (t.falling && !t.down) {
        /* 重力矩近似：角加速度随倾角增大，被撞瞬间自带初速 */
        t.vel += (2.5 + Math.sin(t.angle) * 9) * dt;
        t.angle += t.vel * dt;
        if (t.angle >= Math.PI / 2) {
          t.angle = Math.PI / 2;
          t.down = true;
        }
        /* 牌尖触到下一张：触发连锁 */
        var next = tiles[i + 1];
        if (next && !next.falling) {
          var tipX = t.x + Math.sin(t.angle) * tileH;
          if (t.angle > TRIGGER && tipX >= next.x - tileW * 0.4) {
            next.falling = true;
            next.vel = 1.6;
          }
        }
      }
    }
    if (!allDown) {
      var downCount = 0;
      for (var k = 0; k < N; k++) if (tiles[k].down) downCount++;
      if (downCount === N) {
        allDown = true;
        fin.classList.add('show');
      }
    }
  }

  function draw(now) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#080b13');
    g.addColorStop(1, '#0e1524');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 地面 */
    ctx.strokeStyle = 'rgba(156, 200, 255, 0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, groundY + 1);
    ctx.lineTo(W, groundY + 1);
    ctx.stroke();
    ctx.fillStyle = 'rgba(16, 24, 40, 0.8)';
    ctx.fillRect(0, groundY + 1, W, H - groundY);

    /* 牌（按 x 顺序画，向右倒：绕左下角顺时针） */
    for (var i = 0; i < N; i++) {
      var t = tiles[i];
      ctx.save();
      ctx.translate(t.x, groundY);
      ctx.rotate(t.angle);
      ctx.globalAlpha = 1;
      /* 牌身 */
      var grad = ctx.createLinearGradient(0, -tileH, 0, 0);
      grad.addColorStop(0, '#ece4d2');
      grad.addColorStop(1, '#cfc4a8');
      ctx.fillStyle = grad;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-tileW / 2, -tileH, tileW, tileH, 2.5);
      else ctx.rect(-tileW / 2, -tileH, tileW, tileH);
      ctx.fill();
      /* 顶部一道夜光反光 */
      ctx.fillStyle = 'rgba(156, 200, 255, 0.22)';
      ctx.fillRect(-tileW / 2, -tileH, tileW, 2);
      /* 中缝圆点 */
      ctx.fillStyle = 'rgba(90, 70, 40, 0.35)';
      ctx.beginPath();
      ctx.arc(0, -tileH * 0.5, tileW * 0.09, 0, 6.29);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function frame() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    var active = false;
    for (var i = 0; i < N; i++) if (tiles[i].falling && !tiles[i].down) { active = true; break; }
    if (active) {
      step(dt);
      draw(now);
      requestAnimationFrame(frame);
    } else if (allDown) {
      draw(now);
    }
  }
  /* 后台 rAF 停摆兜底：连锁进行中失联时按墙钟补步 */
  setInterval(function () {
    var now = Date.now();
    var active = false;
    for (var i = 0; i < N; i++) if (tiles[i].falling && !tiles[i].down) { active = true; break; }
    if (active && now - lastFrame > 400) {
      step(Math.min(1, (now - lastFrame) / 1000));
      lastFrame = now;
      draw(now);
    }
  }, 600);

  stage.addEventListener('pointerdown', function (ev) {
    var rect = stage.getBoundingClientRect();
    var mx = ev.clientX - rect.left;
    /* 找到点击命中的最靠前立着的牌，从它开始倒 */
    var hit = -1;
    for (var i = 0; i < N; i++) {
      if (!tiles[i].falling && !tiles[i].down && tiles[i].x + gap * 0.5 >= mx) {
        if (hit === -1 || Math.abs(tiles[i].x - mx) < Math.abs(tiles[hit].x - mx)) hit = i;
      }
    }
    if (hit >= 0) {
      tiles[hit].falling = true;
      lastFrame = Date.now();
      requestAnimationFrame(frame);
    }
  });

  resetBtn.addEventListener('click', function () {
    layout(false);
    draw(Date.now());
  });

  window.addEventListener('resize', function () { resize(); draw(Date.now()); });
  resize();
  draw(Date.now());
})();
</script>
</body>
</html>
