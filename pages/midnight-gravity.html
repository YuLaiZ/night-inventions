<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜引力</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06080d;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #c9c2b4;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 40px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #8a857a; margin-bottom: 14px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #565a63; letter-spacing: 0.08em; }
  .count-line {
    position: absolute; bottom: 4.5vh; left: 0; right: 0;
    text-align: center;
    font-size: 13px; letter-spacing: 0.14em;
    color: #7d7668;
    z-index: 3;
  }
  .whisper {
    position: absolute; bottom: 9vh; left: 0; right: 0;
    text-align: center;
    font-size: 12px; letter-spacing: 0.1em;
    color: #8f897c;
    opacity: 0;
    transition: opacity 1.1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .whisper.show { opacity: 0.9; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #3c4048;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #565a63;
    text-decoration: none;
    border-bottom: 1px dotted #565a63;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #9b948a; border-color: #9b948a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>深夜引力</h1>
  <p>中间那颗是今晚唯一的恒星。<br>在空白处划一下，把小行星甩给它——轻了坠毁，重了逃逸。</p>
</div>

<div class="whisper" id="whisper"></div>
<div class="count-line" id="countLine">在轨 0 颗</div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var countLine = document.getElementById('countLine');
  var whisper = document.getElementById('whisper');
  var DPR = window.devicePixelRatio || 1;

  var star = { x: 0, y: 0, r: 24 };
  var planets = [];          // {x,y,vx,vy,r,col,trail:[{x,y}],alive}
  var sparks = [];           // 坠毁粒子
  var MAX = 6;
  var K = 14000000;          // 引力常数（px³/s² 量级，调校值）

  var PALETTE = ['255,224,170', '196,214,255', '255,190,140', '214,229,255', '255,240,210'];

  function resize() {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    star.x = window.innerWidth / 2;
    star.y = window.innerHeight * 0.52;
  }
  window.addEventListener('resize', resize);

  // ── 甩出：划动方向即发射方向 ───────────────────────────
  var drag = null;

  canvas.addEventListener('pointerdown', function (e) {
    drag = { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (drag) { drag.x1 = e.clientX; drag.y1 = e.clientY; }
  });
  window.addEventListener('pointerup', function (e) {
    if (!drag) return;
    var dx = drag.x1 - drag.x0, dy = drag.y1 - drag.y0;
    drag = null;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 18) return;                          // 太短的算误触
    if (planets.length >= MAX) { showWhisper('今晚的发射窗口满了。'); return; }
    var speed = Math.min(560, len * 2.6);
    var colors = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    var px = e.clientX, py = e.clientY;
    // 发射点保护：离恒星太近会被瞬间吞噬，推出到安全半径
    var sdx = px - star.x, sdy = py - star.y;
    var sd = Math.hypot(sdx, sdy);
    var safe = star.r * 1.6;
    if (sd < safe) { px = star.x + (sdx / (sd || 1)) * safe; py = star.y + (sdy / (sd || 1)) * safe; }
    planets.push({
      x: px, y: py,
      vx: dx / len * speed, vy: dy / len * speed,
      r: 2.6 + Math.random() * 1.8,
      col: colors,
      trail: [],
      alive: true
    });
    updateCount();
  });

  function updateCount() {
    countLine.textContent = '在轨 ' + planets.length + ' 颗';
  }

  var whisperTimer = null;
  function showWhisper(text) {
    whisper.textContent = text;
    whisper.classList.add('show');
    if (whisperTimer) clearTimeout(whisperTimer);
    whisperTimer = setTimeout(function () { whisper.classList.remove('show'); }, 3200);
  }

  // ── 物理与生命周期 ────────────────────────────────────
  function step(dt) {
    var W = window.innerWidth, H = window.innerHeight;
    var escapeR = Math.hypot(W, H) / 2 + 90;

    for (var i = planets.length - 1; i >= 0; i--) {
      var p = planets[i];
      var dx = star.x - p.x, dy = star.y - p.y;
      var d2 = dx * dx + dy * dy;
      var d = Math.sqrt(d2);

      // 坠毁：撞进恒星
      if (d < star.r * 0.9) {
        burst(p.x, p.y, p.col);
        planets.splice(i, 1);
        showWhisper('它回家了。');
        updateCount();
        continue;
      }
      // 逃逸：比轨道能量 E = v²/2 − K/r ≥ 0 即双曲线轨道，物理上永不回返；
      // 椭圆（E<0）无论甩多远都会回来，不误判
      var v2e = p.vx * p.vx + p.vy * p.vy;
      if (d > escapeR && v2e / 2 - K / d >= 0) {
        planets.splice(i, 1);
        showWhisper('它挣脱了，去别的夜了。');
        updateCount();
        continue;
      }

      // 半隐式欧拉，子步防甩飞误差
      var sub = Math.max(1, Math.ceil(dt / 0.008));
      var h = dt / sub;
      for (var s = 0; s < sub; s++) {
        var ddx = star.x - p.x, ddy = star.y - p.y;
        var dd2 = ddx * ddx + ddy * ddy;
        var a = K / dd2;
        var dd = Math.sqrt(dd2);
        p.vx += a * (ddx / dd) * h;
        p.vy += a * (ddy / dd) * h;
        p.x += p.vx * h;
        p.y += p.vy * h;
      }

      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 70) p.trail.shift();
    }

    // 坠毁火花
    for (var j = sparks.length - 1; j >= 0; j--) {
      var sp = sparks[j];
      sp.x += sp.vx * dt; sp.y += sp.vy * dt;
      sp.life -= dt;
      if (sp.life <= 0) sparks.splice(j, 1);
    }
  }

  function burst(x, y, col) {
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 130;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.5, col: col });
    }
  }

  // ── 绘制 ─────────────────────────────────────────────
  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    step(dt);

    var w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    // 恒星：光晕 + 脉动
    var pulse = 1 + Math.sin(now * 0.0012) * 0.05;
    var R = star.r * 2.6 * pulse;
    var g = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, R);
    g.addColorStop(0, 'rgba(255,214,140,0.30)');
    g.addColorStop(0.5, 'rgba(255,190,110,0.10)');
    g.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = g;
    ctx.fillRect(star.x - R, star.y - R, R * 2, R * 2);
    ctx.fillStyle = '#ffe6b0';
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff6dd';
    ctx.beginPath();
    ctx.arc(star.x - star.r * 0.2, star.y - star.r * 0.25, star.r * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // 拖拽瞄准线
    if (drag) {
      ctx.strokeStyle = 'rgba(217,184,119,0.4)';
      ctx.setLineDash([4, 7]);
      ctx.beginPath();
      ctx.moveTo(drag.x0, drag.y0);
      ctx.lineTo(drag.x1, drag.y1);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 行星与尾迹
    planets.forEach(function (p) {
      for (var i = 1; i < p.trail.length; i++) {
        var a = (i / p.trail.length) * 0.5;
        ctx.strokeStyle = 'rgba(' + p.col + ',' + a + ')';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(p.trail[i - 1].x, p.trail[i - 1].y);
        ctx.lineTo(p.trail[i].x, p.trail[i].y);
        ctx.stroke();
      }
      // 星体：亮面朝恒星
      var dx = star.x - p.x, dy = star.y - p.y;
      var dd = Math.max(1, Math.hypot(dx, dy));
      var ang = Math.atan2(dy, dx);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(ang);
      ctx.fillStyle = 'rgba(' + p.col + ',0.35)';
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(' + p.col + ',0.95)';
      ctx.beginPath(); ctx.arc(0, 0, p.r, -Math.PI / 2, Math.PI / 2); ctx.fill();
      ctx.restore();
    });

    // 火花
    sparks.forEach(function (sp) {
      ctx.fillStyle = 'rgba(' + sp.col + ',' + Math.max(0, sp.life) + ')';
      ctx.fillRect(sp.x, sp.y, 2, 2);
    });
  }
  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }

  resize();
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动
})();
</script>
</body>
</html>
