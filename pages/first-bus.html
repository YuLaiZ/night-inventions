<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首班车</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .stage {
    position: relative;
    margin-top: clamp(18px, 4vw, 26px);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
  }
  .stage canvas { display: block; width: 100%; }
  .stage .say {
    position: absolute;
    left: 0; right: 0; bottom: 12px;
    text-align: center;
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.7s ease;
    pointer-events: none;
  }
  .stage .say.show { opacity: 1; }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>首班车</h1>
  <p class="sub">末班车把夜拉走了，<em>首班车负责把天亮运回来。</em>此刻它正从城市另一头出发。</p>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="say" id="say"></div>
  </div>

  <p class="hint">点一下站牌等车。车来了不一定非要上——看着它进站，也算到过站。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var say = document.getElementById('say');
  var W = 0, H = 0;

  var state = 'idle';       /* idle → coming → boarding → leaving */
  var stateAt = 0;
  var lastFrame = Date.now();

  function resize() {
    var w = stage.clientWidth;
    var h = Math.round(Math.min(400, Math.max(300, w * 0.72)));
    cv.width = w;
    cv.height = h;
    cv.style.height = h + 'px';
    W = w; H = h;
  }

  function sayText(t) {
    say.textContent = t;
    say.classList.add('show');
    setTimeout(function () { say.classList.remove('show'); }, 2600);
  }

  /* 车位置：coming 从右远处（小）滑入停站；leaving 反向 */
  function busPose() {
    var now = Date.now();
    var e = (now - stateAt) / 1000;
    if (state === 'coming') {
      var t = Math.min(1, e / 3.2);
      var ease = 1 - Math.pow(1 - t, 2);
      return { x: W * (1.05 - 0.62 * ease), scale: 0.35 + 0.65 * ease, doorsOpen: false, visible: true };
    }
    if (state === 'boarding') {
      return { x: W * 0.43, scale: 1, doorsOpen: true, visible: true };
    }
    if (state === 'leaving') {
      var t2 = Math.min(1, e / 3.4);
      return { x: W * 0.43 - W * 0.95 * t2, scale: 1 - 0.6 * t2, doorsOpen: t2 < 0.1, visible: t2 < 1 };
    }
    return { visible: false };
  }

  function drawBus(x, y, s, doorsOpen) {
    var bw = W * 0.34 * s;
    var bh = W * 0.115 * s;
    /* 车身 */
    ctx.fillStyle = '#1c2536';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y - bh, bw, bh, bh * 0.12);
    else ctx.rect(x, y - bh, bw, bh);
    ctx.fill();
    /* 车窗一排 */
    ctx.fillStyle = doorsOpen ? 'rgba(242, 214, 140, 0.75)' : 'rgba(156, 200, 255, 0.28)';
    var wn = 5;
    for (var i = 0; i < wn; i++) {
      ctx.fillRect(x + bw * 0.08 + i * bw * 0.165, y - bh * 0.82, bw * 0.115, bh * 0.34);
    }
    /* 车门（ boarding 时开） */
    var doorW = bw * 0.10;
    ctx.fillStyle = doorsOpen ? 'rgba(242, 214, 140, 0.85)' : 'rgba(156, 200, 255, 0.35)';
    ctx.fillRect(x + bw * 0.80, y - bh * 0.80, doorW, bh * 0.76);
    if (doorsOpen) {
      ctx.strokeStyle = 'rgba(10, 13, 20, 0.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + bw * 0.80 + doorW / 2, y - bh * 0.80);
      ctx.lineTo(x + bw * 0.80 + doorW / 2, y);
      ctx.stroke();
    }
    /* 车轮 */
    ctx.fillStyle = '#0a0d14';
    ctx.beginPath();
    ctx.arc(x + bw * 0.20, y, bh * 0.17, 0, 6.29);
    ctx.arc(x + bw * 0.78, y, bh * 0.17, 0, 6.29);
    ctx.fill();
    /* 车头灯 */
    ctx.fillStyle = 'rgba(255, 240, 190, 0.95)';
    ctx.beginPath();
    ctx.arc(x + bw + 2, y - bh * 0.35, 2.5 * s, 0, 6.29);
    ctx.fill();
  }

  function draw(now) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#101a2c');
    g.addColorStop(0.55, '#1a2740');
    g.addColorStop(1, '#223247');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 启明星 */
    ctx.fillStyle = 'rgba(242, 214, 140, 0.9)';
    ctx.beginPath();
    ctx.arc(W * 0.24, H * 0.16, 3.5, 0, 6.29);
    ctx.fill();

    /* 站牌 */
    var sx = W * 0.16, sy = H * 0.72;
    ctx.strokeStyle = '#2a3549';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx, sy - H * 0.26);
    ctx.stroke();
    ctx.fillStyle = '#e9dfc8';
    ctx.fillRect(sx - W * 0.045, sy - H * 0.30, W * 0.11, H * 0.062);
    ctx.fillStyle = '#3a3428';
    ctx.font = Math.round(W * 0.020) + 'px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'center';
    ctx.fillText('首班 · 06:00', sx + W * 0.010, sy - H * 0.268);
    ctx.fillText('方向 · 天亮', sx + W * 0.010, sy - H * 0.252);

    /* 地面 */
    ctx.fillStyle = '#141c2b';
    ctx.fillRect(0, H * 0.76, W, H * 0.24);
    ctx.strokeStyle = 'rgba(156, 200, 255, 0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.76);
    ctx.lineTo(W, H * 0.76);
    ctx.stroke();

    /* 车灯（coming/leaving 时的远灯光晕） */
    var pose = busPose();
    if (pose.visible && (state === 'coming' || state === 'leaving')) {
      var dir = state === 'coming' ? 1 : -1;
      var lx = pose.x + (state === 'coming' ? -W * 0.05 : W * 0.35);
      var lg = ctx.createRadialGradient(lx, H * 0.68, 0, lx, H * 0.68, 70 * pose.scale);
      lg.addColorStop(0, 'rgba(255, 240, 190, 0.35)');
      lg.addColorStop(1, 'rgba(255, 240, 190, 0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.arc(lx, H * 0.68, 70 * pose.scale, 0, 6.29);
      ctx.fill();
    }

    /* 车身 */
    if (pose.visible) {
      drawBus(pose.x, H * 0.76, pose.scale, pose.doorsOpen);
    }

    /* 等车人剪影（始终在） */
    ctx.fillStyle = '#10141f';
    var px = W * 0.30, ph = H * 0.16;
    ctx.beginPath();
    ctx.arc(px, H * 0.76 - ph, ph * 0.14, 0, 6.29);
    ctx.fill();
    ctx.lineWidth = ph * 0.10;
    ctx.strokeStyle = '#10141f';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px, H * 0.76 - ph + ph * 0.16);
    ctx.lineTo(px, H * 0.76 - ph * 0.05);
    ctx.stroke();
  }

  function loop() {
    var now = Date.now();
    var e = (now - stateAt) / 1000;
    if (state === 'coming' && e > 3.4) {
      state = 'boarding';
      stateAt = now;
      sayText('上吧。天亮在下一站。');
    } else if (state === 'boarding' && e > 4.2) {
      state = 'leaving';
      stateAt = now;
    } else if (state === 'leaving' && e > 3.6) {
      state = 'idle';
      stateAt = now;
      sayText('下一班，还是天亮。');
    }
    draw(now);
    setTimeout(loop, 60);
  }

  stage.addEventListener('pointerdown', function () {
    if (state !== 'idle') return;
    state = 'coming';
    stateAt = Date.now();
    sayText('听见了吗？发动机在很远的那头。');
  });

  window.addEventListener('resize', resize);
  resize();
  loop();
})();
</script>
</body>
</html>
