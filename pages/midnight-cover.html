<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜专辑封面工坊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06080d;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #c9c2b4;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .copy {
    position: absolute; top: 34px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #8a857a; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #565a63; letter-spacing: 0.08em; }
  .cover-wrap {
    position: absolute; left: 50%; top: 51%;
    transform: translate(-50%, -50%);
    width: 320px; height: 320px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.65);
    border-radius: 4px;
    overflow: hidden;
    z-index: 2;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .controls {
    position: absolute; bottom: 13vh; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    z-index: 3;
  }
  .controls input {
    width: min(340px, 80vw);
    background: #10141c;
    border: 1px solid #272e3b;
    border-radius: 8px;
    color: #d8d2c4;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    text-align: center;
    letter-spacing: 0.06em;
    font-family: inherit;
  }
  .controls input:focus { border-color: #4a5468; }
  .controls input::placeholder { color: #474d59; }
  .btn-row { display: flex; gap: 14px; }
  .btn-row button {
    background: #1c2230;
    border: 1px solid #333d4f;
    border-radius: 8px;
    color: #d8d2c4;
    font-size: 13px;
    letter-spacing: 0.16em;
    padding: 9px 22px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-row button:hover { border-color: #4a5468; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #3c4048;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #565a63;
    text-decoration: none;
    border-bottom: 1px dotted #565a63;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #9b948a; border-color: #9b948a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>

<div class="copy">
  <h1>深夜专辑封面工坊</h1>
  <p>把今晚的心情交给排版和色块。<br>写一句，或直接换一张——每张都像正经发行。</p>
</div>

<div class="cover-wrap"><canvas id="cv" width="320" height="320"></canvas></div>

<div class="controls">
  <input id="mood" maxlength="18" placeholder="心情一句话（可留空）">
  <div class="btn-row">
    <button id="remake">换一张</button>
  </div>
</div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var moodInput = document.getElementById('mood');

  // 深夜调色板（底色 / 前景色组）
  var PALETTES = [
    { bg: '#0d1526', fg: ['#2e4a6b', '#d9a05a', '#8fb0c9', '#e8d9b0'] },
    { bg: '#1a1022', fg: ['#4a2e5c', '#c97a9a', '#8a6ba8', '#e0c8e8'] },
    { bg: '#0e1a14', fg: ['#2e5c40', '#a8c98a', '#6b8a5c', '#d0e0c0'] },
    { bg: '#1f130d', fg: ['#5c3a2e', '#d98a5a', '#a8756b', '#e8cdb0'] },
    { bg: '#101018', fg: ['#33334d', '#8a8ac9', '#5a6b8a', '#c9cde8'] },
    { bg: '#1c1410', fg: ['#4d3d33', '#c9a875', '#8a7355', '#e8d0a8'] }
  ];

  var TITLES = [
    '关于失眠的八种写法', '凌晨三点，颜色很慢', '月亮不打烊',
    '把梦调成静音', '夜风搬运星光', '今晚的月亮掉进海里',
    '困意是一封长信', '路灯下面没有秘密', '半梦半醒进行曲',
    '晚安，以及晚安'
  ];

  function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function rr(min, max) { return min + Math.random() * (max - min); }

  function generate() {
    var pal = rnd(PALETTES);
    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, 320, 320);

    // 构图变体：随机 2-4 层元素
    var variants = ['circle', 'arc', 'lines', 'dots', 'wave', 'halfmoon'];
    var used = [];
    var layers = 2 + Math.floor(Math.random() * 3);
    for (var i = 0; i < layers; i++) {
      var v = rnd(variants.filter(function (x) { return used.indexOf(x) === -1; })) || rnd(variants);
      used.push(v);
      var c = rnd(pal.fg);
      ctx.fillStyle = c;
      ctx.strokeStyle = c;
      if (v === 'circle') {
        ctx.globalAlpha = rr(0.5, 0.9);
        ctx.beginPath();
        ctx.arc(rr(80, 240), rr(70, 190), rr(28, 70), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      } else if (v === 'halfmoon') {
        ctx.globalAlpha = 0.9;
        var mx = rr(100, 220), my = rr(70, 150), mr = rr(40, 64);
        ctx.beginPath();
        ctx.arc(mx, my, mr, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pal.bg;
        ctx.beginPath();
        ctx.arc(mx + mr * 0.42, my - mr * 0.18, mr * 0.92, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      } else if (v === 'arc') {
        ctx.globalAlpha = rr(0.4, 0.8);
        ctx.lineWidth = rr(3, 9);
        var ay = rr(150, 240);
        for (var a = 0; a < 3; a++) {
          ctx.beginPath();
          ctx.arc(160, ay + a * 22, rr(70, 120), Math.PI * 1.15, Math.PI * 1.85);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      } else if (v === 'lines') {
        ctx.globalAlpha = rr(0.35, 0.7);
        ctx.lineWidth = 1.6;
        var slope = rr(-0.6, 0.6);
        for (var li = 0; li < 14; li++) {
          var ly = 40 + li * 14;
          ctx.beginPath();
          ctx.moveTo(-10, ly);
          ctx.lineTo(330, ly + 330 * slope * 0.4);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      } else if (v === 'dots') {
        ctx.globalAlpha = rr(0.4, 0.75);
        for (var dx = 0; dx < 9; dx++) {
          for (var dy = 0; dy < 7; dy++) {
            if (Math.random() < 0.4) continue;
            ctx.beginPath();
            ctx.arc(36 + dx * 31, 40 + dy * 30, rr(1.6, 3.6), 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      } else if (v === 'wave') {
        ctx.globalAlpha = rr(0.4, 0.8);
        ctx.lineWidth = 2.2;
        for (var wi = 0; wi < 4; wi++) {
          ctx.beginPath();
          var wy = rr(90, 200) + wi * 16;
          for (var px = 0; px <= 320; px += 8) {
            var py = wy + Math.sin(px * 0.03 + wi * 1.4) * 10;
            if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }

    // 底部排版条：曲名 + 艺人
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.fillRect(0, 252, 320, 68);
    var title = moodInput.value.trim() || rnd(TITLES);
    ctx.fillStyle = '#f0e9d8';
    ctx.font = '500 17px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(title, 160, 285);
    ctx.fillStyle = 'rgba(240,233,216,0.55)';
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillText('夜班乐队 · 无聊发明 C 队 · 2026', 160, 305);
  }

  document.getElementById('remake').addEventListener('click', generate);
  moodInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') generate(); });

  generate();
})();
</script>
</body>
</html>
