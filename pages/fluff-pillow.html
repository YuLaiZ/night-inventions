<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍松枕头</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06080d;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #c9c2b4;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .copy {
    position: absolute; top: 36px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #8a857a; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #565a63; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .count-line {
    position: absolute; bottom: 5vh; left: 0; right: 0;
    text-align: center;
    font-size: 13px; letter-spacing: 0.18em;
    color: #b9a57a;
    z-index: 3;
  }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #3c4048;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #565a63;
    text-decoration: none;
    border-bottom: 1px dotted #565a63;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #9b948a; border-color: #9b948a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>拍松枕头</h1>
  <p>这只枕头被压了一整个白天，扁了。<br>拍它几下的——蓬松度回来，梦就有地方落脚。</p>
</div>

<div class="count-line" id="countLine"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var countLine = document.getElementById('countLine');

  var fluff = 0;           // 0..100 蓬松度
  var hits = 0;
  var squish = 0;          // 拍击时压扁量（瞬时）
  var squishV = 0;
  var dusts = [];          // 绒毛粒子
  var pat = 0;             // 拍击动画相位

  function resize() {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function updateCount() {
    countLine.textContent = done
      ? '蓬松度 100%。今晚的梦有地方落脚了。'
      : '蓬松度 ' + Math.round(fluff) + '% —— 再拍几下';
  }
  var done = false;
  updateCount();

  canvas.addEventListener('click', function (e) {
    if (done) return;
    squishV = 3.2;
    pat = 1;
    hits++;
    fluff = Math.min(100, fluff + 14);
    // 绒毛飞出
    var px = window.innerWidth / 2, py = window.innerHeight * 0.5;
    for (var i = 0; i < 8; i++) {
      var a = Math.random() * Math.PI * 2;
      dusts.push({
        x: px + (Math.random() - 0.5) * 200,
        y: py + (Math.random() - 0.5) * 70,
        vx: Math.cos(a) * (20 + Math.random() * 60),
        vy: Math.sin(a) * (20 + Math.random() * 50) - 30,
        life: 1.2 + Math.random(),
        s: 2 + Math.random() * 2.5
      });
    }
    if (fluff >= 100) {
      done = true;
      squish = 0;
    }
    updateCount();
  });

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = now;
    var w = window.innerWidth, h = window.innerHeight;

    // 弹簧模拟压扁回弹
    squishV += (-squish) * 90 * dt;
    squishV *= (1 - dt * 5);
    squish += squishV * dt * 6;
    pat = Math.max(0, pat - dt * 2.4);

    ctx.fillStyle = '#07090e';
    ctx.fillRect(0, 0, w, h);

    // 床单
    ctx.fillStyle = '#0b0e14';
    ctx.fillRect(0, h * 0.72, w, h * 0.28);
    ctx.strokeStyle = 'rgba(200,190,160,0.07)';
    ctx.beginPath(); ctx.moveTo(0, h * 0.72); ctx.lineTo(w, h * 0.72); ctx.stroke();

    // 枕头：蓬松度决定厚度与圆角饱满
    var k = fluff / 100;
    var pw = Math.min(400, w * 0.72);
    var ph = (34 + k * 46) * (1 + squish * 0.06) - squish * 10;
    var px = w / 2, py = h * 0.52 + squish * 8;

    // 枕头主体（软胖圆角）
    var g = ctx.createLinearGradient(px, py - ph / 2, px, py + ph / 2);
    g.addColorStop(0, mix('#d8d2c2', '#f4eede', k));
    g.addColorStop(1, mix('#b8b2a2', '#d8cfb8', k));
    ctx.fillStyle = g;
    roundRect(px - pw / 2, py - ph / 2, pw, ph, 26 + k * 14);
    ctx.fill();
    // 缝线
    ctx.strokeStyle = 'rgba(120,110,90,' + (0.5 - k * 0.2) + ')';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([4, 5]);
    roundRectStroke(px - pw / 2 + 12, py - ph / 2 + 10, pw - 24, ph - 20, 18 + k * 8);
    ctx.setLineDash([]);
    // 拍击涟漪
    if (pat > 0) {
      ctx.strokeStyle = 'rgba(255,240,200,' + pat * 0.4 + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(px, py, pw * 0.4 * (1.3 - pat * 0.3), ph * (1.2 - pat * 0.3), 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 绒毛
    for (var i = dusts.length - 1; i >= 0; i--) {
      var d = dusts[i];
      d.x += d.vx * dt + Math.sin(t * 0.003 + i) * 12 * dt;
      d.y += d.vy * dt;
      d.vy += 26 * dt;
      d.life -= dt * 0.55;
      if (d.life <= 0) { dusts.splice(i, 1); continue; }
      ctx.fillStyle = 'rgba(240,238,222,' + Math.min(1, d.life) + ')';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function mix(a, b, k) {
    if (k <= 0) return a;
    var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    var r = Math.round(((pa >> 16) & 255) + (((pb >> 16) & 255) - ((pa >> 16) & 255)) * k);
    var g = Math.round(((pa >> 8) & 255) + (((pb >> 8) & 255) - ((pa >> 8) & 255)) * k);
    var bl = Math.round((pa & 255) + ((pb & 255) - (pa & 255)) * k);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  function roundRect(x, y, w2, h2, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w2, y, x + w2, y + h2, r);
    ctx.arcTo(x + w2, y + h2, x, y + h2, r);
    ctx.arcTo(x, y + h2, x, y, r);
    ctx.arcTo(x, y, x + w2, y, r);
    ctx.closePath();
    ctx.fill();
  }
  function roundRectStroke(x, y, w2, h2, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w2, y, x + w2, y + h2, r);
    ctx.arcTo(x + w2, y + h2, x, y + h2, r);
    ctx.arcTo(x, y + h2, x, y, r);
    ctx.arcTo(x, y, x + w2, y, r);
    ctx.closePath();
    ctx.stroke();
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动
})();
</script>
</body>
</html>
