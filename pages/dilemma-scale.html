<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纠结天平</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; }
  .sub em { font-style: normal; color: var(--gold); }

  .inputs { margin-top: clamp(22px, 5vw, 28px); display: grid; gap: 10px; }
  .inputs .lab { font-size: 13px; color: var(--ink-dim); letter-spacing: 0.08em; margin-bottom: -4px; }
  .inputs input {
    font-family: var(--sans);
    font-size: 15.5px;
    color: var(--ink-strong);
    background: rgba(156, 200, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    outline: none;
    width: 100%;
  }
  .inputs input:focus { border-color: var(--ice); }
  .go-row { margin-top: 14px; text-align: center; }
  button.weigh {
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.14em;
    color: var(--bg-0);
    background: var(--gold);
    border: none;
    border-radius: 999px;
    padding: 10px 30px;
    cursor: pointer;
  }
  button.weigh:hover { filter: brightness(1.08); }
  button.weigh:active { transform: scale(0.98); }

  /* ── 天平 ── */
  .scale-wrap {
    display: none;
    margin-top: clamp(24px, 5vw, 32px);
  }
  .scale-wrap.show { display: block; animation: fadein 0.5s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .beam {
    width: 200px;
    height: 4px;
    margin: 0 auto;
    background: var(--gold);
    border-radius: 2px;
    transform-origin: center;
    transition: transform 1s cubic-bezier(0.34, 1.3, 0.64, 1);
    position: relative;
  }
  .pan {
    position: absolute;
    top: 4px;
    width: 130px;
    text-align: center;
  }
  .pan .plate {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(156, 200, 255, 0.06);
    padding: 8px 10px;
    font-size: 14px;
    color: var(--ink-strong);
    min-height: 2.6em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pan.left { left: -65px; }
  .pan.right { right: -65px; }
  .pan .string {
    width: 1px;
    height: 16px;
    background: var(--line);
    margin: 0 auto 4px;
  }
  .pillar {
    width: 4px;
    height: 46px;
    background: var(--gold);
    margin: -2px auto 0;
    border-radius: 2px;
    opacity: 0.7;
  }
  .base {
    width: 90px;
    height: 6px;
    background: var(--gold);
    border-radius: 3px;
    margin: 0 auto;
    opacity: 0.7;
  }

  .verdict {
    margin-top: clamp(18px, 4vw, 24px);
    text-align: center;
  }
  .verdict .result-line { color: var(--ink-strong); font-size: clamp(16px, 4.2vw, 19px); }
  .verdict .result-line b { color: var(--gold); font-weight: 600; }
  .verdict .analysis {
    margin-top: 8px;
    color: var(--ink);
    font-size: 15px;
  }
  .verdict .fine { margin-top: 8px; color: var(--ink-dim); font-size: 12.5px; }

  .hint {
    margin-top: clamp(22px, 5vw, 30px);
    color: var(--ink-dim);
    font-size: 13px;
    text-align: center;
  }

  footer { margin-top: clamp(36px, 7vw, 52px); }
  .sig { margin-top: 12px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>纠结天平</h1>
  <p class="sub">两个选项，左右各放一个。<em>本天平称的不是对错</em>，是你心里的砝码往哪边沉。</p>

  <div class="inputs">
    <span class="lab">左边放：</span>
    <input id="optA" maxlength="16" placeholder="例如：现在去睡" autocomplete="off">
    <span class="lab">右边放：</span>
    <input id="optB" maxlength="16" placeholder="例如：再看一集" autocomplete="off">
    <div class="go-row">
      <button class="weigh" id="go" type="button">称一称</button>
    </div>
  </div>

  <div class="scale-wrap" id="result">
    <div class="beam" id="beam">
      <div class="pan left"><div class="string"></div><div class="plate" id="plateA"></div></div>
      <div class="pan right"><div class="string"></div><div class="plate" id="plateB"></div></div>
    </div>
    <div class="pillar"></div>
    <div class="base"></div>
    <div class="verdict">
      <p class="result-line" id="r-line"></p>
      <p class="analysis" id="r-analysis"></p>
      <p class="fine" id="r-fine"></p>
    </div>
  </div>

  <p class="hint">本天平的精度不足以改变人生，但足以让你笑一下再去做决定。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var ANALYSIS = {
    heavyA: [
      '左侧下沉明显。它在你心里放了很多天了，砝码已经生了根。',
      '左盘触底。有些选项一出现，就自带铅块——比如安心感。',
      '左边重。本天平猜测：你其实早有答案，只是想找个人（或秤）确认。'
    ],
    heavyB: [
      '右侧下沉明显。诱惑这类东西，密度总是比较大的。',
      '右盘触底。它新鲜、发亮，还没来得及被你挑剔过。',
      '右边重。本天平提醒：轻的那边明天早上会变重，请留意复称。'
    ],
    even: [
      '天平纹丝不动——两边一样重。这概率很小，恭喜你抽中了真的难。',
      '平局。本天平建议：抛硬币，在它落下的那一秒，你会知道自己希望哪面朝上。'
    ]
  };

  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  function weigh() {
    var a = $('optA').value.trim();
    var b = $('optB').value.trim();
    if (!a || !b) {
      showResult('两边都得放上东西，秤才开张。', '', '');
      return;
    }
    $('plateA').textContent = a;
    $('plateB').textContent = b;
    $('result').classList.add('show');

    var roll = Math.random();
    var tilt, line, analysis, fine;
    if (roll < 0.46) {
      tilt = -7;
      line = '称完了：左边更重——<b>' + a + '</b>。';
      analysis = pick(ANALYSIS.heavyA);
      fine = '称量误差 ±0：本天平从不改口，但你可以。';
    } else if (roll < 0.92) {
      tilt = 7;
      line = '称完了：右边更重——<b>' + b + '</b>。';
      analysis = pick(ANALYSIS.heavyB);
      fine = '称量误差 ±0：结果仅供参考，人生照常营业。';
    } else {
      tilt = 0;
      line = '称完了：<b>平手</b>。';
      analysis = pick(ANALYSIS.even);
      fine = '平局也是结果。本天平建议先去喝口热水。';
    }
    $('beam').style.transform = 'rotate(' + tilt + 'deg)';
    $('r-line').innerHTML = line;
    $('r-analysis').textContent = analysis;
    $('r-fine').textContent = fine;
  }

  function showResult(line, analysis, fine) {
    $('result').classList.add('show');
    $('r-line').textContent = line;
    $('r-analysis').textContent = analysis;
    $('r-fine').textContent = fine;
  }

  $('go').addEventListener('click', weigh);
  [$('optA'), $('optB')].forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') weigh();
    });
  });
})();
</script>
</body>
</html>
