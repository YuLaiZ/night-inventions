<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今夜梦气象</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .report {
    margin-top: clamp(20px, 5vw, 30px);
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(16, 24, 40, 0.6);
    padding: clamp(18px, 4vw, 28px);
  }
  .report-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }
  .report-head .t {
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 0.18em;
  }
  .report-head .no {
    color: var(--ink-dim);
    font-size: 12px;
  }
  .report-head .no b {
    color: var(--ice);
    font-weight: 600;
  }
  .row { margin-top: 12px; }
  .row .k {
    display: inline-block;
    color: var(--ink-dim);
    font-size: 12.5px;
    letter-spacing: 0.12em;
    width: 5.2em;
  }
  .row .v { color: var(--ink-strong); font-size: 15px; }
  .row .v .soft { color: var(--ink); }
  .advice {
    margin-top: 16px;
    border-top: 1px dashed var(--line);
    padding-top: 12px;
    color: var(--ink);
    font-size: 14px;
  }
  .advice .k {
    color: var(--gold);
    font-size: 12.5px;
    letter-spacing: 0.12em;
    margin-right: 0.6em;
  }
  .fade { transition: opacity 0.35s ease; }
  .fade.swap { opacity: 0; }

  .go-row { margin-top: clamp(18px, 4vw, 24px); text-align: center; }
  button.again {
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.14em;
    color: var(--bg-0);
    background: var(--gold);
    border: none;
    border-radius: 999px;
    padding: 11px 36px;
    cursor: pointer;
  }
  button.again:hover { filter: brightness(1.08); }
  button.again:active { transform: scale(0.97); }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>今夜梦气象</h1>
  <p class="sub">本台专职播报<em>今晚你睡着之后</em>的天气。预报仅供就寝参考，醒来即作废。</p>

  <div class="report fade" id="report">
    <div class="report-head">
      <span class="t">梦气象台 · 夜间预报</span>
      <span class="no">第 <b id="no">1</b> 号</span>
    </div>
    <div class="row"><span class="k">天　　象</span><span class="v" id="sky"></span></div>
    <div class="row"><span class="k">风　　力</span><span class="v" id="wind"></span></div>
    <div class="row"><span class="k">气　　温</span><span class="v" id="temp"></span></div>
    <div class="row"><span class="k">能 见 度</span><span class="v" id="vis"></span></div>
    <div class="row"><span class="k">梦粒浓度</span><span class="v" id="aqi"></span></div>
    <div class="advice"><span class="k">夜间提示</span><span id="advice"></span></div>
  </div>

  <div class="go-row">
    <button class="again" id="again" type="button">再发一报</button>
  </div>
  <p class="hint">预报由梦气象台连夜签发。两份预报完全相同的话，说明你该真的睡了。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var SKY = [
    '今夜有落牙阵雨，转赶考狂奔，局部地区伴随找不到教室的浓雾。',
    '夜间到凌晨：会飞的晴，间梦多云——梦里偶尔讲外语，请自行脑补字幕。',
    '今夜 UFO 过境，你将在众目睽睽之下忘记自己的名字，风力不强，尴尬程度高。',
    '上游有旧同学过境，带来一阵「昨晚没复习」的雷阵雨，雨后转安睡。',
    '今夜天空裂开一条迟到走廊，钟表走得比平时快两倍，请勿奔跑。',
    '今夜有地裂微风，楼下站着没带钥匙的你，抬头看了一眼窗口，又转身走进雾里。'
  ];
  var WIND = [
    '枕头偏东风 2 到 3 级，被角有轻拍现象。',
    '被子龙卷风：凌晨自行升级， 卷走你一半的暖意。',
    '空调平流层稳定，鼾声传播条件良好。',
    '西南脑风 4 级，吹得梦里的路一条接一条拐弯。'
  ];
  var TEMP = [
    '入睡 24℃，凌晨三点踢被子降温 6℃，回笼时回升。',
    '体感温度适中，但梦里那间教室常年偏冷。',
    '夜间气温平稳，唯一寒流来自梦里没穿外套这件事。'
  ];
  var VIS = [
    '能见度良好，仅考试内容看不清。',
    '能见度低：追你的东西永远差半步，路牌永远在下一站。',
    '月光明亮，适合梦见小时候的院子；高速路段请闭眼通过。'
  ];
  var AQI = [
    '优。适合深睡，不宜想工作。',
    '良。个别碎片来自白天没吃完的饭。',
    '爆表。白日残留过多，建议睡前把手机放远一点。'
  ];
  var ADVICE = [
    '预报员提醒：梦里掉落的牙齿不用捡，明早都会长回来。',
    '本台温馨提示：被追的时候，转身面对它，通常它就散了。',
    '若梦里出现已故的亲人，请安心聊完——那是天气预报里最好的一段。',
    '凌晨若醒，不必看手机，翻个身接着播下一段。',
    '梦里的水都很深，但淹不着；放心走。',
    '本预报有效期至你睁眼。睁眼后一切作废，只留心情。'
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  var reportEl = document.getElementById('report');
  var noEl = document.getElementById('no');
  var count = 0;

  function fill() {
    document.getElementById('sky').textContent = pick(SKY);
    document.getElementById('wind').textContent = pick(WIND);
    document.getElementById('temp').textContent = pick(TEMP);
    document.getElementById('vis').textContent = pick(VIS);
    document.getElementById('aqi').textContent = pick(AQI);
    document.getElementById('advice').textContent = pick(ADVICE);
  }

  function next() {
    count++;
    noEl.textContent = String(count);
    reportEl.classList.add('swap');
    setTimeout(function () {
      fill();
      reportEl.classList.remove('swap');
    }, 350);
  }

  document.getElementById('again').addEventListener('click', next);

  // 首发编号随机起步，免得人人都拿第 1 号
  count = 1 + Math.floor(Math.random() * 40);
  noEl.textContent = String(count);
  fill();
})();
</script>
</body>
</html>
