<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开门了</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #12100e;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #4e4a44;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #96795c; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #5e5750; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #ac8e6a;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #524c44;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #5e5750;
    text-decoration: none;
    border-bottom: 1px dotted #5e5750;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #ac8e6a; border-color: #ac8e6a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>开门了</h1>
  <p>五块门板，一块一块卸。<br>卸完最后一块，蒸汽就涌出来了——豆浆豆浆，热乎的。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var PANELS = 5;
  var removed = 0;         // 已卸门板数
  var animP = -1;          // 正在卸的板（-1 无）
  var animT = 0;           // 卸板动画 0-1
  var openT = 0;           // 全开后内部亮起程度
  var saidStart = false;
  var saidDone = false;

  function say(text, hold) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!hold) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5600);
  }

  var L = {};
  function layout() {
    L.w = window.innerWidth;
    L.h = window.innerHeight;
    L.sx = L.w * 0.5;
    L.sy = L.h * 0.30;
    L.sw = Math.min(L.w * 0.72, L.h * 0.62, 620);
    L.sh = Math.min(L.h * 0.42, 420);
    L.pw = L.sw / PANELS;
  }
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  window.addEventListener('resize', function () {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  });

  // 共享按压路径（QA 钩子与真实事件走同一函数）
  function startPress() {
    if (animP >= 0) return;          // 上一块还在卸
    if (removed >= PANELS) return;   // 全开
    animP = removed;
    animT = 0;
    if (!saidStart) { saidStart = true; say('门板沉，往上顶一顶再卸。'); }
    else if (removed === PANELS - 1) say('最后一块——');
    else if (removed === 2) say('看见蒸汽了没？锅上来了。');
  }

  canvas.addEventListener('pointerdown', function () { startPress(); });

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var w = window.innerWidth, h = window.innerHeight;

    if (animP >= 0) {
      animT = Math.min(1, animT + dt * 1.8);
      if (animT >= 1) {
        removed++;
        animP = -1;
        if (removed >= PANELS) {
          saidDone = true;
          say('开门了。豆浆豆浆，热乎的。', true);
        }
      }
    }
    if (removed >= PANELS) openT = Math.min(1, openT + dt * 0.8);

    // ── 背景：晨光街面 ──
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#1a1c20');
    bg.addColorStop(1, '#26221c');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    // 晨光（右上来）
    var morn = ctx.createRadialGradient(w * 0.85, h * 0.1, 8, w * 0.85, h * 0.1, w * 0.4);
    morn.addColorStop(0, 'rgba(255,214,150,0.14)');
    morn.addColorStop(1, 'rgba(255,214,150,0)');
    ctx.fillStyle = morn;
    ctx.fillRect(0, 0, w, h);
    // 街面
    ctx.fillStyle = '#242019';
    ctx.fillRect(0, L.sy + L.sh, w, h);
    ctx.fillStyle = 'rgba(210,170,110,0.08)';
    ctx.fillRect(0, L.sy + L.sh, w, 2);

    // ── 铺子门脸 ──
    var sx = L.sx - L.sw / 2, sy = L.sy;
    // 檐口
    ctx.fillStyle = '#3c3028';
    ctx.fillRect(sx - 14, sy - 16, L.sw + 28, 18);
    ctx.fillStyle = 'rgba(220,170,100,0.25)';
    ctx.font = '15px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('早  点  早  点', L.sx, sy - 3);
    // 店内（随 openT 亮起）
    var innerA = 0.18 + openT * 0.82;
    var inner = ctx.createLinearGradient(0, sy, 0, sy + L.sh);
    inner.addColorStop(0, 'rgba(240,190,110,' + 0.55 * innerA + ')');
    inner.addColorStop(1, 'rgba(120,80,40,' + 0.6 * innerA + ')');
    ctx.fillStyle = inner;
    ctx.fillRect(sx, sy, L.sw, L.sh);
    // 店内陈设（亮起才画）
    if (openT > 0.05) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(sx, sy, L.sw, L.sh);
      ctx.clip();
      // 蒸笼塔
      var stackX = sx + L.sw * 0.18;
      for (var st = 0; st < 3; st++) {
        var stY = sy + L.sh - 26 - st * 30;
        ctx.fillStyle = 'rgba(180,140,90,' + innerA + ')';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(stackX - 34, stY, 68, 28, 4);
        else ctx.rect(stackX - 34, stY, 68, 28);
        ctx.fill();
        ctx.strokeStyle = 'rgba(90,60,30,0.5)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      // 蒸汽
      for (var v = 0; v < 3; v++) {
        var vX = stackX + (v - 1) * 18;
        var vY = sy + L.sh - 26 - 90 - ((now / (26 + v * 7)) % 40);
        ctx.strokeStyle = 'rgba(250,245,235,' + innerA * (0.5 - v * 0.1) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(vX, vY + 10);
        ctx.quadraticCurveTo(vX + 4, vY, vX, vY - 10);
        ctx.stroke();
      }
      // 柜台 + 碗
      ctx.fillStyle = 'rgba(70,50,30,' + innerA + ')';
      ctx.fillRect(sx + L.sw * 0.5, sy + L.sh - 60, L.sw * 0.42, 12);
      ctx.fillStyle = 'rgba(240,232,210,' + innerA + ')';
      for (var bw = 0; bw < 3; bw++) {
        ctx.beginPath();
        ctx.ellipse(sx + L.sw * (0.60 + bw * 0.10), sy + L.sh - 66, 13, 5, 0, Math.PI, 0);
        ctx.fill();
      }
      // 火苗（灶口）
      ctx.fillStyle = 'rgba(255,150,60,' + innerA * (0.5 + 0.3 * Math.sin(now / 130)) + ')';
      ctx.beginPath();
      ctx.ellipse(sx + L.sw * 0.86, sy + L.sh - 30, 7, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ── 门板（还没卸的）──
    for (var p = PANELS - 1; p >= removed; p--) {
      var px2 = sx + p * L.pw;
      if (p === animP) {
        // 正在卸：向上滑出并淡出
        var t = animT;
        var lift = -L.sh * 0.9 * t;
        ctx.save();
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = '#4a3c2e';
        ctx.fillRect(px2 + 2, sy + lift, L.pw - 4, L.sh);
        ctx.strokeStyle = 'rgba(20,14,10,0.7)';
        ctx.lineWidth = 2;
        ctx.strokeRect(px2 + 2, sy + lift, L.pw - 4, L.sh);
        ctx.restore();
      } else {
        ctx.fillStyle = '#4a3c2e';
        ctx.fillRect(px2 + 2, sy, L.pw - 4, L.sh);
        ctx.strokeStyle = 'rgba(20,14,10,0.7)';
        ctx.lineWidth = 2;
        ctx.strokeRect(px2 + 2, sy, L.pw - 4, L.sh);
        // 板上提手
        ctx.fillStyle = '#2c2118';
        ctx.beginPath();
        ctx.arc(px2 + L.pw / 2, sy + 26, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // 已卸下的板靠墙根（左侧摞着）
    for (var r2 = 0; r2 < removed; r2++) {
      ctx.fillStyle = 'rgba(74,60,46,' + (0.85 - r2 * 0.06) + ')';
      ctx.fillRect(sx - 30 - r2 * 8, sy + L.sh - 14 - r2 * 5, 10, L.sh * 0.32);
    }

    // ── 计数（等宽数字）──
    ctx.fillStyle = 'rgba(196,186,166,0.55)';
    ctx.font = '12px ui-monospace, "SF Mono", Menlo, monospace';
    ctx.textAlign = 'right';
    ctx.fillText('门板 ' + removed + ' / ' + PANELS, w - 22, 34);
    ctx.textAlign = 'left';

    // 引导
    if (removed < PANELS) {
      ctx.fillStyle = 'rgba(196,178,148,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
      ctx.font = '13px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('按一下，卸一块门板', L.sx, sy + L.sh + 48);
    }
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // QA 钩子（无私人信息；与真实事件共用 startPress）
  window.__shop = {
    removed: function () { return removed; },
    panels: function () { return PANELS; },
    openT: function () { return +openT.toFixed(2); },
    press: function () { startPress(); }
  };
})();
</script>
</body>
</html>
