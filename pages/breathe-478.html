<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>478 呼吸</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .pond {
    position: relative;
    margin-top: clamp(18px, 4vw, 26px);
    height: 340px;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 46%, #0e1a2a 0%, #0a101c 70%);
  }
  .circle {
    position: absolute;
    left: 50%;
    top: 45%;
    width: 200px;
    height: 200px;
    margin: -100px 0 0 -100px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(156, 200, 255, 0.16) 0%, rgba(156, 200, 255, 0.05) 62%, rgba(156, 200, 255, 0) 72%);
    box-shadow: inset 0 0 40px rgba(156, 200, 255, 0.12);
    will-change: transform;
  }
  .phase {
    position: absolute;
    left: 0; right: 0;
    top: 45%;
    transform: translateY(-50%);
    text-align: center;
    color: var(--ink-strong);
    font-size: 19px;
    letter-spacing: 0.14em;
  }
  .count {
    position: absolute;
    left: 0; right: 0;
    top: 45%;
    margin-top: 34px;
    text-align: center;
    color: var(--gold);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 26px;
  }
  .laps {
    position: absolute;
    left: 0; right: 0;
    bottom: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 12.5px;
    letter-spacing: 0.08em;
  }

  .actions {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  button.act {
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.12em;
    border: none;
    border-radius: 999px;
    padding: 10px 32px;
    cursor: pointer;
    color: var(--bg-0);
    background: var(--gold);
  }
  button.act.ghostBtn {
    color: var(--ink);
    background: rgba(16, 24, 40, 0.8);
    border: 1px solid var(--line);
  }
  button.act:hover { filter: brightness(1.08); }
  button.act:active { transform: scale(0.97); }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>478 呼吸</h1>
  <p class="sub">睡不着的工兵铲：吸气 4 秒，屏住 7 秒，呼气 8 秒。<em>跟四轮，困意就追上来了。</em></p>

  <div class="pond" id="pond">
    <div class="circle" id="circle"></div>
    <div class="phase" id="phase">准备好了就用鼻子开始</div>
    <div class="count" id="count"></div>
    <div class="laps" id="laps">第 0 轮</div>
  </div>

  <div class="actions">
    <button class="act" id="startBtn" type="button">开始</button>
    <button class="act ghostBtn" id="stopBtn" type="button">停</button>
  </div>

  <p class="hint">呼气一定要长过吸气——身体以为你安全了，才会慢慢松手。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var PHASES = [
    { name: '吸气', secs: 4, from: 0.62, to: 1 },
    { name: '屏住', secs: 7, from: 1, to: 1 },
    { name: '呼气', secs: 8, from: 1, to: 0.62 }
  ];

  var circle = document.getElementById('circle');
  var phaseEl = document.getElementById('phase');
  var countEl = document.getElementById('count');
  var lapsEl = document.getElementById('laps');
  var startBtn = document.getElementById('startBtn');
  var stopBtn = document.getElementById('stopBtn');

  var running = false;
  var t0 = 0;               /* 本轮起点（墙钟） */
  var lap = 0;
  var timer = null;
  var lastPhaseIdx = -1;

  function phaseAt(elapsedMs) {
    var total = 0;
    var i;
    for (i = 0; i < PHASES.length; i++) total += PHASES[i].secs;
    var sec = (elapsedMs / 1000) % total;
    var acc = 0;
    for (i = 0; i < PHASES.length; i++) {
      if (sec < acc + PHASES[i].secs) return { idx: i, into: sec - acc, remain: PHASES[i].secs - (sec - acc), lapProgress: sec / total };
      acc += PHASES[i].secs;
    }
    return { idx: 0, into: 0, remain: PHASES[0].secs, lapProgress: 0 };
  }

  function render(now) {
    if (!running) return;
    var p = phaseAt(now - t0);
    var ph = PHASES[p.idx];
    /* 胀缩：相位内线性插值 */
    var k = ph.from + (ph.to - ph.from) * Math.min(1, p.into / ph.secs);
    var scale = 0.62 + 0.38 * k;
    circle.style.transform = 'scale(' + scale.toFixed(4) + ')';

    if (p.idx !== lastPhaseIdx) {
      phaseEl.textContent = ph.name;
      lastPhaseIdx = p.idx;
    }
    countEl.textContent = Math.ceil(p.remain);
    var newLap = Math.floor((now - t0) / (19000)) ;
    if (newLap !== lap) {
      lap = newLap;
      lapsEl.textContent = '第 ' + lap + ' 轮' + (lap >= 4 ? ' —— 困了就去睡，不用谢' : '');
    }
  }

  /* 呼吸是慢动画：纯 setTimeout 链即可，不依赖 rAF（后台/节流环境不断链） */
  function loop() {
    if (!running) return;
    render(Date.now());
    setTimeout(loop, 60);
  }

  function start() {
    if (running) return;
    running = true;
    t0 = Date.now();
    lap = 0;
    lastPhaseIdx = -1;
    lapsEl.textContent = '第 0 轮';
    startBtn.textContent = '进行中…';
    loop();
  }

  function stop() {
    if (!running) return;
    running = false;
    startBtn.textContent = '开始';
    phaseEl.textContent = '随时回来，它都在';
    countEl.textContent = '';
    lapsEl.textContent = '第 ' + lap + ' 轮';
    circle.style.transform = 'scale(0.62)';
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
})();
</script>
</body>
</html>
