<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指尖烟花</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .sky {
    position: relative;
    margin-top: clamp(18px, 4vw, 26px);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
  }
  .sky canvas { display: block; width: 100%; }
  .sky .tip {
    position: absolute;
    left: 0; right: 0; bottom: 10px;
    text-align: center;
    color: rgba(199, 208, 226, 0.55);
    font-size: 12.5px;
    letter-spacing: 0.06em;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .sky.lit .tip { opacity: 0; }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>指尖烟花</h1>
  <p class="sub">今晚的烟花没有声音——<em>怕吵醒楼下的梦</em>。</p>

  <div class="sky" id="sky">
    <canvas id="cv"></canvas>
    <div class="tip">在夜空任意处点一下</div>
  </div>

  <p class="hint">一朵从升起到谢幕大约四秒。烟会多留一会儿，像所有舍不得散场的事。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var sky = document.getElementById('sky');

  var W = 0, H = 0, DPR = 1;
  var buildings = [];
  var stars = [];

  function resize() {
    var w = sky.clientWidth;
    var h = Math.round(Math.min(430, Math.max(320, w * 0.78)));
    DPR = window.devicePixelRatio || 1;
    cv.width = w * DPR;
    cv.height = h * DPR;
    cv.style.height = h + 'px';
    W = w; H = h;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildCity();
  }

  function buildCity() {
    buildings = [];
    stars = [];
    var x = -6;
    while (x < W + 6) {
      var bw = 26 + Math.random() * 44;
      var bh = 40 + Math.random() * (H * 0.22);
      var wins = [];
      var cols = Math.floor(bw / 14), rows = Math.floor(bh / 16);
      for (var i = 0; i < cols; i++)
        for (var j = 0; j < rows; j++)
          if (Math.random() < 0.16) wins.push([3 + i * 14, 6 + j * 16]);
      buildings.push({ x: x, w: bw, h: bh, wins: wins });
      x += bw + 2;
    }
    for (var s = 0; s < 26; s++)
      stars.push({ x: Math.random() * W, y: Math.random() * H * 0.5, r: Math.random() * 1.1 + 0.4, tw: Math.random() * 6.28 });
  }

  /* ── 烟花状态机：idle → rising → burst ── */
  var state = 'idle';
  var rise = null, parts = [], smokes = [], burstAt = 0;
  var lastFrame = Date.now();

  var PALETTES = [
    ['#ffd98a', '#ffb347', '#fff3d6'],   /* 暖金 */
    ['#cfe6ff', '#9cc8ff', '#ffffff'],   /* 冰蓝 */
    ['#ffc2d1', '#ff8fab', '#ffe3ec']    /* 桃粉 */
  ];

  function launch(tx, ty) {
    var b = buildings[Math.floor(Math.random() * buildings.length)];
    var sx = Math.min(W - 20, Math.max(20, b.x + b.w / 2));
    var sy = H - b.h;
    var dur = 900 + Math.random() * 300;
    rise = { sx: sx, sy: sy, tx: Math.min(W - 30, Math.max(30, tx)), ty: Math.max(46, ty), t0: Date.now(), dur: dur };
    state = 'rising';
    sky.classList.add('lit');
    lastFrame = Date.now();
    requestAnimationFrame(frame);
  }

  function explode(x, y) {
    var pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];
    var n = 90 + Math.floor(Math.random() * 40);
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = (0.55 + Math.random() * 0.45) * (0.13 + Math.random() * 0.1);
      parts.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd * W,
        vy: Math.sin(ang) * spd * W,
        life: 1, decay: 0.55 + Math.random() * 0.5,
        c: pal[Math.random() < 0.22 ? 2 : (Math.random() < 0.6 ? 0 : 1)],
        r: 1 + Math.random() * 1.6
      });
    }
    for (var s = 0; s < 3; s++) {
      smokes.push({
        x: x + (Math.random() - 0.5) * 26, y: y + (Math.random() - 0.5) * 20,
        r: 8 + Math.random() * 10, a: 0.16, born: Date.now(), drift: (Math.random() - 0.5) * 4
      });
    }
    burstAt = Date.now();
    state = 'burst';
  }

  function step(dt) {
    var i, p;
    if (state === 'burst') {
      for (i = parts.length - 1; i >= 0; i--) {
        p = parts[i];
        p.life -= p.decay * dt;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        p.vy += 170 * dt;                       /* 重力（px/s²） */
        p.vx *= (1 - 0.9 * dt);                 /* 空气阻力 */
        p.vy *= (1 - 0.35 * dt);
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      for (i = smokes.length - 1; i >= 0; i--) {
        var sm = smokes[i];
        var age = (Date.now() - sm.born) / 1000;
        if (age > 4.2) { smokes.splice(i, 1); continue; }
        sm.r += 5.5 * dt;
        sm.y -= 9 * dt;
        sm.x += sm.drift * dt;
        sm.a = 0.16 * (1 - age / 4.2);
      }
      if (Date.now() - burstAt > 3400 && parts.length === 0) {
        state = 'idle';
      }
    }
  }

  function draw() {
    /* 夜空 */
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070a14');
    g.addColorStop(1, '#101a30');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 星 */
    var now = Date.now();
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = 0.35 + 0.3 * Math.sin(now / 900 + st.tw);
      ctx.fillStyle = '#cfe0ff';
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
    ctx.globalAlpha = 1;

    /* 月牙（用近背景色圆遮挡，不用 destination-out 挖穿星空） */
    ctx.save();
    ctx.fillStyle = '#e8e2c9';
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.16, 13, 0, 6.29);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0a101e';
    ctx.beginPath();
    ctx.arc(W * 0.82 - 6, H * 0.16 - 4, 12, 0, 6.29);
    ctx.fill();
    ctx.restore();

    /* 烟 */
    for (var m = 0; m < smokes.length; m++) {
      var smk = smokes[m];
      ctx.globalAlpha = smk.a;
      ctx.fillStyle = '#8a93a8';
      ctx.beginPath();
      ctx.arc(smk.x, smk.y, smk.r, 0, 6.29);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* 楼群 */
    for (var b = 0; b < buildings.length; b++) {
      var bd = buildings[b];
      ctx.fillStyle = '#141d33';
      ctx.fillRect(bd.x, H - bd.h, bd.w, bd.h);
      ctx.fillStyle = 'rgba(242, 199, 110, 0.5)';
      for (var w2 = 0; w2 < bd.wins.length; w2++) {
        ctx.fillRect(bd.x + bd.wins[w2][0], H - bd.h + bd.wins[w2][1], 4, 6);
      }
    }

    /* 上升光点 */
    if (state === 'rising' && rise) {
      var t = Math.min(1, (Date.now() - rise.t0) / rise.dur);
      var ease = 1 - Math.pow(1 - t, 2);
      var px = rise.sx + (rise.tx - rise.sx) * ease + Math.sin(t * 9) * 3 * (1 - t);
      var py = rise.sy + (rise.ty - rise.sy) * ease;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#ffe9b8';
      ctx.beginPath();
      ctx.arc(px, py, 2.2, 0, 6.29);
      ctx.fill();
      ctx.globalAlpha = 0.25;
      ctx.beginPath();
      ctx.arc(px, py + 7, 1.6, 0, 6.29);
      ctx.fill();
      if (t >= 1) {
        rise = null;
        explode(px, py);
      }
    }

    /* 粒子 */
    for (var p2 = 0; p2 < parts.length; p2++) {
      var pt = parts[p2];
      ctx.globalAlpha = Math.max(0, Math.min(1, pt.life)) * (0.55 + 0.45 * Math.sin(pt.life * 40));
      ctx.fillStyle = pt.c;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r * (0.5 + pt.life * 0.5), 0, 6.29);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function frame() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    step(dt);
    draw();
    if (state !== 'idle') requestAnimationFrame(frame);
    else draw();
  }
  /* 后台 rAF 停摆兜底：仅在主循环失联（>300ms 未跑）时补步，避免双重积分 */
  setInterval(function () {
    var now = Date.now();
    if (state !== 'idle' && now - lastFrame > 300) {
      step(Math.min(0.5, (now - lastFrame) / 1000));
      lastFrame = now;
      draw();
    }
  }, 500);

  sky.addEventListener('pointerdown', function (ev) {
    if (state !== 'idle') return;               /* 进行中锁：一朵谢了再点 */
    var rect = sky.getBoundingClientRect();
    launch(ev.clientX - rect.left, ev.clientY - rect.top);
  });

  window.addEventListener('resize', function () { resize(); draw(); });
  resize();
  draw();
})();
</script>
</body>
</html>
