<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜对牌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06080d;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #c9c2b4;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .copy {
    position: absolute; top: 36px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #8a857a; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #565a63; letter-spacing: 0.08em; }
  .grid {
    position: absolute; left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    display: grid;
    grid-template-columns: repeat(4, 92px);
    grid-gap: 12px;
    z-index: 2;
  }
  .card {
    width: 92px; height: 118px;
    perspective: 700px;
    cursor: pointer;
  }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0.1, 0.3, 1);
  }
  .card.open .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .face-back {
    background: linear-gradient(160deg, #262d3b, #171c26);
    border: 2px solid #39414f;
    color: #4a5262;
    font-size: 26px;
  }
  .face-front {
    transform: rotateY(180deg);
    background: linear-gradient(170deg, #f0e9d8, #ddd2ba);
    color: #33302a;
    font-size: 30px;
    font-weight: 500;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .card.matched .face-front {
    background: linear-gradient(170deg, #ffe9b8, #ecd39a);
    box-shadow: 0 0 22px rgba(255,220,150,0.35);
  }
  .line {
    position: absolute; bottom: 9vh; left: 0; right: 0;
    text-align: center;
    font-size: 13px; letter-spacing: 0.1em;
    color: #a89f8e;
    min-height: 24px;
    opacity: 0;
    transition: opacity 0.9s ease;
    z-index: 3;
    padding: 0 26px;
    pointer-events: none;
  }
  .line.show { opacity: 0.95; }
  .again {
    position: absolute; bottom: 4.5vh; left: 0; right: 0;
    text-align: center;
    z-index: 3;
  }
  .again button {
    background: #1c2230;
    border: 1px solid #333d4f;
    border-radius: 8px;
    color: #b9b3a5;
    font-size: 12px;
    letter-spacing: 0.16em;
    padding: 7px 18px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    font-family: inherit;
  }
  body.won .again button { opacity: 1; pointer-events: auto; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #3c4048;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #565a63;
    text-decoration: none;
    border-bottom: 1px dotted #565a63;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #9b948a; border-color: #9b948a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>

<div class="copy">
  <h1>深夜对牌</h1>
  <p>十六张牌，八对深夜的词。<br>翻开来配一配——配对成功的，都有话说。</p>
</div>

<div class="grid" id="grid"></div>
<div class="line" id="line"></div>
<div class="again"><button id="again">再洗一副</button></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var PAIRS = [
    { w: '月亮', line: '月亮和灯，都是夜里值班的光。' },
    { w: '台灯', line: null },
    { w: '猫', line: '两只猫，一只在床头，一只在梦的门口。' },
    { w: '海', line: null },
    { w: '风', line: '风翻窗，是想替你把心事翻个面。' },
    { w: '信', line: null },
    { w: '星', line: '星星和路灯商量好了，谁也不下班。' },
    { w: '茶', line: '茶凉了一半，夜也过了一半。' }
  ];

  var grid = document.getElementById('grid');
  var line = document.getElementById('line');
  var first = null, lock = false, matched = 0;
  var lineTimer = null;

  function say(text) {
    line.textContent = text;
    line.classList.add('show');
    if (lineTimer) clearTimeout(lineTimer);
    lineTimer = setTimeout(function () { line.classList.remove('show'); }, 4200);
  }

  function deal() {
    grid.innerHTML = '';
    first = null; lock = false; matched = 0;
    document.body.classList.remove('won');
    line.classList.remove('show');
    var deck = [];
    PAIRS.forEach(function (p) { deck.push(p.w, p.w); });
    // 洗牌
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    deck.forEach(function (word) {
      var el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<div class="card-inner">' +
        '<div class="face face-back">✦</div>' +
        '<div class="face face-front">' + word + '</div>' +
        '</div>';
      el.dataset.word = word;
      grid.appendChild(el);
      el.addEventListener('click', function () { flip(el); });
    });
  }

  function flip(el) {
    if (lock || el.classList.contains('open') || el.classList.contains('matched')) return;
    el.classList.add('open');
    if (!first) { first = el; return; }

    var a = first.dataset.word, b = el.dataset.word;
    if (a === b) {
      first.classList.add('matched');
      el.classList.add('matched');
      first.classList.remove('open');
      el.classList.remove('open');
      var pair = PAIRS.find(function (p) { return p.w === a; });
      if (pair.line) say(pair.line);
      first = null;
      matched++;
      if (matched === PAIRS.length) {
        setTimeout(function () {
          document.body.classList.add('won');
          say('八对全齐。今晚的词都归位了，你也归位吧。');
        }, 700);
      }
    } else {
      lock = true;
      var keep = first;
      setTimeout(function () {
        keep.classList.remove('open');
        el.classList.remove('open');
        lock = false;
      }, 850);
      first = null;
    }
  }

  document.getElementById('again').addEventListener('click', deal);
  deal();
})();
</script>
</body>
</html>
