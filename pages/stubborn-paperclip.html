<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拖不动的回形针</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 620px;
    margin: 0 auto;
    padding: clamp(30px, 6vw, 52px) 22px 40px;
  }
  .back-home {
    display: inline-block;
    font-size: 13px;
    color: var(--ink-dim);
    text-decoration: none;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .back-home:hover { color: var(--gold); }
  header h1 {
    font-weight: 600;
    font-size: clamp(26px, 6vw, 34px);
    letter-spacing: 0.02em;
    color: var(--ink-strong);
  }
  .intro {
    margin-top: 10px;
    color: var(--ink-dim);
    font-size: 15px;
    max-width: 34em;
  }
  .board {
    margin-top: clamp(22px, 5vw, 32px);
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(16, 22, 40, 0.55);
    padding: clamp(22px, 5vw, 34px);
    min-height: 300px;
    position: relative;
  }
  .clip {
    width: 64px;
    cursor: grab;
    transition: transform 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
    touch-action: none;
  }
  .clip:active { cursor: grabbing; }
  .clip.dragging { transition: none; }
  .note {
    background: #f5e6a8;
    color: #3a3320;
    border-radius: 4px;
    padding: 18px 16px 14px 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    font-size: 15px;
    line-height: 1.7;
    transform: rotate(-1.2deg);
    position: relative;
    margin-top: 26px;
    max-width: 26em;
  }
  .note::before {
    content: "";
    position: absolute;
    top: -14px; left: 18px;
  }
  #clip-svg { display: block; width: 64px; }
  #say {
    margin-top: 16px;
    min-height: 1.8em;
    font-size: 14px;
    color: var(--ice);
  }
  .deal { margin-top: 14px; display: none; }
  .deal.show { display: block; }
  .deal textarea {
    width: 100%;
    min-height: 72px;
    background: rgba(10, 13, 23, 0.6);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink-strong);
    font-family: var(--sans);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    resize: vertical;
  }
  .deal textarea:focus { border-color: rgba(156, 200, 255, 0.4); }
  .deal button, #btn-reset {
    margin-top: 10px;
    background: rgba(242, 199, 110, 0.12);
    border: 1px solid rgba(242, 199, 110, 0.55);
    color: var(--gold);
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.12em;
    padding: 9px 24px;
    border-radius: 999px;
    cursor: pointer;
  }
  .deal button:hover, #btn-reset:hover { background: rgba(242, 199, 110, 0.2); }
  #btn-reset {
    margin-top: 16px;
    background: none;
    border-color: var(--line);
    color: var(--ink-dim);
    font-size: 12.5px;
    padding: 7px 18px;
  }
  #btn-reset:hover { color: var(--ink-strong); }
  .hint {
    margin-top: 22px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  footer { margin-top: clamp(36px, 7vw, 52px); }
  .motto { font-size: 15px; color: #a8b3c9; letter-spacing: 0.04em; }
  .sig { margin-top: 12px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>
  <header>
    <h1>拖不动的回形针</h1>
    <p class="intro">展品柜里最倔的一件。你可以试着把它拖走——它有话要说。</p>
  </header>

  <div class="board">
    <svg class="clip" id="clip" viewBox="0 0 64 120" aria-label="回形针">
      <path d="M20 8 C40 8 46 24 46 40 L46 88 C46 102 34 110 24 106 C14 102 12 90 18 82 L44 52 C50 44 46 34 38 32 C30 30 24 36 24 44 L24 76"
        fill="none" stroke="#b9c2d4" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <p id="say">（它安静地待着，蓄谋已久。）</p>

    <div class="note" id="note" hidden>
      <span id="note-text"></span>
    </div>

    <div class="deal" id="deal">
      <p style="font-size:14px;color:var(--ink)">回形针：与其拖走我，不如让我钉住一句你想留下来的话。就一句，我钉得比你见过的所有图钉都牢。</p>
      <textarea id="note-input" maxlength="60" placeholder="写点想钉在墙上的一句话……"></textarea>
      <button type="button" id="btn-pin">让回形针钉住它</button>
    </div>

    <button type="button" id="btn-reset" hidden>解钉重来</button>
  </div>

  <p class="hint">拖不动是真的拖不动。但它心软，试着多惹它几次。</p>

  <footer>
    <p class="motto">倔强是它的钉法。</p>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'paperclip-v1';
  var LINES = [
    '（纹丝不动。）',
    '回形针：我钉着我的东西呢。',
    '回形针：这是原则问题。',
    '回形针：你再拖一个试试。',
    '回形针：……好吧，我们谈谈。'
  ];

  var state = { attempts: 0, pinned: false, text: '' };

  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s === 'object') return s;
      }
    } catch (e) { /* 存储不可用时按新访客处理 */ }
    return { attempts: 0, pinned: false, text: '' };
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 安静跳过 */ }
  }

  function showPinned() {
    $('note').hidden = false;
    $('note-text').textContent = state.text || '（一句空话也是一句话。）';
    $('deal').classList.remove('show');
    $('btn-reset').hidden = false;
    $('say').textContent = '回形针：成交。它现在钉得可牢了。';
  }

  function showFree() {
    $('note').hidden = true;
    $('btn-reset').hidden = true;
    $('deal').classList.remove('show');
    $('say').textContent = '（它安静地待着，蓄谋已久。）';
  }

  function render() {
    if (state.pinned) showPinned();
    else showFree();
  }

  /* 拖拽：弹性抵抗 */
  var clip = $('clip');
  var dragging = false;
  var startX = 0, startY = 0;
  var attempts = 0;

  clip.addEventListener('pointerdown', function (e) {
    if (state.pinned) {
      $('say').textContent = '回形针：它现在钉得可牢了。';
      return;
    }
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    clip.classList.add('dragging');
    try { clip.setPointerCapture && clip.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件无活跃指针，忽略 */ }
  });

  clip.addEventListener('pointermove', function (e) {
    if (!dragging || state.pinned) return;
    var dx = (e.clientX - startX) * 0.3;
    var dy = (e.clientY - startY) * 0.3;
    clip.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + Math.max(-14, Math.min(14, dx / 3)) + 'deg)';
    if (Math.sqrt(dx * dx + dy * dy) > 14 && attempts < LINES.length) {
      attempts++;
      $('say').textContent = LINES[attempts - 1];
      if (attempts === LINES.length) {
        endDrag();
        $('deal').classList.add('show');
        $('note-input').focus();
      }
    }
  });

  function endDrag() {
    dragging = false;
    clip.classList.remove('dragging');
    clip.style.transform = '';
  }

  clip.addEventListener('pointerup', endDrag);
  clip.addEventListener('pointercancel', endDrag);
  clip.addEventListener('pointerleave', endDrag);

  $('btn-pin').addEventListener('click', function () {
    var t = $('note-input').value.trim();
    state.text = t || '（一句空话也是一句话。）';
    state.pinned = true;
    save();
    render();
  });

  $('btn-reset').addEventListener('click', function () {
    state = { attempts: 0, pinned: false, text: '' };
    save();
    attempts = 0;
    render();
    $('say').textContent = '回形针：又自由了。哼。';
  });

  state = load();
  render();
})();
</script>
</body>
</html>
