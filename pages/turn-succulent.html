<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给窗台的绿植转盆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14110d;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #a3967e;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #d6c9ac; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #857962; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #d6c9ac;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #554b3b;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #857962;
    text-decoration: none;
    border-bottom: 1px dotted #857962;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #d6c9ac; border-color: #d6c9ac; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>给窗台的绿植转盆</h1>
  <p>窗台上那盆绿植，总朝着太阳那边歪，歪了半个月。<br>按住花盆转一圈——这周它哪面都能晒到太阳。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var seed = 20260919;
  function mulberry(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry(seed);

  function say(text, holdLong) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!holdLong) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5600);
  }

  var L = {};
  function layout() {
    L.w = window.innerWidth;
    L.h = window.innerHeight;
    L.s = Math.max(0.7, Math.min(1.6, Math.min(L.w / 900, L.h / 640)));
    L.cx = L.w / 2;
    L.cy = L.h * 0.55;
  }
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  window.addEventListener('resize', function () {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  });

  // ── 状态 ──
  var potAng = -0.5;        // 盆旋转角（rad）
  var covered = 0;          // 转角覆盖累计（rad，要 ≥ 2π 才算转匀）
  var dragging = false;
  var lastA = 0;
  var even = 0;             // 叶片舒展回正 0..1
  var doneFired = false;
  var saidFirst = false;
  var evenT = 0;

  // 莲座叶片（10 片，初始整体偏向一侧——偏斜量随 even 减小）
  var leaves = [];
  for (var li = 0; li < 10; li++) {
    leaves.push({
      a: li / 10 * Math.PI * 2,          // 本征角度
      lean: 0.5 + rng() * 0.3,           // 偏斜（朝窗侧歪）
      len: 26 + rng() * 8
    });
  }

  var POT_R;
  function calcP() { POT_R = 88 * L.s; }
  calcP();

  function hitPot(px, py) {
    var dx = px - L.cx, dy = py - L.cy;
    return dx * dx + dy * dy < Math.pow(POT_R * 2.2, 2);
  }

  canvas.addEventListener('pointerdown', function (ev) {
    ensureAudio();
    if (doneFired) return;
    if (hitPot(ev.clientX, ev.clientY)) {
      dragging = true;
      lastA = Math.atan2(ev.clientY - L.cy, ev.clientX - L.cx);
      if (!saidFirst) { saidFirst = true; say('按住花盆，转起来——别急，一圈就够。'); }
    }
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!dragging || doneFired) return;
    var a = Math.atan2(ev.clientY - L.cy, ev.clientX - L.cx);
    var dA = a - lastA;
    if (dA > Math.PI) dA -= Math.PI * 2;
    if (dA < -Math.PI) dA += Math.PI * 2;
    potAng += dA;
    covered += Math.abs(dA);
    lastA = a;
    if (covered >= Math.PI * 2) {
      covered = Math.PI * 2;
      doneFired = true;
      evenT = 0.001;
      setTimeout(function () {
        say('转均匀了。这一周，它哪面都能晒到太阳。', true);
      }, 900);
    }
  });
  window.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('pointercancel', function () { dragging = false; });

  // ── 声音 ──
  var AC = null;
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  function scratch() {
    if (!AC || AC.state !== 'running') return;
    var t = AC.currentTime;
    var len = AC.sampleRate * 0.1;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.2);
    var src = AC.createBufferSource();
    src.buffer = buf;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 1;
    var g = AC.createGain();
    g.gain.value = 0.03;
    src.connect(bp); bp.connect(g); g.connect(AC.destination);
    src.start(t);
  }
  var scratchAt = 0;

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.08, (now - last) / 1000);
    last = now;
    var w = L.w, h = L.h;
    calcP();
    if (evenT > 0 && evenT < 1) evenT = Math.min(1, evenT + dt * 0.6);
    even = doneFired ? evenT : 0;

    if (dragging && now - (tick.lastS || 0) > 200) { tick.lastS = now; scratch(); }

    // ── 绘制 ──
    // 晨光窗台
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, mix([26, 22, 16], [96, 82, 58], 0.4));
    bg.addColorStop(1, mix([16, 13, 10], [64, 54, 40], 0.4));
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    // 晨光斜射
    var sun = ctx.createLinearGradient(w, 0, w * 0.3, h * 0.6);
    sun.addColorStop(0, 'rgba(245,222,165,0.16)');
    sun.addColorStop(1, 'rgba(245,222,165,0)');
    ctx.fillStyle = sun;
    ctx.fillRect(0, 0, w, h);
    // 窗台台面
    ctx.fillStyle = '#3c342a';
    ctx.fillRect(0, L.cy + 70 * L.s, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(0, L.cy + 70 * L.s, w, 2);

    ctx.save();
    ctx.translate(L.cx, L.cy);
    // 盆影
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(8, 58 * L.s, POT_R * 0.9, 12 * L.s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 花盆（陶）——先画盆，叶片从盆口向上长
    var potG = ctx.createLinearGradient(-POT_R * 0.9, 0, POT_R * 0.9, 0);
    potG.addColorStop(0, '#8a5a3c');
    potG.addColorStop(0.5, '#a86e48');
    potG.addColorStop(1, '#7a4e34');
    ctx.fillStyle = potG;
    ctx.beginPath();
    ctx.moveTo(-POT_R * 0.92, -4 * L.s);
    ctx.lineTo(POT_R * 0.92, -4 * L.s);
    ctx.lineTo(POT_R * 0.7, 52 * L.s);
    ctx.lineTo(-POT_R * 0.7, 52 * L.s);
    ctx.closePath();
    ctx.fill();
    // 盆沿
    ctx.fillStyle = '#966342';
    ctx.beginPath();
    ctx.roundRect(-POT_R, -12 * L.s, POT_R * 2, 12 * L.s, 4);
    ctx.fill();
    // 盆面小刻痕
    ctx.strokeStyle = 'rgba(50,30,18,0.35)';
    ctx.lineWidth = 1.2;
    for (var ki = 0; ki < 3; ki++) {
      ctx.beginPath();
      ctx.moveTo(-POT_R * 0.5 + ki * POT_R * 0.4, 10 * L.s);
      ctx.lineTo(-POT_R * 0.45 + ki * POT_R * 0.4, 40 * L.s);
      ctx.stroke();
    }
    // 盆土
    ctx.fillStyle = '#33261a';
    ctx.beginPath();
    ctx.ellipse(0, -12 * L.s, POT_R * 0.76, 9 * L.s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 多肉莲座（两层叶：叶根扎在盆口土面，叶尖向上向外展开；偏斜随 even 回正）
    for (var layer = 0; layer < 2; layer++) {
      var lr = layer === 0 ? 1 : 0.62;
      var ln = layer === 0 ? 10 : 7;
      for (var i = 0; i < ln; i++) {
        var la = leaves[i % 10].a + potAng + (layer === 1 ? 0.31 : 0);
        var side = Math.cos(la);
        var lean = leaves[i % 10].lean * (side > 0 ? 1 : -0.4) * (1 - even);
        var baseY = -13 * L.s - layer * 5 * L.s;
        var r0 = POT_R * lr * 0.06;
        var r1 = POT_R * lr * (0.62 + Math.max(0, side) * lean * 0.14);
        var rise = (40 + Math.max(0, side) * lean * 16) * L.s * lr;
        var rx0 = Math.cos(la) * r0, ry0 = baseY;
        var rx1 = Math.cos(la) * r1, ry1 = baseY - rise;
        var leafG = ctx.createLinearGradient(rx0, ry0, rx1, ry1);
        leafG.addColorStop(0, '#5e8a52');
        leafG.addColorStop(1, mix([122, 168, 96], [178, 108, 88], Math.max(0, side) * lean * 0.7));
        ctx.fillStyle = leafG;
        ctx.beginPath();
        ctx.moveTo(rx0 - Math.sin(la) * 6 * L.s, ry0 + Math.cos(la) * 3 * L.s);
        ctx.quadraticCurveTo((rx0 + rx1) / 2 - Math.sin(la) * 3 * L.s, (ry0 + ry1) / 2, rx1, ry1);
        ctx.quadraticCurveTo((rx0 + rx1) / 2 + Math.sin(la) * 3 * L.s, (ry0 + ry1) / 2 + 6 * L.s, rx0 + Math.sin(la) * 6 * L.s, ry0 + Math.cos(la) * 3 * L.s);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(190,90,70,' + (0.28 + Math.max(0, side) * lean * 0.35 * (1 - even)).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(rx1, ry1, 2.6 * L.s, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // 中心芽
    ctx.fillStyle = '#8cb46a';
    ctx.beginPath();
    ctx.arc(0, -16 * L.s, 7 * L.s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 进度提示
    if (!doneFired) {
      var pct = Math.min(100, Math.round(covered / (Math.PI * 2) * 100));
      ctx.fillStyle = 'rgba(163,150,126,0.85)';
      ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.textAlign = 'right';
      ctx.fillText('转了 ' + pct + '%', w - 20, h - 44);
      ctx.textAlign = 'left';
      if (pct < 5) {
        ctx.fillStyle = 'rgba(214,201,172,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
        ctx.font = '13px system-ui, "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('按住花盆，转一圈', w / 2, L.cy + 110 * L.s);
        ctx.textAlign = 'left';
      }
    }
  }

  function mix(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // 成就（提取共用，QA 与真实路径共走）
  function announceDone() {
    if (doneFired) return;
    doneFired = true;
    evenT = 0.001;
    setTimeout(function () {
      say('转均匀了。这一周，它哪面都能晒到太阳。', true);
    }, 900);
  }

  // QA 钩子（无私人信息；与真实状态机共用）
  window.__succulent = {
    turned: function () { return +Math.min(100, Math.round(covered / (Math.PI * 2) * 100)); },
    even: function () { return +even.toFixed(2); },
    done: function () { return doneFired; },
    turn: function (deg) {
      covered += (deg || 120) * Math.PI / 180;
      potAng += (deg || 120) * Math.PI / 180;
      if (covered >= Math.PI * 2) announceDone();
    }
  };
})();
</script>
</body>
</html>
