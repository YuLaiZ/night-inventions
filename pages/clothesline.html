<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晾衣绳</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .stage {
    position: relative;
    margin-top: clamp(18px, 4vw, 26px);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
  }
  .stage canvas { display: block; width: 100%; }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>晾衣绳</h1>
  <p class="sub">六楼的阳台，五件昨天的衣服。<em>风来一阵，它们就一起晃一下。</em></p>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
  </div>

  <p class="hint">点一下，来一阵风。衬衫会记住风的方向，毛巾只会跟着乱抖——每件衣服都有自己的脾气。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var W = 0, H = 0;

  /* 五件衣服：衬衫(摆幅大、回弹慢)、毛巾(小而乱)、袜子(轻、跟风) */
  var CLOTHES = [
    { kind: 'shirt', col: '#7f9ec4', w: 56, h: 74 },
    { kind: 'towel', col: '#c9a86a', w: 40, h: 46 },
    { kind: 'sock',  col: '#a8c4a0', w: 18, h: 38 },
    { kind: 'shirt', col: '#c48f9e', w: 52, h: 68 },
    { kind: 'towel', col: '#8fb4b8', w: 44, h: 50 }
  ];
  var items = [];          /* 每件：{x, sway(当前摆角速度), angle} */
  var gust = 0;            /* 阵风强度（点击后衰减） */
  var gustDir = 1;
  var lastFrame = Date.now();

  function resize() {
    var w = stage.clientWidth;
    var h = Math.round(Math.min(400, Math.max(300, w * 0.70)));
    cv.width = w;
    cv.height = h;
    cv.style.height = h + 'px';
    W = w; H = h;
  }

  function ropeY(x) {
    /* 绳子微垂：两端 H*0.22，中间垂到 0.30 */
    var t = x / W;
    return H * 0.22 + Math.sin(Math.PI * t) * H * 0.07;
  }

  function init() {
    items = [];
    var span = W * 0.78;
    for (var i = 0; i < CLOTHES.length; i++) {
      items.push({
        x: W * 0.11 + span * i / (CLOTHES.length - 1),
        angle: 0, vel: 0, phase: Math.random() * 6.28
      });
    }
  }

  function step(dt, now) {
    gust *= (1 - 0.9 * dt);
    var windBase = Math.sin(now / 900) * 0.35 + Math.sin(now / 2300) * 0.25;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var c = CLOTHES[i];
      /* 各脾气：衬衫大摆慢回、毛巾小乱、袜子跟风 */
      var gain = c.kind === 'shirt' ? 2.4 : c.kind === 'towel' ? 1.2 : 2.0;
      var damping = c.kind === 'shirt' ? 0.7 : 1.6;
      var target = windBase * gain * gustDir + gust * gustDir * gain * 0.5 +
        Math.sin(now / 300 + it.phase) * (c.kind === 'towel' ? 0.5 : 0.25);
      /* 摆角弹簧趋向目标 */
      it.vel += (target - it.angle) * (4.2 * (gain / 2)) * dt;
      it.vel *= (1 - damping * dt);
      it.angle += it.vel * dt * 30;
      it.angle = Math.max(-0.7, Math.min(0.7, it.angle));
    }
  }

  function draw(now) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#141d2e');
    g.addColorStop(1, '#1d2836');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 远处楼宇轮廓一排 */
    ctx.fillStyle = 'rgba(13, 19, 31, 0.9)';
    drawSkyline();

    /* 绳子 */
    ctx.strokeStyle = 'rgba(200, 210, 226, 0.4)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (var x = 0; x <= W; x += 12) {
      if (x === 0) ctx.moveTo(x, ropeY(x));
      else ctx.lineTo(x, ropeY(x));
    }
    ctx.stroke();

    /* 衣服：顶边两角固定在绳上，整体绕挂点旋转 */
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var c = CLOTHES[i];
      var px = it.x, py = ropeY(it.x) + 2;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(it.angle);
      ctx.fillStyle = c.col;
      var w = c.w, h = c.h;
      if (c.kind === 'shirt') {
        /* 衬衫：肩+袖 */
        ctx.beginPath();
        ctx.moveTo(-w / 2, 0);
        ctx.lineTo(-w / 2 - w * 0.18, h * 0.16);
        ctx.lineTo(-w * 0.28, h * 0.24);
        ctx.lineTo(-w * 0.30, h);
        ctx.lineTo(w * 0.30, h);
        ctx.lineTo(w * 0.28, h * 0.24);
        ctx.lineTo(w / 2 + w * 0.18, h * 0.16);
        ctx.lineTo(w / 2, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(10, 14, 24, 0.18)';
        ctx.fillRect(-w * 0.05, 2, w * 0.10, h * 0.22);
      } else if (c.kind === 'towel') {
        ctx.fillRect(-w / 2, 0, w, h);
        ctx.fillStyle = 'rgba(10, 14, 24, 0.15)';
        ctx.fillRect(-w / 2, h * 0.7, w, h * 0.3);
      } else {
        ctx.fillRect(-w / 2, 0, w, h);
      }
      /* 夹子 */
      ctx.fillStyle = '#d8cfae';
      ctx.fillRect(-w * 0.30, -3, 5, 7);
      ctx.fillRect(w * 0.30 - 5, -3, 5, 7);
      ctx.restore();
    }

    /* 阵风提示线 */
    if (gust > 0.08) {
      ctx.strokeStyle = 'rgba(156, 200, 255, ' + 0.10 * gust + ')';
      ctx.lineWidth = 1.5;
      for (var l = 0; l < 3; l++) {
        var ly = H * (0.28 + l * 0.16);
        var shift = (now / 6) % (W + 80);
        ctx.beginPath();
        ctx.moveTo(-40 + shift, ly);
        ctx.quadraticCurveTo(-40 + shift + 30, ly - 4, -40 + shift + 60, ly);
        ctx.stroke();
      }
    }
  }

  var skyline = [];
  function drawSkyline() {
    if (skyline.length === 0) {
      var x = -4;
      while (x < W + 4) {
        skyline.push({ x: x, w: 26 + Math.random() * 42, h: 20 + Math.random() * H * 0.10 });
        x += 30 + Math.random() * 40;
      }
    }
    for (var i = 0; i < skyline.length; i++) {
      var b = skyline[i];
      ctx.fillRect(b.x, H * 0.32 - b.h, b.w, b.h + 4);
    }
  }

  function loop() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    step(dt, now);
    draw(now);
    setTimeout(loop, 60);
  }

  stage.addEventListener('pointerdown', function () {
    gust = 1;
    gustDir = -gustDir;
  });

  window.addEventListener('resize', function () {
    W = stage.clientWidth;
    cv.width = W;
    init();
  });
  resize();
  init();
  loop();
})();
</script>
</body>
</html>
