<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抱柴火</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #110d09;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #a3967e;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #d6c9ac; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #857962; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #d6c9ac;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #554b3b;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #857962;
    text-decoration: none;
    border-bottom: 1px dotted #857962;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #d6c9ac; border-color: #d6c9ac; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>抱柴火</h1>
  <p>炉子今晚要吃三顿，柴得先备足。<br>从垛上抽三捆放进筐——炉子饿不着，屋就冷不着。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var seed = 20260919;
  function mulberry(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry(seed);

  function say(text, holdLong) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!holdLong) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5600);
  }

  var L = {};
  function layout() {
    L.w = window.innerWidth;
    L.h = window.innerHeight;
    L.s = Math.max(0.6, Math.min(1.05, Math.min(L.w / 680, L.h / 720)));
    L.cx = L.w / 2;
  }
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  window.addEventListener('resize', function () {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  });

  // ── 状态 ──
  var bundles = 0;          // 已进筐
  var NEED = 3;
  var stackLeft = 6;        // 垛上剩的捆数
  var doneFired = false;
  var saidFirst = false;
  var flyT = 1;
  var shakeStack = 0;

  var STACK;                // 柴垛位置
  var BASKET;               // 柴筐位置
  function calcPos() {
    STACK = { x: L.w * 0.74, y: L.h * 0.7 };
    BASKET = { x: L.w * 0.24, y: L.h * 0.68 };
  }
  calcPos();

  // 金字塔码放（顶层先被抽走）
  var STACK_LAYOUT = [
    { dx: 0, dy: -50 }, { dx: -29, dy: -18 }, { dx: 29, dy: -18 },
    { dx: -58, dy: 14 }, { dx: 0, dy: 14 }, { dx: 58, dy: 14 }
  ];

  function hitStack(px, py) {
    return Math.abs(px - STACK.x) < 130 * L.s && Math.abs(py - STACK.y) < 90 * L.s;
  }

  canvas.addEventListener('pointerdown', function (ev) {
    ensureAudio();
    if (doneFired) return;
    if (hitStack(ev.clientX, ev.clientY) && stackLeft > 0) {
      stackLeft--;
      bundles++;
      flyT = 0.001;
      shakeStack = 1;
      woodKnock();
      if (!saidFirst) { saidFirst = true; say('一捆三根，够炉子吃一阵。'); }
      else if (bundles === 2) say('两捆了。第三捆抽最粗的。');
      if (bundles >= NEED) {
        setTimeout(function () {
          doneFired = true;
          say('够烧一整夜了。炉子饿不着，屋就冷不着。', true);
        }, 500);
      }
    }
  });

  // ── 声音 ──
  var AC = null;
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  function woodKnock() {
    if (!AC || AC.state !== 'running') return;
    var t = AC.currentTime;
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(90, t + 0.1);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + 0.13);
  }

  // 一捆柴（三根木段+绳）
  function drawBundle(x, y, scale, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.scale(scale, scale);
    for (var i = -1; i <= 1; i++) {
      var logG = ctx.createLinearGradient(0, i * 16 * L.s - 8 * L.s, 0, i * 16 * L.s + 8 * L.s);
      logG.addColorStop(0, '#9a6c40');
      logG.addColorStop(0.5, '#b8874e');
      logG.addColorStop(1, '#7a5230');
      ctx.fillStyle = logG;
      ctx.beginPath();
      ctx.roundRect(-42 * L.s, i * 16 * L.s - 7 * L.s, 84 * L.s, 14 * L.s, 6 * L.s);
      ctx.fill();
      // 年轮端面（右端）
      ctx.fillStyle = '#c89a5e';
      ctx.beginPath();
      ctx.arc(42 * L.s, i * 16 * L.s, 6.4 * L.s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,80,40,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(42 * L.s, i * 16 * L.s, 3.4 * L.s, 0, Math.PI * 2);
      ctx.stroke();
    }
    // 绳
    ctx.strokeStyle = '#c8b088';
    ctx.lineWidth = 2.6 * L.s;
    ctx.beginPath();
    ctx.moveTo(-14 * L.s, -26 * L.s);
    ctx.lineTo(-14 * L.s, 26 * L.s);
    ctx.stroke();
    ctx.restore();
  }

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.08, (now - last) / 1000);
    last = now;
    var w = L.w, h = L.h;
    calcPos();
    shakeStack = Math.max(0, shakeStack - dt * 2.4);
    if (flyT > 0 && flyT < 1) flyT = Math.min(1, flyT + dt * 1.3);

    // ── 绘制 ──
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#151009');
    bg.addColorStop(1, '#0b0805');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    // 月色微光
    var moon = ctx.createLinearGradient(w * 0.8, 0, w * 0.3, h);
    moon.addColorStop(0, 'rgba(220,210,180,0.07)');
    moon.addColorStop(1, 'rgba(220,210,180,0)');
    ctx.fillStyle = moon;
    ctx.fillRect(0, 0, w, h);
    // 地面
    ctx.fillStyle = '#1a140c';
    ctx.fillRect(0, h * 0.72, w, h);
    ctx.fillStyle = 'rgba(220,210,180,0.05)';
    ctx.fillRect(0, h * 0.72, w, 2);

    // 柴垛（右，金字塔码放，随抽走从顶层渐矮）
    ctx.save();
    ctx.translate(STACK.x + Math.sin(now / 40) * shakeStack * 3, STACK.y);
    for (var li = 0; li < stackLeft; li++) {
      var lp = STACK_LAYOUT[li];
      var bx2 = lp.dx * L.s;
      var by2 = lp.dy * L.s;
      // 木段横放（截面朝观者）
      var logG = ctx.createRadialGradient(bx2 - 4 * L.s, by2 - 4 * L.s, 1, bx2, by2, 17 * L.s);
      logG.addColorStop(0, '#c89a5e');
      logG.addColorStop(0.8, '#9a6c40');
      logG.addColorStop(1, '#7a5230');
      ctx.fillStyle = logG;
      ctx.beginPath();
      ctx.arc(bx2, by2, 16 * L.s, 0, Math.PI * 2);
      ctx.fill();
      // 年轮
      ctx.strokeStyle = 'rgba(120,80,40,0.55)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(bx2, by2, 10 * L.s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(bx2 + 2 * L.s, by2 - 1 * L.s, 5 * L.s, 0, Math.PI * 2);
      ctx.stroke();
      // 裂纹
      ctx.beginPath();
      ctx.moveTo(bx2 - 12 * L.s, by2 + 4 * L.s);
      ctx.lineTo(bx2 - 3 * L.s, by2 + 1 * L.s);
      ctx.stroke();
    }
    ctx.restore();

    // 柴筐（左，编纹）
    ctx.save();
    ctx.translate(BASKET.x, BASKET.y);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(6, 34 * L.s, 78 * L.s, 12 * L.s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 筐身
    var bkG = ctx.createLinearGradient(-80 * L.s, 0, 80 * L.s, 0);
    bkG.addColorStop(0, '#8a6a3c');
    bkG.addColorStop(0.5, '#a8844e');
    bkG.addColorStop(1, '#7a5c34');
    ctx.fillStyle = bkG;
    ctx.beginPath();
    ctx.moveTo(-80 * L.s, -30 * L.s);
    ctx.quadraticCurveTo(-70 * L.s, 30 * L.s, -52 * L.s, 34 * L.s);
    ctx.lineTo(52 * L.s, 34 * L.s);
    ctx.quadraticCurveTo(70 * L.s, 30 * L.s, 80 * L.s, -30 * L.s);
    ctx.closePath();
    ctx.fill();
    // 编纹
    ctx.strokeStyle = 'rgba(60,44,20,0.45)';
    ctx.lineWidth = 2;
    for (var wi = -2; wi <= 2; wi++) {
      ctx.beginPath();
      ctx.moveTo(-80 * L.s + wi * 6 * L.s, -30 * L.s);
      ctx.quadraticCurveTo(-60 * L.s + wi * 8 * L.s, 10 * L.s, -52 * L.s + wi * 5 * L.s, 32 * L.s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(80 * L.s - wi * 6 * L.s, -30 * L.s);
      ctx.quadraticCurveTo(60 * L.s - wi * 8 * L.s, 10 * L.s, 52 * L.s - wi * 5 * L.s, 32 * L.s);
      ctx.stroke();
    }
    for (var hj = 0; hj < 3; hj++) {
      ctx.beginPath();
      ctx.moveTo(-70 * L.s + hj * 4 * L.s, -6 * L.s + hj * 16 * L.s);
      ctx.lineTo(70 * L.s - hj * 4 * L.s, -6 * L.s + hj * 16 * L.s);
      ctx.stroke();
    }
    // 筐里的柴（已放的捆）
    for (var bi = 0; bi < bundles; bi++) {
      drawBundle(-30 * L.s + bi * 32 * L.s, -34 * L.s - bi * 4 * L.s, 0.78, (bi % 2 === 0 ? -0.06 : 0.08));
    }
    ctx.restore();

    // 飞行中的一捆
    if (flyT > 0 && flyT < 1) {
      var fx2 = STACK.x + (BASKET.x - STACK.x) * flyT;
      var fy2 = STACK.y + (BASKET.y - 34 * L.s - STACK.y) * flyT - Math.sin(flyT * Math.PI) * 120 * L.s;
      drawBundle(fx2, fy2, 0.85, flyT * 0.6 - 0.3);
    }

    // 引导与计数
    if (!doneFired) {
      var hint = bundles === 0 ? '点柴垛，抽一捆' : (bundles < NEED ? '再来一捆' : '');
      if (hint) {
        ctx.fillStyle = 'rgba(214,201,172,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
        ctx.font = '13px system-ui, "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(hint, w / 2, h - 96);
        ctx.textAlign = 'left';
      }
      ctx.fillStyle = 'rgba(163,150,126,0.85)';
      ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.textAlign = 'right';
      ctx.fillText('进筐 ' + bundles + ' / ' + NEED + ' 捆', w - 20, h - 44);
      ctx.textAlign = 'left';
    }
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // 成就（提取共用，QA 与真实路径共走）
  function announceDone() {
    if (doneFired) return;
    doneFired = true;
    setTimeout(function () {
      say('够烧一整夜了。炉子饿不着，屋就冷不着。', true);
    }, 500);
  }

  // QA 钩子（无私人信息；与真实状态机共用）
  window.__firewood = {
    bundles: function () { return bundles; },
    done: function () { return doneFired; },
    carry: function () {
      if (bundles < NEED) {
        bundles++;
        stackLeft--;
        if (bundles >= NEED) announceDone();
      }
    }
  };
})();
</script>
</body>
</html>
