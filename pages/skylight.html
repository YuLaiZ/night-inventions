<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天窗</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
    text-align: center;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; }
  .sub em { font-style: normal; color: var(--gold); }

  .frame {
    margin-top: clamp(20px, 4vw, 26px);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    background: #04060c;
  }
  canvas { display: block; width: 100%; }

  .now {
    margin-top: 14px;
    font-size: 14px;
    color: var(--ink-dim);
    letter-spacing: 0.1em;
  }
  .now .num { font-family: var(--mono); color: var(--ice); }

  .skyline {
    margin-top: 12px;
    color: var(--ink);
    font-size: clamp(15px, 4vw, 17px);
    min-height: 1.7em;
  }

  .hint {
    margin-top: clamp(20px, 4vw, 26px);
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(36px, 7vw, 52px); }
  .sig { margin-top: 12px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>天窗</h1>
  <p class="sub">给没有窗的房间一扇<em>一平米的天</em>：天色按此刻钟点长，星星和云都守时。</p>

  <div class="frame">
    <canvas id="cv"></canvas>
  </div>
  <p class="now">现在 <span class="num" id="nowtime">--:--</span> · <span id="phase">——</span></p>
  <p class="skyline" id="skyline"></p>

  <p class="hint">天上偶尔会有飞机划过——别追，它不载人，只载一句话。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  // 测试钩子：#t=HH,MM 模拟指定时刻
  function nowH() {
    var m = window.location.hash.match(/^#t=(\d{1,2}),(\d{1,2})$/);
    if (m) return (+m[1]) + (+m[2]) / 60;
    var now = new Date();
    return now.getHours() + now.getMinutes() / 60;
  }
  function nowHM() {
    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return pad(now.getHours()) + ':' + pad(now.getMinutes());
  }

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var stars = [];
  var clouds = [];
  var plane = null;   // {x, y, v}

  function size() {
    var w = document.querySelector('.frame').clientWidth;
    var h = Math.round(w * 0.62);
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seedStatic();
  }

  function seedStatic() {
    var w = cv.clientWidth, h = cv.clientHeight;
    stars = [];
    for (var i = 0; i < 70; i++) {
      stars.push({ x: Math.random() * w, y: Math.random() * h * 0.75, r: 0.6 + Math.random() * 1.1, tw: Math.random() * Math.PI * 2 });
    }
    clouds = [];
    for (var c = 0; c < 4; c++) {
      clouds.push({ x: Math.random() * w, y: h * (0.15 + Math.random() * 0.5), s: 30 + Math.random() * 40, v: 0.1 + Math.random() * 0.15 });
    }
  }

  // 按时刻返回天色上下两色（插值关键帧）
  function skyColors(hour) {
    var KEYS = [
      { h: 0,  top: '#05070f', bot: '#0c1220' },
      { h: 5,  top: '#0a1024', bot: '#1c2440' },
      { h: 6.5, top: '#26405e', bot: '#7a6a8a' },
      { h: 8,  top: '#4a7cae', bot: '#9db8d4' },
      { h: 12, top: '#3f74ac', bot: '#a8c4de' },
      { h: 17, top: '#3a5f96', bot: '#c78a6a' },
      { h: 19, top: '#1a2748', bot: '#5a4a6e' },
      { h: 21, top: '#0a1024', bot: '#141c30' },
      { h: 24, top: '#05070f', bot: '#0c1220' }
    ];
    for (var i = 0; i < KEYS.length - 1; i++) {
      if (hour >= KEYS[i].h && hour <= KEYS[i + 1].h) {
        var t = (hour - KEYS[i].h) / (KEYS[i + 1].h - KEYS[i].h);
        return {
          top: lerpColor(KEYS[i].top, KEYS[i + 1].top, t),
          bot: lerpColor(KEYS[i].bot, KEYS[i + 1].bot, t),
          night: hour >= 20 || hour < 5.5
        };
      }
    }
    return { top: '#05070f', bot: '#0c1220', night: true };
  }

  function lerpColor(a, b, t) {
    var pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); });
    var pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
    var pc = pa.map(function (v, i) { return Math.round(v + (pb[i] - v) * t); });
    return 'rgb(' + pc.join(',') + ')';
  }

  function phaseText(hour) {
    if (hour < 5) return '深夜档 · 天最诚实的时候';
    if (hour < 7) return '黎明档 · 天正在换班';
    if (hour < 11) return '上午档 · 云也刚上班';
    if (hour < 14) return '正午档 · 天最亮的一段';
    if (hour < 17) return '午后档 · 云开始犯懒';
    if (hour < 19) return '黄昏档 · 天空在调色';
    if (hour < 21) return '入夜档 · 星星交接班';
    return '深夜档 · 天最诚实的时候';
  }

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(120, now - last);
    last = now;
    var hour = nowH();
    var c = skyColors(hour);
    var w = cv.clientWidth, h = cv.clientHeight;

    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, c.top);
    grad.addColorStop(1, c.bot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // 星（夜里可见，白天隐去）
    var starA = c.night ? 0.9 : Math.max(0, 0.35 - (hour - 5.5) * 0.2);
    if (starA > 0.02) {
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        s.tw += 0.03 * dt / 16;
        var tw = 0.6 + 0.4 * Math.sin(s.tw);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(220, 228, 244, ' + (starA * tw) + ')';
        ctx.fill();
      }
    }

    // 云
    ctx.fillStyle = 'rgba(235, 240, 248, ' + (c.night ? 0.07 : 0.75) + ')';
    for (var k = 0; k < clouds.length; k++) {
      var cl = clouds[k];
      cl.x += cl.v * dt / 16;
      if (cl.x > w + cl.s * 2) cl.x = -cl.s * 2;
      ctx.beginPath();
      ctx.arc(cl.x, cl.y, cl.s * 0.55, 0, Math.PI * 2);
      ctx.arc(cl.x + cl.s * 0.5, cl.y + cl.s * 0.1, cl.s * 0.4, 0, Math.PI * 2);
      ctx.arc(cl.x - cl.s * 0.5, cl.y + cl.s * 0.12, cl.s * 0.38, 0, Math.PI * 2);
      ctx.fill();
    }

    // 飞机彩蛋：极低概率生成一架（划过 + 一句话尾迹）
    if (!plane && Math.random() < 0.0025) {
      plane = { x: -40, y: h * (0.1 + Math.random() * 0.25), v: 1.4 + Math.random() * 0.6 };
    }
    if (plane) {
      plane.x += plane.v * dt / 16;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(plane.x - 26, plane.y);
      ctx.lineTo(plane.x, plane.y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(plane.x, plane.y, 1.6, 0, Math.PI * 2);
      ctx.fill();
      if (plane.x > w + 30) plane = null;
    }

    // 窗框
    ctx.strokeStyle = 'rgba(199, 208, 226, 0.3)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, w - 2, h - 2);

    requestAnimationFrame(tick);
  }

  var SENT = {
    deep: '天很深，星星很密——这是全天最值得抬头的一段。',
    dawn: '天正在亮。第一班云已经出发了。',
    day: '白天版的天空也值得看一眼：云走得很慢，很认真。',
    dusk: '天边在调色。这个档口的天空，每一分钟都不一样。'
  };

  function updateText() {
    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    document.getElementById('nowtime').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    var hour = nowH();
    document.getElementById('phase').textContent = phaseText(hour);
    var el = document.getElementById('skyline');
    var t;
    if (hour < 5) t = SENT.deep;
    else if (hour < 8) t = SENT.dawn;
    else if (hour < 17) t = SENT.day;
    else t = SENT.dusk;
    el.textContent = t;
  }

  window.addEventListener('resize', function () { size(); });

  size();
  tick();
  updateText();
  setInterval(updateText, 10000);
})();
</script>
</body>
</html>
