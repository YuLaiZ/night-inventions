<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萤火虫</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .valley {
    position: relative;
    margin-top: clamp(18px, 4vw, 26px);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .valley canvas { display: block; width: 100%; }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>萤火虫</h1>
  <p class="sub">深夜的草丛里住着一点一点的光。<em>别急着凑近——你的目光太亮，它们会害羞。</em></p>

  <div class="valley" id="valley">
    <canvas id="cv"></canvas>
  </div>

  <p class="hint">把鼠标（或手指）放远一点，过几秒它们会慢慢围过来。每一只闪的节奏都不一样。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var valley = document.getElementById('valley');
  var W = 0, H = 0, DPR = 1;

  var flies = [];
  var grass = [];
  var mouse = { x: -9999, y: -9999, lastMove: 0 };
  var lastFrame = Date.now();

  function resize() {
    var w = valley.clientWidth;
    var h = Math.round(Math.min(430, Math.max(320, w * 0.76)));
    DPR = window.devicePixelRatio || 1;
    cv.width = w * DPR;
    cv.height = h * DPR;
    cv.style.height = h + 'px';
    W = w; H = h;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    plantGrass();
    if (flies.length === 0) hatch();
  }

  function hatch() {
    flies = [];
    for (var i = 0; i < 16; i++) {
      flies.push({
        x: Math.random() * W,
        y: H * 0.3 + Math.random() * H * 0.55,
        vx: (Math.random() - 0.5) * 14,
        vy: (Math.random() - 0.5) * 10,
        phase: Math.random() * Math.PI * 2,
        period: 2.2 + Math.random() * 2.8,   /* 各自的呼吸节奏 */
        glowBase: 0.5 + Math.random() * 0.5,
        wander: Math.random() * Math.PI * 2
      });
    }
  }

  function plantGrass() {
    grass = [];
    var x = -6;
    while (x < W + 6) {
      grass.push({
        x: x,
        h: 14 + Math.random() * 42,
        lean: (Math.random() - 0.5) * 16,
        w: 1 + Math.random() * 1.6,
        a: 0.5 + Math.random() * 0.5
      });
      x += 5 + Math.random() * 9;
    }
  }

  function step(dt, now) {
    var shy = Math.max(0, 1 - (now - mouse.lastMove) / 4000);   /* 目光静止 4 秒后害羞消退 */
    for (var i = 0; i < flies.length; i++) {
      var f = flies[i];
      /* 随机游走 */
      f.wander += (Math.random() - 0.5) * 2.4 * dt;
      f.vx += Math.cos(f.wander) * 9 * dt;
      f.vy += Math.sin(f.wander) * 7 * dt;
      /* 边界轻回拉 */
      if (f.x < 20) f.vx += (20 - f.x) * 0.9 * dt;
      if (f.x > W - 20) f.vx -= (f.x - (W - 20)) * 0.9 * dt;
      if (f.y < H * 0.16) f.vy += (H * 0.16 - f.y) * 0.9 * dt;
      if (f.y > H - 26) f.vy -= (f.y - (H - 26)) * 0.9 * dt;
      /* 目光斥力：靠近就躲 */
      if (shy > 0) {
        var dx = f.x - mouse.x, dy = f.y - mouse.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 130 * 130 && d2 > 1) {
          var d = Math.sqrt(d2);
          var push = (1 - d / 130) * 60 * shy;
          f.vx += dx / d * push * dt;
          f.vy += dy / d * push * dt;
        }
      } else {
        /* 光息后轻微聚拢：向鼠标附近缓慢靠 */
        var dx2 = W * 0.5 - f.x, dy2 = H * 0.55 - f.y;
        f.vx += dx2 * 0.006 * dt;
        f.vy += dy2 * 0.006 * dt;
      }
      /* 阻尼限速 */
      f.vx *= (1 - 0.6 * dt);
      f.vy *= (1 - 0.6 * dt);
      var sp = Math.hypot(f.vx, f.vy);
      if (sp > 46) { f.vx *= 46 / sp; f.vy *= 46 / sp; }
      f.x += f.vx * dt;
      f.y += f.vy * dt;
    }
  }

  function glow(now) {
    /* 亮度：各自周期的正弦呼吸，只亮一小半时间 */
    var g = 0;
    for (var i = 0; i < flies.length; i++) {
      var f = flies[i];
      var s = Math.sin((now / 1000) * (Math.PI * 2 / f.period) + f.phase);
      var b = Math.max(0, s - 0.25) / 0.75;    /* 暗多亮少 */
      g = b;
      if (g > 0.02) {
        var r = 3 + g * 5;
        var grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r * 3.2);
        grad.addColorStop(0, 'rgba(212, 255, 150,' + (0.85 * g * f.glowBase) + ')');
        grad.addColorStop(0.35, 'rgba(190, 245, 120,' + (0.30 * g * f.glowBase) + ')');
        grad.addColorStop(1, 'rgba(190, 245, 120, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(f.x, f.y, r * 3.2, 0, 6.29);
        ctx.fill();
        ctx.fillStyle = 'rgba(240, 255, 200,' + Math.min(1, g * 1.2) + ')';
        ctx.beginPath();
        ctx.arc(f.x, f.y, 1.4, 0, 6.29);
        ctx.fill();
      }
    }
  }

  function draw(now) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070d12');
    g.addColorStop(0.55, '#0b1418');
    g.addColorStop(1, '#0d1a14');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 远山一抹 */
    ctx.fillStyle = 'rgba(13, 26, 22, 0.85)';
    ctx.beginPath();
    ctx.moveTo(-10, H * 0.52);
    ctx.quadraticCurveTo(W * 0.25, H * 0.40, W * 0.5, H * 0.50);
    ctx.quadraticCurveTo(W * 0.75, H * 0.58, W + 10, H * 0.46);
    ctx.lineTo(W + 10, H + 10);
    ctx.lineTo(-10, H + 10);
    ctx.closePath();
    ctx.fill();

    /* 草丛（底部两层） */
    for (var i = 0; i < grass.length; i++) {
      var gr = grass[i];
      ctx.strokeStyle = 'rgba(24, 58, 40,' + (0.35 * gr.a) + ')';
      ctx.lineWidth = gr.w;
      ctx.beginPath();
      ctx.moveTo(gr.x, H);
      ctx.quadraticCurveTo(gr.x + gr.lean * 0.4, H - gr.h * 0.6, gr.x + gr.lean, H - gr.h);
      ctx.stroke();
    }

    glow(now);
  }

  function frame() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    step(dt, now);
    draw(now);
    requestAnimationFrame(frame);
  }
  /* 后台 rAF 停摆兜底：主循环失联时按墙钟补步 */
  setInterval(function () {
    var now = Date.now();
    if (now - lastFrame > 400) {
      step(Math.min(1, (now - lastFrame) / 1000), now);
      lastFrame = now;
      draw(now);
    }
  }, 600);

  function track(x, y) {
    var rect = valley.getBoundingClientRect();
    mouse.x = x - rect.left;
    mouse.y = y - rect.top;
    mouse.lastMove = Date.now();
  }
  valley.addEventListener('pointermove', function (ev) { track(ev.clientX, ev.clientY); });
  valley.addEventListener('pointerdown', function (ev) { track(ev.clientX, ev.clientY); });
  valley.addEventListener('pointerleave', function () { mouse.x = -9999; mouse.y = -9999; });

  window.addEventListener('resize', function () { resize(); });
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
