<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晒书</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d1218;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #4a4a44;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #b0a488; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #6e6858; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #b0a488;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #565a54;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #6e6858;
    text-decoration: none;
    border-bottom: 1px dotted #6e6858;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #b0a488; border-color: #b0a488; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>晒书</h1>
  <p>回南天过了，书受了潮。<br>按住让太阳走一遍——字都松快了。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var hold = false;
  var sun = 0;           // 晒晒进度（光斑从左到右）
  var pages = 0;         // 翻过的页扇
  var TOTAL_PAGES = 6;
  var resting = false;
  var saidStart = false;
  var flipped = [];      // 翻页动画 {t}
  var motes = [];        // 光里浮尘

  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function say(text, holdLong) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!holdLong) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5600);
  }

  var L = {};
  function layout() {
    L.w = window.innerWidth;
    L.h = window.innerHeight;
    L.cx = L.w * 0.5;
    L.cy = L.h * 0.58;
    L.R = Math.min(L.w * 0.26, L.h * 0.22, 160);
    L.bookW = L.R * 1.9;
    L.bookH = L.R * 1.3;
  }
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  window.addEventListener('resize', function () {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  });

  function startPress() {
    if (resting) {
      resting = false;
      pages = 0; sun = 0;
      flipped = [];
      saidStart = false;
      say('再来一轮。旧书经晒。');
      return;
    }
    if (hold) return;
    hold = true;
    if (!saidStart) { saidStart = true; say('光在页上走，慢慢晒。'); }
  }
  function endPress() { hold = false; }

  canvas.addEventListener('pointerdown', function () { startPress(); });
  window.addEventListener('pointerup', function () { endPress(); });
  window.addEventListener('pointercancel', function () { endPress(); });

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var w = window.innerWidth, h = window.innerHeight;

    // ── 状态推进 ──
    if (hold && !resting) {
      sun = Math.min(1, sun + dt * 0.085);
      var shouldPages = Math.floor(sun * TOTAL_PAGES);
      while (pages < shouldPages) {
        pages++;
        flipped.push({ t: 0 });
      }
      if (motes.length < 16 && Math.random() < dt * 6) {
        motes.push({
          x: L.cx - L.bookW / 2 + Math.random() * L.bookW,
          y: L.cy - L.bookH / 2 - 10 + Math.random() * 20,
          v: 6 + Math.random() * 8,
          drift: (Math.random() - 0.5) * 6,
          life: 1, r: 1 + Math.random() * 1.6
        });
      }
      if (pages >= TOTAL_PAGES) {
        resting = true;
        hold = false;
        say('晒透了。字都松快了。', true);
      }
    }
    for (var f = flipped.length - 1; f >= 0; f--) {
      flipped[f].t += dt * 1.6;
      if (flipped[f].t >= 1) flipped.splice(f, 1);
    }
    for (var m = motes.length - 1; m >= 0; m--) {
      var mo = motes[m];
      mo.x += mo.drift * dt; mo.y -= mo.v * dt; mo.life -= dt * 0.5;
      if (mo.life <= 0) motes.splice(m, 1);
    }

    // ── 背景：晨光木桌 ──
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#141a20');
    bg.addColorStop(1, '#171310');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    // 晨光斜入（固定光带）
    var beam = ctx.createLinearGradient(0, 0, w, h);
    beam.addColorStop(0, 'rgba(240,214,150,0.10)');
    beam.addColorStop(0.5, 'rgba(240,214,150,0.16)');
    beam.addColorStop(1, 'rgba(240,214,150,0.04)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(w * 0.55, 0);
    ctx.lineTo(w, h);
    ctx.lineTo(w * 0.3, h);
    ctx.closePath();
    ctx.fill();

    // ── 摊开的书 ──
    var bx = L.cx, by = L.cy;
    // 书影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(bx + 10, by + L.bookH * 0.52, L.bookW * 0.55, L.bookH * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // 封底
    ctx.fillStyle = '#4a3a28';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx - L.bookW / 2 - 6, by - L.bookH / 2 - 6, L.bookW + 12, L.bookH + 12, 6);
    else ctx.rect(bx - L.bookW / 2 - 6, by - L.bookH / 2 - 6, L.bookW + 12, L.bookH + 12);
    ctx.fill();
    // 页堆（左右各一摞，层次线）
    var halfW = L.bookW / 2;
    for (var pg = TOTAL_PAGES; pg >= 0; pg--) {
      var lifted = pg <= pages;
      var pgCol = lifted ? 'rgba(242,236,216,0.97)' : 'rgba(214,204,180,0.9)';
      ctx.fillStyle = pgCol;
      // 左页
      ctx.beginPath();
      ctx.moveTo(bx, by - L.bookH / 2 + pg * 1.2);
      ctx.quadraticCurveTo(bx - halfW * 0.6, by - L.bookH / 2 - 4 + pg * 1.2, bx - halfW, by - L.bookH / 2 + 4 + pg * 1.4);
      ctx.lineTo(bx - halfW, by + L.bookH / 2 - pg * 0.8);
      ctx.quadraticCurveTo(bx - halfW * 0.4, by + L.bookH / 2 - 2 - pg * 0.6, bx, by + L.bookH / 2 - pg * 0.5);
      ctx.closePath();
      ctx.fill();
      // 右页
      ctx.beginPath();
      ctx.moveTo(bx, by - L.bookH / 2 + pg * 1.2);
      ctx.quadraticCurveTo(bx + halfW * 0.6, by - L.bookH / 2 - 4 + pg * 1.2, bx + halfW, by - L.bookH / 2 + 4 + pg * 1.4);
      ctx.lineTo(bx + halfW, by + L.bookH / 2 - pg * 0.8);
      ctx.quadraticCurveTo(bx + halfW * 0.4, by + L.bookH / 2 - 2 - pg * 0.6, bx, by + L.bookH / 2 - pg * 0.5);
      ctx.closePath();
      ctx.fill();
      // 页缘线
      ctx.strokeStyle = 'rgba(160,148,120,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(bx - halfW, by - L.bookH / 2 + 4 + pg * 1.4);
      ctx.lineTo(bx - halfW, by + L.bookH / 2 - pg * 0.8);
      ctx.moveTo(bx + halfW, by - L.bookH / 2 + 4 + pg * 1.4);
      ctx.lineTo(bx + halfW, by + L.bookH / 2 - pg * 0.8);
      ctx.stroke();
    }
    // 书脊凹槽
    ctx.strokeStyle = 'rgba(120,104,74,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx, by - L.bookH / 2);
    ctx.lineTo(bx, by + L.bookH / 2);
    ctx.stroke();
    // 已晒页的暖色（晒过的页更暖更亮）
    var doneW = (pages / TOTAL_PAGES) * L.bookW;
    if (doneW > 0) {
      var warm = ctx.createLinearGradient(bx - halfW, 0, bx - halfW + doneW, 0);
      warm.addColorStop(0, 'rgba(246,222,150,0.14)');
      warm.addColorStop(1, 'rgba(246,222,150,0)');
      ctx.fillStyle = warm;
      ctx.fillRect(bx - halfW, by - L.bookH / 2, doneW, L.bookH);
    }
    // 晒过页上的示意文字行
    if (pages > 1) {
      ctx.strokeStyle = 'rgba(150,138,110,0.4)';
      ctx.lineWidth = 1.2;
      var lineY0 = by - L.bookH / 2 + 22;
      for (var ln = 0; ln < 5; ln++) {
        var lnY = lineY0 + ln * 16;
        ctx.beginPath();
        ctx.moveTo(bx - halfW + 24, lnY);
        ctx.lineTo(bx - 28 - (ln % 2) * 22, lnY);
        ctx.moveTo(bx + 28, lnY + 6);
        ctx.lineTo(bx + halfW - 24 - (ln % 3) * 16, lnY + 6);
        ctx.stroke();
      }
    }
    // 正在晒的光斑（随 sun 移动的亮椭圆；完成后暖光留在全页）
    var spotX = bx - halfW + sun * L.bookW;
    if (sun < 1 || resting) {
      var sw2 = resting ? L.bookW * 0.5 : L.bookH * 0.42;
      var spotG = ctx.createRadialGradient(spotX, by, 0, spotX, by, sw2 * 1.3);
      spotG.addColorStop(0, 'rgba(250,226,150,' + (resting ? 0.1 : 0.22) + ')');
      spotG.addColorStop(1, 'rgba(250,226,150,0)');
      ctx.fillStyle = spotG;
      ctx.beginPath();
      ctx.ellipse(spotX, by, sw2, L.bookH * 0.52, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // ── 翻页动画（晒过时页角翘起扇动）──
    for (var fp = 0; fp < flipped.length; fp++) {
      var fl = flipped[fp];
      var ft = fl.t;
      var lift = Math.sin(ft * Math.PI);
      var fxx = bx + halfW * (0.2 + fp * 0.12);
      ctx.strokeStyle = 'rgba(230,222,198,' + (0.8 * (1 - ft * 0.5)) + ')';
      ctx.fillStyle = 'rgba(244,238,218,' + (0.85 * (1 - ft * 0.4)) + ')';
      ctx.beginPath();
      ctx.moveTo(fxx - 26, by + 10);
      ctx.quadraticCurveTo(fxx - 10, by - 10 - lift * 34, fxx + 22, by - 4 - lift * 26);
      ctx.quadraticCurveTo(fxx + 30, by + 2, fxx + 24, by + 8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // ── 光里浮尘 ──
    for (var m2 = 0; m2 < motes.length; m2++) {
      var mo2 = motes[m2];
      ctx.fillStyle = 'rgba(250,240,210,' + (0.5 * mo2.life) + ')';
      ctx.beginPath();
      ctx.arc(mo2.x, mo2.y, mo2.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // ── 右上角等宽刻度 ──
    ctx.fillStyle = 'rgba(190,196,180,0.6)';
    ctx.font = '12px ui-monospace, "SF Mono", Menlo, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(pages + ' / ' + TOTAL_PAGES + ' 页', w - 22, 34);
    ctx.textAlign = 'left';

    // ── 引导 ──
    if (!saidStart && pages === 0 && !hold && !resting) {
      ctx.fillStyle = 'rgba(176,164,136,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
      ctx.font = '13px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('按住书，晒', L.cx, by + L.bookH / 2 + 44);
    }
    if (resting) {
      ctx.fillStyle = 'rgba(230,210,170,' + (0.34 + 0.16 * Math.sin(now / 600)) + ')';
      ctx.font = '12px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('再按一下，再晒一轮', L.cx, by + L.bookH / 2 + 44);
    }
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // QA 钩子（无私人信息；与真实事件共用 startPress/endPress）
  window.__airing = {
    pages: function () { return pages; },
    sun: function () { return +sun.toFixed(2); },
    resting: function () { return resting; },
    press: function () { startPress(); },
    release: function () { endPress(); }
  };
})();
</script>
</body>
</html>
