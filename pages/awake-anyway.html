<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反正睡不着</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .clock {
    margin-top: clamp(20px, 5vw, 28px);
    text-align: center;
  }
  .clock .value {
    color: var(--gold);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(34px, 10vw, 46px);
    letter-spacing: 0.04em;
  }
  .clock .label { color: var(--ink-dim); font-size: 13.5px; margin-top: 2px; }

  .report {
    margin-top: clamp(18px, 4vw, 26px);
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(16, 24, 40, 0.6);
    padding: clamp(18px, 4vw, 28px);
  }
  .item {
    margin-top: 13px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    opacity: 0.32;
    transition: opacity 0.7s ease;
  }
  .item:first-child { margin-top: 0; }
  .item .mark {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
    font-size: 13px;
    min-width: 58px;
    text-align: right;
  }
  .item .txt { font-size: 15px; color: var(--ink); }
  .item.lit { opacity: 1; }
  .item.lit .mark { color: var(--gold); }
  .item.lit .txt { color: var(--ink-strong); }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>反正睡不着</h1>
  <p class="sub">既然醒了，不如看看<em>这段时间有多贵</em>。表从你打开这页开始走。</p>

  <div class="clock">
    <div class="value" id="clock">00:00</div>
    <div class="label">你已经醒着（在这页上）这么久了</div>
  </div>

  <div class="report" id="report"></div>

  <p class="hint">不是催你睡。只是让你看清，你正花掉的是什么——以及它们其实也没那么贵。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  /* 分钟阈值 → 到点逐条点亮 */
  var LIST = [
    { m: 3, txt: '一碗泡面的全部仪式：水开、焖盖、揭盖。' },
    { m: 6, txt: '把你循环最多的那首歌，完整地再听两遍。' },
    { m: 12, txt: '一集动画的正片——片头曲和片尾曲都算你的。' },
    { m: 22, txt: '一张黑胶的 A 面，从第一轨听到该换面了。' },
    { m: 32, txt: '一顿认真对待的深夜加餐，包括摆盘。' },
    { m: 48, txt: '给很久没联系的人写一封不寄出的长信。' },
    { m: 66, txt: '一场完整的日落或日出——但得挑对时候出门。' },
    { m: 95, txt: '一部老电影的下半场，从你上次睡着的地方看起。' },
    { m: 130, txt: '一本薄薄的诗集，从第一页到最后一页。' },
    { m: 185, txt: '一场「今晚一定早睡」承诺的完整有效期。' }
  ];

  var clockEl = document.getElementById('clock');
  var reportEl = document.getElementById('report');
  var T0 = Date.now();

  LIST.forEach(function (it) {
    var row = document.createElement('div');
    row.className = 'item';
    var mark = document.createElement('span');
    mark.className = 'mark';
    mark.textContent = it.m >= 60 ? Math.floor(it.m / 60) + ' 时' + (it.m % 60 ? ' ' + (it.m % 60) + ' 分' : '') : it.m + ' 分';
    var txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = it.txt;
    row.appendChild(mark);
    row.appendChild(txt);
    reportEl.appendChild(row);
    it.el = row;
  });

  function tick() {
    var sec = Math.floor((Date.now() - T0) / 1000);
    var mm = String(Math.floor(sec / 60)).padStart(2, '0');
    var ss = String(sec % 60).padStart(2, '0');
    clockEl.textContent = mm + ':' + ss;
    var mins = sec / 60;
    LIST.forEach(function (it) {
      it.el.classList.toggle('lit', mins >= it.m);
    });
  }
  setInterval(tick, 1000);
  tick();
})();
</script>
</body>
</html>
