<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手撕日历</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06080d;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #c9c2b4;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .copy {
    position: absolute; top: 36px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #8a857a; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #565a63; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 6vh; left: 0; right: 0;
    text-align: center;
    font-size: 13px; letter-spacing: 0.1em;
    color: #a89f8e;
    min-height: 22px;
    opacity: 0;
    transition: opacity 0.9s ease;
    z-index: 3;
    pointer-events: none;
    padding: 0 30px;
  }
  .caption.show { opacity: 0.95; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #3c4048;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #565a63;
    text-decoration: none;
    border-bottom: 1px dotted #565a63;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #9b948a; border-color: #9b948a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>手撕日历</h1>
  <p>一叠厚厚的昨天。<br>点一下，撕掉一张——撕到今天为止。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var PAGES = [
    '那天说的是气话，别翻旧账了。',
    '没回的消息，对方也忘了。',
    '那顿加班的泡面，其实挺香。',
    '摔的门，后来轻轻关上了。',
    '错过的班车，路上正好下阵雨。',
    '丢的东西找到了新的主人。',
    '说过「明天再说」的，明天都接住了。',
    '今天不用撕。今天要自己过。'
  ];
  var left = PAGES.length;      // 还没撕的张数（含今天）
  var todayShown = false;

  function say(text) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    capTimer = setTimeout(function () { caption.classList.remove('show'); }, 4600);
  }

  function resize() {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  canvas.addEventListener('click', function () {
    if (left <= 1) {
      say('到今天了。撕不动了——今天的，要自己过。');
      return;
    }
    left--;
    say(PAGES[PAGES.length - left - 1]);
  });

  // 飘落的纸片
  var papers = [];          // {x,y,vy,vx,rot,rotV}
  var last = Date.now();

  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = now;
    var w = window.innerWidth, h = window.innerHeight;

    ctx.fillStyle = '#07090e';
    ctx.fillRect(0, 0, w, h);

    // 日历本体
    var cw = Math.min(300, w * 0.6), ch = Math.min(360, h * 0.52);
    var cx = w / 2, cy = h * 0.5;
    var top = cy - ch / 2;

    // 挂环
    ctx.strokeStyle = '#39414f';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, top, 16, Math.PI, 0); ctx.stroke();

    // 未撕的纸叠（错位层叠，层数=剩余张数）
    for (var i = 0; i < left; i++) {
      var off = i * 3;
      ctx.fillStyle = i === left - 1 ? '#efe8d6' : '#e2d9c2';
      roundRect(cx - cw / 2 + off * 0.4, top + off, cw - off * 0.8, ch - off, 6);
      ctx.fill();
    }
    // 顶层内容（今天/最近的日期文案）
    ctx.fillStyle = '#8a6a4a';
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    var topPage = PAGES[PAGES.length - left];
    if (topPage) {
      wrapText(topPage, cx, cy - 20, cw - 60, 22);
    } else {
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillStyle = '#6a4a2a';
      ctx.fillText('今天', cx, cy - 16);
      ctx.font = '13px system-ui, sans-serif';
      ctx.fillStyle = '#8a6a4a';
      ctx.fillText('要自己过。', cx, cy + 10);
    }
    // 装订孔
    ctx.fillStyle = '#07090e';
    ctx.beginPath(); ctx.arc(cx - 70, top + 22, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 70, top + 22, 5, 0, Math.PI * 2); ctx.fill();

    // 飘落的纸片
    for (var pi = papers.length - 1; pi >= 0; pi--) {
      var p = papers[pi];
      p.vy += 60 * dt;
      p.x += p.vx * dt + Math.sin(t * 0.002 + p.rot) * 30 * dt;
      p.y += p.vy * dt;
      p.rot += p.rotV * dt;
      if (p.y > h + 60) { papers.splice(pi, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = 'rgba(226,217,194,0.85)';
      roundRect(-26, -18, 52, 36, 3);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,100,70,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
      ctx.restore();
    }
  }

  function wrapText(text, x, y, maxW, lh) {
    ctx.fillStyle = '#6a5a42';
    var line = '', lines = [];
    for (var i = 0; i < text.length; i++) {
      var test = line + text[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = text[i]; }
      else line = test;
    }
    lines.push(line);
    lines.forEach(function (l, i) { ctx.fillText(l, x, y + i * lh); });
  }

  canvas.addEventListener('click', function () {
    if (left <= 1) return;
    papers.push({
      x: window.innerWidth / 2,
      y: window.innerHeight * 0.5,
      vx: (Math.random() - 0.3) * 100,
      vy: -120 - Math.random() * 80,
      rot: 0,
      rotV: (Math.random() - 0.5) * 4
    });
  });
  function roundRect(x, y, w2, h2, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w2, y, x + w2, y + h2, r);
    ctx.arcTo(x + w2, y + h2, x, y + h2, r);
    ctx.arcTo(x, y + h2, x, y, r);
    ctx.arcTo(x, y, x + w2, y, r);
    ctx.closePath();
    ctx.fill();
  }
  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动
})();
</script>
</body>
</html>
