<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给晚归的人留一盏灯</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0e1014;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #8e99a4;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.24em;
    color: #c8d1d9; margin-bottom: 12px; padding-left: 0.24em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #727d88; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #c8d1d9;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #454e57;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #727d88;
    text-decoration: none;
    border-bottom: 1px dotted #727d88;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #c8d1d9; border-color: #c8d1d9; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>给晚归的人留一盏灯</h1>
  <p>你先睡了，但玄关的灯不睡。<br>拨下开关——晚归的人一推门，第一眼就是亮的。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var seed = 20260918;
  function mulberry(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry(seed);

  function say(text, holdLong) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!holdLong) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 6200);
  }

  var L = {};
  function layout() {
    L.w = window.innerWidth;
    L.h = window.innerHeight;
    L.s = Math.max(0.6, Math.min(1.05, Math.min(L.w / 640, L.h / 720)));
    L.cx = L.w / 2;
  }
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  window.addEventListener('resize', function () {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  });

  // ── 状态 ──
  var on = false;
  var switchT = 0;          // 拨杆动画 0..1
  var glow = 0;             // 灯亮强度 0..1（缓升）
  var doneFired = false;
  var saidSecond = false;

  var SW;                   // 开关位置
  var LAMP;                 // 壁灯位置
  function calcPos() {
    SW = { x: L.w * 0.2, y: L.h * 0.46 };
    LAMP = { x: L.w * 0.66, y: L.h * 0.3 };
  }
  calcPos();

  function hitSwitch(px, py) {
    return Math.abs(px - SW.x) < 46 * L.s && Math.abs(py - SW.y) < 60 * L.s;
  }

  canvas.addEventListener('pointerdown', function (ev) {
    ensureAudio();
    if (!on && hitSwitch(ev.clientX, ev.clientY)) {
      on = true;
      switchT = 0.001;
      flipSound();
      if (!doneFired) {
        doneFired = true;
        say('啪嗒。灯留好了。');
        setTimeout(function () {
          saidSecond = true;
          say('晚归的人一推门，第一眼就是亮的。', true);
        }, 2600);
      }
    }
  });

  // ── 声音 ──
  var AC = null;
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  function flipSound() {
    if (!AC || AC.state !== 'running') return;
    var t = AC.currentTime;
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(700, t);
    o.frequency.exponentialRampToValueAtTime(320, t + 0.035);
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + 0.06);
  }

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.08, (now - last) / 1000);
    last = now;
    var w = L.w, h = L.h;
    calcPos();

    if (switchT > 0 && switchT < 1) switchT = Math.min(1, switchT + dt * 3);
    glow += ((on ? 1 : 0) - glow) * Math.min(1, dt * 1.6);

    // ── 绘制 ──
    // 玄关暗墙
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, mixRGB([14, 16, 20], [42, 36, 28], glow * 0.8));
    bg.addColorStop(1, mixRGB([10, 11, 14], [30, 26, 20], glow * 0.8));
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // 灯光晕（壁灯下扇形照）
    if (glow > 0.01) {
      var breathe = 1 + Math.sin(now / 700) * 0.03;
      var g1 = ctx.createRadialGradient(LAMP.x, LAMP.y + 8 * L.s, 0, LAMP.x, LAMP.y + 8 * L.s, 300 * L.s * breathe);
      g1.addColorStop(0, 'rgba(240,208,140,' + (0.32 * glow).toFixed(2) + ')');
      g1.addColorStop(0.5, 'rgba(240,208,140,' + (0.1 * glow).toFixed(2) + ')');
      g1.addColorStop(1, 'rgba(240,208,140,0)');
      ctx.fillStyle = g1;
      ctx.beginPath();
      ctx.moveTo(LAMP.x, LAMP.y);
      ctx.arc(LAMP.x, LAMP.y, 300 * L.s * breathe, Math.PI * 0.15, Math.PI * 0.85);
      ctx.closePath();
      ctx.fill();
    }

    // 门（右侧，门缝透一线外面的黑）
    var doorW = 130 * L.s, doorH = 300 * L.s;
    var doorX = w * 0.88 - doorW / 2, doorY = L.h * 0.62 - doorH / 2;
    ctx.fillStyle = mixRGB([26, 22, 18], [58, 46, 34], glow * 0.8);
    ctx.beginPath();
    ctx.roundRect(doorX, doorY, doorW, doorH, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 门板竖纹
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1.4;
    for (var pi = 1; pi <= 2; pi++) {
      ctx.beginPath();
      ctx.moveTo(doorX + doorW * pi / 3, doorY + 14 * L.s);
      ctx.lineTo(doorX + doorW * pi / 3, doorY + doorH - 14 * L.s);
      ctx.stroke();
    }
    // 门把手
    ctx.fillStyle = '#8a8f96';
    ctx.beginPath();
    ctx.arc(doorX + doorW * 0.82, doorY + doorH * 0.5, 5 * L.s, 0, Math.PI * 2);
    ctx.fill();
    // 门缝
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(doorX + doorW - 2, doorY + 6, 3, doorH - 12);

    // 鞋柜（左侧矮柜）
    var cabX = w * 0.06, cabY = L.h * 0.6;
    var cabW = w * 0.3, cabH = h * 0.2;
    ctx.fillStyle = mixRGB([30, 26, 22], [66, 54, 40], glow * 0.8);
    ctx.beginPath();
    ctx.roundRect(cabX, cabY, cabW, cabH, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cabX + 10, cabY + cabH * 0.34);
    ctx.lineTo(cabX + cabW - 10, cabY + cabH * 0.34);
    ctx.moveTo(cabX + 10, cabY + cabH * 0.67);
    ctx.lineTo(cabX + cabW - 10, cabY + cabH * 0.67);
    ctx.stroke();
    // 钥匙碟（柜面）+两把钥匙剪影
    var dishX = cabX + cabW * 0.68, dishY = cabY - 4 * L.s;
    ctx.fillStyle = mixRGB([50, 44, 38], [96, 82, 60], glow * 0.9);
    ctx.beginPath();
    ctx.ellipse(dishX, dishY, 34 * L.s, 9 * L.s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = mixRGB([70, 62, 52], [150, 132, 96], glow);
    ctx.lineWidth = 2 * L.s;
    ctx.beginPath();
    ctx.moveTo(dishX - 12 * L.s, dishY - 3 * L.s);
    ctx.lineTo(dishX + 6 * L.s, dishY - 5 * L.s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(dishX + 2 * L.s, dishY - 2 * L.s);
    ctx.lineTo(dishX + 16 * L.s, dishY - 3 * L.s);
    ctx.stroke();

    // 摆好的拖鞋一双（柜前地面）
    var slY = cabY + cabH + 30 * L.s;
    for (var si = -1; si <= 1; si += 2) {
      ctx.fillStyle = mixRGB([46, 40, 36], [110, 88, 70], glow * 0.9);
      ctx.beginPath();
      ctx.ellipse(L.cx + si * 26 * L.s, slY, 20 * L.s, 9 * L.s, si * 0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = mixRGB([58, 50, 44], [140, 112, 88], glow * 0.9);
      ctx.beginPath();
      ctx.ellipse(L.cx + si * 26 * L.s - si * 6 * L.s, slY - 2 * L.s, 11 * L.s, 6 * L.s, si * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }

    // 壁灯（罩+底座）
    ctx.fillStyle = '#3a3630';
    ctx.beginPath();
    ctx.roundRect(LAMP.x - 8 * L.s, LAMP.y - 6 * L.s, 16 * L.s, 10 * L.s, 2);
    ctx.fill();
    var shadeG = ctx.createRadialGradient(LAMP.x, LAMP.y + 2, 2, LAMP.x, LAMP.y + 2, 34 * L.s);
    shadeG.addColorStop(0, on ? mixRGB2([240,214,150], glow) : '#5a5248');
    shadeG.addColorStop(1, on ? mixRGB2([180,150,90], glow) : '#443e36');
    ctx.fillStyle = shadeG;
    ctx.beginPath();
    ctx.moveTo(LAMP.x - 30 * L.s, LAMP.y + 8 * L.s);
    ctx.quadraticCurveTo(LAMP.x, LAMP.y - 34 * L.s, LAMP.x + 30 * L.s, LAMP.y + 8 * L.s);
    ctx.closePath();
    ctx.fill();
    // 灯泡亮芯
    if (glow > 0.05) {
      ctx.fillStyle = 'rgba(255,230,170,' + (0.85 * glow).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(LAMP.x, LAMP.y + 2, 7 * L.s * (1 + Math.sin(now / 400) * 0.04), 0, Math.PI * 2);
      ctx.fill();
    }

    // 开关（左墙）
    ctx.fillStyle = mixRGB([34, 38, 44], [70, 68, 62], glow * 0.6);
    ctx.beginPath();
    ctx.roundRect(SW.x - 18 * L.s, SW.y - 30 * L.s, 36 * L.s, 60 * L.s, 5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    // 拨杆（下=关 上=开）
    var swY = SW.y + (1 - switchT) * 12 * L.s - 6 * L.s;
    ctx.fillStyle = on ? '#d8c070' : '#8a929a';
    ctx.beginPath();
    ctx.roundRect(SW.x - 9 * L.s, swY - 9 * L.s, 18 * L.s, 20 * L.s, 3);
    ctx.fill();
    // 开关标
    ctx.fillStyle = 'rgba(160,170,180,0.5)';
    ctx.font = Math.round(11 * L.s) + 'px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(on ? '留灯中' : '玄关灯', SW.x, SW.y + 52 * L.s);
    ctx.textAlign = 'left';

    // 引导
    if (!doneFired) {
      ctx.fillStyle = 'rgba(200,209,217,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
      ctx.font = '13px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('拨下开关，给晚归的人留个亮', SW.x, SW.y + 76 * L.s);
      ctx.textAlign = 'left';
    }
  }

  function mixRGB(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }
  function mixRGB2(base, t) {
    // base 是数组，t 是亮度系数 0..1（用于灯罩暖色）
    t = Math.max(0, Math.min(1, t));
    var lit = [Math.min(255, base[0] + 60 * t), Math.min(255, base[1] + 40 * t), Math.min(255, base[2] + 20 * t)];
    var dark = [base[0] * 0.5, base[1] * 0.5, base[2] * 0.5];
    return 'rgb(' + Math.round(dark[0] + (lit[0] - dark[0]) * t) + ',' + Math.round(dark[1] + (lit[1] - dark[1]) * t) + ',' + Math.round(dark[2] + (lit[2] - dark[2]) * t) + ')';
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // QA 钩子（无私人信息；与真实状态机共用）
  window.__light = {
    on: function () { return on; },
    glow: function () { return +glow.toFixed(2); },
    done: function () { return doneFired; },
    toggle: function () {
      if (!on) { on = true; switchT = 0.001; doneFired = true; }
      else { on = false; }
    }
  };
})();
</script>
</body>
</html>
