<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜华容道</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
    text-align: center;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; }
  .sub em { font-style: normal; color: var(--gold); }

  .hud {
    margin-top: clamp(16px, 4vw, 22px);
    display: flex;
    justify-content: center;
    gap: clamp(18px, 5vw, 34px);
    font-size: 14px;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
  }
  .hud .num { font-family: var(--mono); color: var(--ice); font-size: 16px; }

  .board {
    margin: clamp(14px, 3vw, 20px) auto 0;
    width: min(400px, 100%);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    background: rgba(16, 22, 40, 0.6);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
  }
  .tile {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: clamp(18px, 5vw, 24px);
    color: var(--ink-strong);
    background: linear-gradient(180deg, rgba(156, 200, 255, 0.12), rgba(156, 200, 255, 0.04));
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:hover { background: rgba(156, 200, 255, 0.14); }
  .tile.empty { background: transparent; border: 1px dashed rgba(156, 200, 255, 0.15); cursor: default; }
  .tile.correct { color: var(--gold); }

  .go-row { margin-top: clamp(14px, 3vw, 18px); }
  button.mix {
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.12em;
    color: var(--bg-0);
    background: var(--gold);
    border: none;
    border-radius: 999px;
    padding: 10px 28px;
    cursor: pointer;
  }
  button.mix:hover { filter: brightness(1.08); }

  .verdict { margin-top: clamp(14px, 3vw, 18px); min-height: 1.6em; color: var(--gold); font-size: clamp(15px, 4vw, 18px); }

  .hint {
    margin-top: clamp(18px, 4vw, 26px);
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { margin-top: 12px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>深夜华容道</h1>
  <p class="sub">把 1–15 归位，像把今晚纷乱的念头<em>一块块摆整齐</em>。点滑块旁边有空位的就能动。</p>

  <div class="hud">
    <span>已走 <span class="num" id="moves">0</span> 步</span>
    <span>状态：<span id="state" style="color:var(--ink)">打乱中</span></span>
  </div>

  <div class="board" id="board"></div>

  <div class="go-row">
    <button class="mix" id="mix" type="button">重新打乱</button>
  </div>

  <p class="verdict" id="verdict"></p>

  <p class="hint">归位时数字会变金。拼不出也没关系——深夜的华容道，讲究的是过程心平气和。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var N = 4;
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board');
  var grid = [];        // 4x4 数组，0 为空位
  var moves = 0;
  var solved = false;

  function solvedGrid() {
    var g = [];
    for (var i = 0; i < N * N - 1; i++) g.push(i + 1);
    g.push(0);
    return g;
  }

  // 从完成态随机走 120 步打乱（保证可解）
  function shuffle() {
    grid = solvedGrid();
    var empty = N * N - 1;
    for (var i = 0; i < 140; i++) {
      var r = Math.floor(empty / N), c = empty % N;
      var dirs = [];
      if (r > 0) dirs.push([-1, 0]);
      if (r < N - 1) dirs.push([1, 0]);
      if (c > 0) dirs.push([0, -1]);
      if (c < N - 1) dirs.push([0, 1]);
      var d = dirs[Math.floor(Math.random() * dirs.length)];
      var nr = r + d[0], nc = c + d[1];
      grid[empty] = grid[nr * N + nc];
      grid[nr * N + nc] = 0;
      empty = nr * N + nc;
    }
    moves = 0;
    solved = false;
    $('moves').textContent = '0';
    $('state').textContent = '打乱中';
    $('state').style.color = '';
    $('verdict').textContent = '';
    render();
  }

  function isSolved() {
    var g = solvedGrid();
    for (var i = 0; i < N * N; i++) if (grid[i] !== g[i]) return false;
    return true;
  }

  function render() {
    board.innerHTML = '';
    var goal = solvedGrid();
    for (var i = 0; i < N * N; i++) {
      var v = grid[i];
      var cell = document.createElement('div');
      if (v === 0) {
        cell.className = 'tile empty';
      } else {
        cell.className = 'tile';
        if (solved || v === goal[i]) cell.classList.add('correct');
        cell.textContent = String(v);
        cell.addEventListener('click', (function (idx) {
          return function () { tryMove(idx); };
        })(i));
      }
      board.appendChild(cell);
    }
  }

  function tryMove(idx) {
    if (solved) return;
    var r = Math.floor(idx / N), c = idx % N;
    // 找空位
    var er = -1, ec = -1;
    for (var i = 0; i < N * N; i++) {
      if (grid[i] === 0) { er = Math.floor(i / N); ec = i % N; break; }
    }
    if (Math.abs(er - r) + Math.abs(ec - c) !== 1) return;   // 不相邻
    grid[er * N + ec] = grid[idx];
    grid[idx] = 0;
    moves++;
    $('moves').textContent = String(moves);
    if (isSolved()) {
      solved = true;
      $('state').textContent = '已归位';
      $('state').style.color = 'var(--gold)';
      $('verdict').textContent = '归位。今晚纷乱的念头，一块块都齐了。晚安，摆牌的人。';
      render();
      return;
    }
    render();
  }

  $('mix').addEventListener('click', shuffle);

  shuffle();

  // 测试钩子：#solved 直接以归位态开局（放在 shuffle 之后才不被覆盖）
  if (window.location.hash === '#solved') {
    grid = solvedGrid();
    moves = 0;
    solved = true;
    $('state').textContent = '已归位';
    $('state').style.color = 'var(--gold)';
    history.replaceState(null, '', window.location.pathname);
  }

  render();
  if (solved) {
    $('verdict').textContent = '归位。今晚纷乱的念头，一块块都齐了。晚安，摆牌的人。';
    return;
  }
})();
</script>
</body>
</html>
