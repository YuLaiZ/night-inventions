<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早起的麻雀</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0e141c;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #4a5058;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #a6b0bc; margin-bottom: 12px; padding-left: 0.28em;
    text-shadow: 0 1px 4px rgba(8,12,18,0.65);
  }
  .copy p { font-size: 13px; line-height: 2; color: #a0aab6; letter-spacing: 0.08em; text-shadow: 0 1px 3px rgba(8,12,18,0.6); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #aeb8c2;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(8,12,18,0.6);
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #4e545a;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #585f66;
    text-decoration: none;
    border-bottom: 1px dotted #585f66;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #8e98a2; border-color: #8e98a2; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>早起的麻雀</h1>
  <p>天蒙蒙亮，麻雀比闹钟先醒。<br>按住撒一把米——它们一只一只落下来，替你把早晨叫醒。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var grains = [];         // 米粒 {x,y,landed}
  var sparrows = [];       // 麻雀 {x,y,tx,peckT,hopT,flip}
  var tossT = 0;           // 撒米动画
  var dawn = 0;            // 天亮程度 0-1
  var saidStart = false;
  var saidDone = false;
  var handfuls = 0;

  function say(text, hold) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!hold) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5600);
  }

  var L = {};
  function layout() {
    L.w = window.innerWidth;
    L.h = window.innerHeight;
    L.groundY = L.h * 0.72;
  }
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  window.addEventListener('resize', function () {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  });

  // 共享按压路径（QA 钩子与真实事件走同一函数）
  function startPress() {
    // 撒一把米（8-12 粒，落在中带）
    var n = 8 + Math.floor(Math.random() * 5);
    for (var i = 0; i < n; i++) {
      grains.push({
        x: L.w * (0.18 + Math.random() * 0.64),
        y: L.groundY + 10 + (Math.random() - 0.5) * L.h * 0.10,
        a: 0
      });
    }
    handfuls++;
    // 米够多就来一只新麻雀（从画面外飞入）
    var want = Math.min(9, Math.ceil(handfuls * 0.9));
    if (sparrows.length < want) {
      var fromLeft = Math.random() < 0.5;
      sparrows.push({
        x: fromLeft ? -30 : L.w + 30,
        y: L.h * (0.25 + Math.random() * 0.15),
        tx: L.w * (0.15 + Math.random() * 0.7),
        peckT: Math.random() * 6,
        hopT: Math.random() * 3,
        flip: fromLeft ? 1 : -1,
        flew: false
      });
    }
    if (!saidStart) { saidStart = true; say('米撒开一点。它们在等天亮，也在等这个。'); }
    else if (sparrows.length === 5) say('五只了。今天来得挺齐。');
  }

  canvas.addEventListener('pointerdown', function () { startPress(); });

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var w = window.innerWidth, h = window.innerHeight;

    // 天光：随时间与撒米次数渐亮
    dawn = Math.min(1, dawn + dt * 0.012 + (grains.length > 0 ? dt * 0.006 : 0));

    for (var g = grains.length - 1; g >= 0; g--) {
      if (grains[g].a < 1) grains[g].a = Math.min(1, grains[g].a + dt * 3);
    }
    for (var s = sparrows.length - 1; s >= 0; s--) {
      var sp = sparrows[s];
      if (!sp.flew) {
        sp.x += (sp.tx - sp.x) * Math.min(1, dt * 2.2);
        sp.y += ((L.groundY + 6 - sp.r0) - sp.y) * Math.min(1, dt * 2.2);
        if (Math.abs(sp.x - sp.tx) < 4) {
          sp.flew = true;
          sp.gy = L.groundY + 4 + Math.random() * L.h * 0.08;
        }
      } else {
        // 地上：小步跳 + 啄米
        sp.hopT -= dt;
        sp.peckT += dt;
        if (sp.hopT <= 0) {
          sp.hopT = 0.6 + Math.random() * 1.4;
          sp.hopV = 1;
          // 朝最近的米粒挪一点
          var best = null, bd = 1e9;
          for (var k = 0; k < grains.length; k++) {
            var dd = Math.abs(grains[k].x - sp.x);
            if (dd < bd) { bd = dd; best = grains[k]; }
          }
          if (best) sp.dir = best.x > sp.x ? 1 : -1;
          else sp.dir = Math.random() < 0.5 ? 1 : -1;
        }
        if (sp.hopV > 0) {
          sp.x += sp.dir * dt * 46;
          sp.hopY = Math.sin((1 - sp.hopT) * Math.PI) * 7;
          if (sp.hopT < 0.25) { sp.hopV = 0; sp.hopY = 0; }
        }
        // 吃掉附近的米粒
        for (var m = grains.length - 1; m >= 0; m--) {
          if (Math.abs(grains[m].x - sp.x) < 14 && grains[m].a >= 1) {
            grains.splice(m, 1);
            sp.peckT = 0;
          }
        }
      }
    }

    // ── 背景：天色渐亮 ──
    var sky = ctx.createLinearGradient(0, 0, 0, L.groundY);
    sky.addColorStop(0, mix('#0e141c', '#7e9ec2', dawn * 0.85));
    sky.addColorStop(0.62, mix('#131c26', '#b8c8d4', dawn * 0.8));
    sky.addColorStop(1, mix('#1a2430', '#e8d8b8', dawn * 0.75));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, L.groundY);
    // 太阳位置的天光
    if (dawn > 0.25) {
      var sun = ctx.createRadialGradient(w * 0.78, L.groundY - 10, 4, w * 0.78, L.groundY - 10, w * 0.28);
      sun.addColorStop(0, 'rgba(255,214,150,' + (dawn - 0.25) * 0.55 + ')');
      sun.addColorStop(1, 'rgba(255,214,150,0)');
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, w, L.groundY);
    }
    // 地面
    var gnd = ctx.createLinearGradient(0, L.groundY, 0, h);
    gnd.addColorStop(0, mix('#20262c', '#6a6258', dawn * 0.7));
    gnd.addColorStop(1, mix('#171c21', '#565048', dawn * 0.7));
    ctx.fillStyle = gnd;
    ctx.fillRect(0, L.groundY, w, h - L.groundY);
    // 一根电线（麻雀的首都）
    ctx.strokeStyle = 'rgba(20,26,32,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, L.h * 0.30);
    ctx.quadraticCurveTo(w * 0.5, L.h * 0.36, w, L.h * 0.28);
    ctx.stroke();

    // ── 米粒 ──
    for (var i = 0; i < grains.length; i++) {
      var gr = grains[i];
      ctx.fillStyle = 'rgba(238,222,180,' + (0.4 + gr.a * 0.5) + ')';
      ctx.beginPath();
      ctx.ellipse(gr.x, gr.y, 2.6, 1.6, 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // ── 麻雀 ──
    for (var j = 0; j < sparrows.length; j++) {
      var b = sparrows[j];
      var bx = b.x, by;
      if (!b.flew) {
        by = b.y;
        // 飞行扑翅
        var wing = Math.sin(now / 40) * 5;
        ctx.strokeStyle = 'rgba(58,60,66,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bx - 9, by + wing * 0.4);
        ctx.quadraticCurveTo(bx, by - 6 - wing * 0.3, bx + 9, by + wing * 0.4);
        ctx.stroke();
      } else {
        by = b.gy - 8 - (b.hopY || 0);
        // 啄地姿态：peckT 小于 0.25 时头朝下
        var peck = (b.peckT % 2.4) < 0.25;
        ctx.fillStyle = '#4a4640';
        // 身体
        ctx.beginPath();
        ctx.ellipse(bx, by, 9, 6.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // 头
        ctx.beginPath();
        ctx.arc(bx + 8 * (b.dir || 1), by - 5 + (peck ? 5 : 0), 4.4, 0, Math.PI * 2);
        ctx.fill();
        // 喙
        ctx.fillStyle = '#c8963c';
        ctx.beginPath();
        ctx.moveTo(bx + 11 * (b.dir || 1), by - 5 + (peck ? 6.5 : 0));
        ctx.lineTo(bx + 16 * (b.dir || 1), by - 4 + (peck ? 9 : 0));
        ctx.lineTo(bx + 11 * (b.dir || 1), by - 3 + (peck ? 7 : 0));
        ctx.closePath();
        ctx.fill();
        // 尾巴
        ctx.strokeStyle = '#3a3834';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(bx - 8, by - 1);
        ctx.lineTo(bx - 15, by - 3 + (peck ? 3 : 0));
        ctx.stroke();
        // 吱喳声纹（偶尔）
        if ((b.peckT % 3.1) < 0.3) {
          ctx.strokeStyle = 'rgba(90,96,104,0.5)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(bx + 13 * (b.dir || 1), by - 12, 5, -0.9, 0.9);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(bx + 13 * (b.dir || 1), by - 12, 9, -0.8, 0.8);
          ctx.stroke();
        }
      }
    }

    // ── 计数（等宽数字）──
    ctx.save();
    ctx.shadowColor = 'rgba(8,12,18,0.7)';
    ctx.shadowBlur = 4;
    ctx.fillStyle = 'rgba(206,214,222,0.75)';
    ctx.font = '12px ui-monospace, "SF Mono", Menlo, monospace';
    ctx.textAlign = 'right';
    ctx.fillText('撒米 ' + handfuls + ' 把 · 来了 ' + sparrows.length + ' 只', w - 22, 34);
    ctx.textAlign = 'left';
    ctx.restore();

    // 完成（天大亮）
    if (dawn > 0.9 && !saidDone) {
      saidDone = true;
      say('天亮了。它们替你把早晨叫醒了。', true);
    }

    // 引导
    if (!saidStart) {
      ctx.fillStyle = 'rgba(160,170,180,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
      ctx.font = '13px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('按住地面，撒一把米', w / 2, L.groundY + 60);
    }
  }

  function mix(c1, c2, t) {
    var a = hex(c1), b2 = hex(c2);
    return 'rgb(' + Math.round(a[0] + (b2[0] - a[0]) * t) + ',' + Math.round(a[1] + (b2[1] - a[1]) * t) + ',' + Math.round(a[2] + (b2[2] - a[2]) * t) + ')';
  }
  function hex(c) {
    return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // QA 钩子（无私人信息；与真实事件共用 startPress）
  window.__sparrow = {
    handfuls: function () { return handfuls; },
    sparrows: function () { return sparrows.length; },
    grains: function () { return grains.length; },
    dawn: function () { return +dawn.toFixed(2); },
    press: function () { startPress(); }
  };
})();
</script>
</body>
</html>
