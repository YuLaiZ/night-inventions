<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜辩论会</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; }
  .sub em { font-style: normal; color: var(--gold); }

  .motion {
    margin-top: clamp(22px, 5vw, 28px);
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(16, 22, 40, 0.6);
    padding: clamp(14px, 3vw, 20px);
    text-align: center;
  }
  .motion .tag { font-size: 12px; color: var(--gold); letter-spacing: 0.3em; }
  .motion .title { margin-top: 6px; color: var(--ink-strong); font-size: clamp(18px, 5vw, 22px); }
  .next-row { margin-top: 14px; text-align: center; }
  button.act {
    font-family: var(--sans);
    font-size: 13.5px;
    letter-spacing: 0.1em;
    color: var(--ice);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 20px;
    cursor: pointer;
  }
  button.act:hover { border-color: var(--ice); }

  .rounds { margin-top: clamp(20px, 4vw, 26px); display: grid; gap: 10px; }
  .round {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    opacity: 0.25;
    transition: opacity 0.4s ease;
  }
  .round.on { opacity: 1; }
  .round .who {
    flex: none;
    font-size: 26px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(156, 200, 255, 0.05);
  }
  .round .bubble {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    color: var(--ink-strong);
    background: rgba(16, 22, 40, 0.6);
  }
  .round .bubble .no { color: var(--ink-dim); font-size: 12.5px; display: block; letter-spacing: 0.1em; }

  .vote {
    display: none;
    margin-top: clamp(20px, 4vw, 26px);
    text-align: center;
  }
  .vote.show { display: block; animation: fadein 0.4s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .vote .ask { color: var(--gold); letter-spacing: 0.1em; font-size: 15px; }
  .vote .btns { margin-top: 12px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .vote .btns button {
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: rgba(156, 200, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
  }
  .vote .btns button:hover { border-color: var(--gold); color: var(--gold); }
  .verdict { margin-top: 14px; color: var(--ink-strong); font-size: 15.5px; min-height: 1.6em; }

  footer { margin-top: clamp(36px, 7vw, 52px); }
  .sig { margin-top: 12px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>深夜辩论会</h1>
  <p class="sub">天大的事都睡了他的觉，剩下这些<em>小事</em>吵得不可开交。听完三回合，你举手表决。</p>

  <div class="motion">
    <div class="tag">本期辩题</div>
    <div class="title" id="motion">——</div>
  </div>
  <div class="next-row">
    <button class="act" id="next" type="button" style="display:none">换个辩题</button>
  </div>

  <div class="rounds" id="rounds">
    <div class="round" id="r0"><span class="who">🧦</span><span class="bubble"><span class="no">正方 · 主张派</span><span class="txt"></span></span></div>
    <div class="round" id="r1"><span class="who">🥥</span><span class="bubble"><span class="no">反方 · 佛系派</span><span class="txt"></span></span></div>
    <div class="round" id="r2"><span class="who">🧦</span><span class="bubble"><span class="no">正方 · 补刀</span><span class="txt"></span></span></div>
    <div class="round" id="r3"><span class="who">🥥</span><span class="bubble"><span class="no">反方 · 总结陈词</span><span class="txt"></span></span></div>
  </div>

  <div class="vote" id="vote">
    <div class="ask">三回合完毕。你把票投给——</div>
    <div class="btns">
      <button id="v-pro" type="button">🧦 主张派</button>
      <button id="v-con" type="button">🥥 佛系派</button>
      <button id="v-home" type="button">🛏 我只想睡觉</button>
    </div>
    <p class="verdict" id="verdict"></p>
  </div>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var TOPICS = [
    {
      t: '泡面到底该不该加蛋',
      pro: ['加了蛋，这碗面才算被认真对待。', '深夜的蛋白质就是深夜的尊严。'],
      con: ['加蛋要洗锅。为三分钟的面破坏整套流程，不划算。', '原教旨泡面讲究的就是一个纯净。'],
      pro2: ['洗锅用的水，还不够你纠结的。', '你看，佛系到最后，连吃口热的都不敢主张。'],
      con2: ['面都吃了，还谈什么主张。睡吧，明天蛋会有的。']
    },
    {
      t: '熬的夜算不算自己的',
      pro: ['夜里每分钟都是自己的领土，寸土不让。', '白天的命是老板的，夜里的命才是自己的。'],
      con: ['借来的时间要还的——明天上午全吐出去，还带利息。', '你熬的不是夜，是明天的自己。'],
      pro2: ['那也是明天的我替今晚的我扛，兄弟之间不客气。', '至少今晚的我自由过。'],
      con2: ['自由过就会上瘾。这不叫领土，叫流窜。']
    },
    {
      t: '外卖满减该不该凑单',
      pro: ['满减就是商家的考题，凑单是消费者的满分作文。', '不凑，等于主动交学费。'],
      con: ['为了减八块钱多买二十块的，这账算得很有勇气。', '真正的省钱是从源头不吃。'],
      pro2: ['多买的那份可以当明天午饭，这叫战略储备。', '你看，反方连明天的饭都想省。'],
      con2: ['战略储备最后都在冰箱里过期。别问我怎么知道的。']
    },
    {
      t: '该不该把明天的事记下来',
      pro: ['好记性不如烂笔头，深夜的记性最不可信。', '写下来，脑子才能下班。'],
      con: ['写下来的事会变成债。不写，明天还能装忘。', '列表越长，睡得越浅。'],
      pro2: ['装忘的代价是焦虑一整晚，笔头只要三十秒。', '脑子下班的前提是有人接班。'],
      con2: ['接班的是明天的自己——他也有他的一脑子事。']
    },
    {
      t: '困的时候该不该硬撑看完这集',
      pro: ['半集弃剧是对所有人的不尊重，包括剧集本身。', '故事没听完就睡，梦都不踏实。'],
      con: ['平台就是算准了这句才自动连播的。', '剧集明天还在，困意过时不候。'],
      pro2: ['那你也别在无聊时刷它啊。理性要一视同仁。', '睡前看完，是给今天一个完整的句号。'],
      con2: ['句号可以明天画。今晚的省略号更配你现在的眼睛。']
    },
    {
      t: '睡前该不该再刷五分钟手机',
      pro: ['五分钟是缓冲区，直接入睡太像被拔电源。', '这是成年人的睡前故事时间。'],
      con: ['你的五分钟，平均实测四十七分钟。', '缓冲区里游的全是算法。'],
      pro2: ['那是我自制力的问题，不是五分钟的问题。', '再说，刷到困和想着刷到困，是两种困。'],
      con2: ['第二种困才是好困。第一种困，困在天亮。']
    }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var current = null;

  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  function open() {
    current = pick(TOPICS);
    $('motion').textContent = '「' + current.t + '」';
    $('r0').querySelector('.txt').textContent = current.pro[pick([0, 1])];
    $('r1').querySelector('.txt').textContent = current.con[pick([0, 1])];
    $('r2').querySelector('.txt').textContent = current.pro2[pick([0, 1])];
    $('r3').querySelector('.txt').textContent = current.con2[0];
    $('verdict').textContent = '';
    $('vote').classList.remove('show');
    $('next').style.display = 'none';
    // 逐回合亮起
    var rounds = ['r0', 'r1', 'r2', 'r3'];
    rounds.forEach(function (id, idx) {
      var el = $(id);
      el.classList.remove('on');
      setTimeout(function () { el.classList.add('on'); }, 350 * (idx + 1));
    });
    setTimeout(function () { $('vote').classList.add('show'); }, 350 * rounds.length + 300);
  }

  function voteWith(text) {
    $('verdict').textContent = '记录在案：' + text + '。本会所有锡纸封装的辩题库，明晚继续吵。';
    $('next').style.display = '';
  }

  $('v-pro').addEventListener('click', function () { voteWith('主张派 🧦'); });
  $('v-con').addEventListener('click', function () { voteWith('佛系派 🥥'); });
  $('v-home').addEventListener('click', function () {
    $('verdict').textContent = '弃权理由：想睡觉。本会一致认为，这是今晚最有力的一票。';
    $('next').style.display = '';
  });
  $('next').addEventListener('click', open);

  open();
})();
</script>
</body>
</html>
