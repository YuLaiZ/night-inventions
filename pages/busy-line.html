<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>占线中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06080d;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #c9c2b4;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 36px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #8a857a; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #565a63; letter-spacing: 0.08em; }
  .dial-wrap {
    position: absolute; left: 50%; top: 56%;
    transform: translate(-50%, -50%);
    width: 320px; height: 320px;
    z-index: 2;
  }
  .dial-body {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 36%, #232a37, #141924 72%);
    border: 3px solid #39414f;
    box-shadow: 0 18px 50px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.5);
  }
  .rotor {
    position: absolute; inset: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 44% 38%, #3a4252, #232a38 70%);
    border: 2px solid #4a5468;
    transform: rotate(0deg);
  }
  .hole {
    position: absolute;
    width: 52px; height: 52px;
    margin: -26px;
    border-radius: 50%;
    background: #10141c;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.85), 0 1px 0 rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    color: #cfc8b8;
    font-size: 19px;
    font-weight: 500;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .center-cap {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 74px; height: 74px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 34%, #4a5468, #2b3342 70%);
    border: 2px solid #5a6478;
    display: flex; align-items: center; justify-content: center;
    color: #d8d2c4;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-align: center;
    line-height: 1.7;
    z-index: 3;
  }
  .display {
    position: absolute; bottom: 17vh; left: 0; right: 0;
    text-align: center;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 21px;
    letter-spacing: 0.34em;
    color: #e8d9b0;
    min-height: 30px;
    z-index: 3;
  }
  .reply {
    position: absolute; bottom: 9.5vh; left: 0; right: 0;
    text-align: center;
    font-size: 13px; letter-spacing: 0.1em;
    color: #a89f8e;
    min-height: 24px;
    opacity: 0;
    transition: opacity 0.9s ease;
    z-index: 3;
    pointer-events: none;
  }
  .reply.show { opacity: 0.95; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #3c4048;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #565a63;
    text-decoration: none;
    border-bottom: 1px dotted #565a63;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #9b948a; border-color: #9b948a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>

<div class="copy">
  <h1>占线中</h1>
  <p>凌晨想找个人说说话。<br>拖转盘到底再松手，一个数字一个数字拨。</p>
</div>

<div class="dial-wrap">
  <div class="dial-body"></div>
  <div class="rotor" id="rotor"></div>
  <div class="center-cap">拨号<br>盘</div>
</div>

<div class="display" id="display">&nbsp;</div>
<div class="reply" id="reply"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var rotor = document.getElementById('rotor');
  var display = document.getElementById('display');
  var reply = document.getElementById('reply');
  var SIZE = 252;                       // rotor 直径
  var R = SIZE / 2;

  // 数字孔：0 在正下方，1–9 沿逆时针排开（老转盘的排法）
  var holes = [];
  var layout = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0];
  layout.forEach(function (num, i) {
    var ang = -60 - i * 26;             // 度：从右下往左下排布
    var el = document.createElement('div');
    el.className = 'hole';
    el.textContent = num;
    rotor.appendChild(el);
    var rad = ang * Math.PI / 180;
    var hx = R + Math.cos(rad) * (R - 42);
    var hy = R + Math.sin(rad) * (R - 42);
    el.style.left = hx + 'px';
    el.style.top = hy + 'px';
    holes.push({ num: num, ang: ang, el: el });
  });

  // ── 转盘拖拽 ─────────────────────────────────────────
  var wrap = document.querySelector('.dial-wrap');
  var dragging = false;
  var startPointerAng = 0;
  var startRotor = 0;
  var rot = 0;                          // 当前旋转角（正值=逆时针拨）
  var taken = null;                     // 本次拖拽拨出的数字（一个）
  var dialed = '';

  function pointerAngle(e) {
    var r = wrap.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
  }

  wrap.addEventListener('pointerdown', function (e) {
    dragging = true;
    taken = null;
    startPointerAng = pointerAngle(e);
    startRotor = rot;
    reply.classList.remove('show');
    e.preventDefault();
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var a = pointerAngle(e);
    var d = a - startPointerAng;
    while (d > 180) d -= 360;
    while (d < -180) d += 360;
    rot = Math.max(0, Math.min(250, startRotor - d));   // 顺时针拖为正
    rotor.style.transform = 'rotate(' + (-rot) + 'deg)';   // 顺时针转盘=负角
    // 每次拖拽只拨一位：第一个扫过「止点」(约 -118°) 的数字
    if (taken === null) {
      for (var i = 0; i < holes.length; i++) {
        var h = holes[i];
        if (h.ang - rot < -118) { taken = h.num; break; }
      }
    }
  });
  window.addEventListener('pointerup', function () {
    if (!dragging) return;
    dragging = false;
    // 回弹
    rotor.style.transition = 'transform 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15)';
    rotor.style.transform = 'rotate(0deg)';
    setTimeout(function () { rotor.style.transition = ''; }, 850);
    rot = 0;
    if (taken !== null) {
      dialed += taken;
      display.textContent = dialed;
      if (dialed.length >= 7) settle();
    }
    taken = null;
  });

  // ── 拨号结果 ─────────────────────────────────────────
  var REPLIES = [
    { key: 'busy', text: '嘟——嘟——占线中。那个人和你一样，也在拨给谁。' },
    { key: 'self', text: '您拨打的号码正在忙着重启自己。请深夜再拨。' },
    { key: 'void', text: '您拨打的号码是空的。但听筒里有海的声音。' },
    { key: 'past', text: '已接通过去的某一晚。对方沉默了很久，挂了。' },
    { key: 'sleep', text: '对方已睡。梦话转达：「嗯，明天见。」' },
    { key: 'lamp', text: '接通了一盏路灯。它说它也熬夜，不困。' },
    { key: 'cat', text: '接通了某只猫。它踩了两下键盘，挂断。' }
  ];

  function settle() {
    var r;
    if (dialed.length < 7) {
      r = { text: '号码没拨完就松手了。它不会知道你想说什么。' };
    } else if (dialed === dialed.split('').reverse().join('')) {
      r = REPLIES[1];                    // 回文号：拨给自己
    } else {
      r = REPLIES[2 + Math.floor(Math.random() * (REPLIES.length - 2))];
    }
    reply.textContent = r.text;
    reply.classList.add('show');
    dialed = '';
    setTimeout(function () { display.textContent = '\u00A0'; }, 1600);
  }
})();
</script>
</body>
</html>
