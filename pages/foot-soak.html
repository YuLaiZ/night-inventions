<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜泡脚</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06080d;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #c9c2b4;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .copy {
    position: absolute; top: 36px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #8a857a; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #565a63; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 6vh; left: 0; right: 0;
    text-align: center;
    font-size: 13px; letter-spacing: 0.1em;
    color: #a89f8e;
    min-height: 22px;
    opacity: 0;
    transition: opacity 0.9s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 0.95; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #3c4048;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #565a63;
    text-decoration: none;
    border-bottom: 1px dotted #565a63;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #9b948a; border-color: #9b948a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>深夜泡脚</h1>
  <p>一盆 42° 的热水，等了一晚上了。<br>点一下盆，把脚放进去。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var feetIn = false;
  var ripples = [];        // {x,y,r,alpha}
  var bubbles = [];        // {x,y,vy,r,ph}
  var temp = 42.0;

  function say(text) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    capTimer = setTimeout(function () { caption.classList.remove('show'); }, 4600);
  }

  function resize() {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function geometry() {
    var w = window.innerWidth, h = window.innerHeight;
    return { cx: w / 2, cy: h * 0.62, rx: Math.min(200, w * 0.38), ry: Math.min(84, h * 0.16) };
  }

  canvas.addEventListener('click', function () {
    feetIn = !feetIn;
    say(feetIn ? '「嘶——烫。烫完就是舒服。」' : '擦干，穿上袜子。今晚到此为止。');
    if (feetIn) {
      var g = geometry();
      for (var i = 0; i < 10; i++) {
        ripples.push({ x: g.cx + (Math.random() - 0.5) * g.rx, y: g.cy + (Math.random() - 0.5) * g.ry * 0.6, r: 4, alpha: 1 });
      }
    }
  });

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = now;
    var w = window.innerWidth, h = window.innerHeight;
    var g = geometry();

    if (feetIn) {
      temp = Math.max(36.5, temp - dt * 0.06);
      if (Math.random() < dt * 3) {
        bubbles.push({ x: g.cx + (Math.random() - 0.5) * g.rx * 1.3, y: g.cy, r: 1.6 + Math.random() * 2, vy: -20 - Math.random() * 16, ph: Math.random() * 6.28 });
      }
    }

    ctx.fillStyle = '#07090e';
    ctx.fillRect(0, 0, w, h);

    // 盆：外壁
    ctx.fillStyle = '#22303c';
    ctx.beginPath();
    ctx.ellipse(g.cx, g.cy + 26, g.rx * 1.08, g.ry * 1.05, 0, 0, Math.PI * 2);
    ctx.fill();
    // 盆内水
    var water = ctx.createRadialGradient(g.cx, g.cy - g.ry * 0.3, g.rx * 0.1, g.cx, g.cy, g.rx);
    water.addColorStop(0, feetIn ? '#3f6a86' : '#4a7a96');
    water.addColorStop(1, feetIn ? '#26404f' : '#2c4a5c');
    ctx.fillStyle = water;
    ctx.beginPath();
    ctx.ellipse(g.cx, g.cy, g.rx, g.ry, 0, 0, Math.PI * 2);
    ctx.fill();
    // 水面高光弧
    ctx.strokeStyle = 'rgba(200,230,250,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(g.cx, g.cy, g.rx * 0.86, g.ry * 0.74, 0, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();

    // 波纹
    for (var i = ripples.length - 1; i >= 0; i--) {
      var rp = ripples[i];
      rp.r += 40 * dt;
      rp.alpha -= dt * 0.8;
      if (rp.alpha <= 0) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(210,235,250,' + Math.max(0, rp.alpha * 0.5) + ')';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.4, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 气泡
    for (var bi = bubbles.length - 1; bi >= 0; bi--) {
      var b2 = bubbles[bi];
      b2.y += b2.vy * dt;
      b2.x += Math.sin(t * 0.004 + b2.ph) * 8 * dt;
      if (b2.y < g.cy - g.ry * 0.5) { bubbles.splice(bi, 1); continue; }
      ctx.strokeStyle = 'rgba(210,235,250,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(b2.x, b2.y, b2.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 脚（放进去时只露脚踝以上，水面上两条腿剪影）
    if (feetIn) {
      ctx.fillStyle = '#181420';
      ctx.save();
      ctx.translate(g.cx - 30, g.cy);
      ctx.rotate(-0.16 + Math.sin(t * 0.001) * 0.02);
      roundRectFill(-16, -120, 32, 96, 16);
      ctx.restore();
      ctx.save();
      ctx.translate(g.cx + 30, g.cy);
      ctx.rotate(0.14 + Math.sin(t * 0.0013) * 0.02);
      roundRectFill(-16, -116, 32, 94, 16);
      ctx.restore();
    }

    // 温度浮字
    ctx.fillStyle = 'rgba(224,196,138,' + (feetIn ? 0.9 : 0.55) + ')';
    ctx.font = '13px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(temp.toFixed(1) + '°', g.cx, g.cy - g.ry - 16);
  }

  function roundRectFill(x, y, w2, h2, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w2, y, x + w2, y + h2, r);
    ctx.arcTo(x + w2, y + h2, x, y + h2, r);
    ctx.arcTo(x, y + h2, x, y, r);
    ctx.arcTo(x, y, x + w2, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动
})();
</script>
</body>
</html>
