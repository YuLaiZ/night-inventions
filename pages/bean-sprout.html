<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生豆芽</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d1218;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #4a4a44;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #c88a6a; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #7a6250; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #c88a6a;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #565a54;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #7a6250;
    text-decoration: none;
    border-bottom: 1px dotted #7a6250;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #c88a6a; border-color: #c88a6a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>生豆芽</h1>
  <p>豆子泡胖了，铺进湿布里。<br>点水壶浇一浇——盖好等一夜，早上就是一盘豆芽。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var TOTAL = 4;        // 浇 4 次水
  var watered = 0;
  var pouring = 0;      // 壶倾倒动画 0→1→0
  var drops = [];
  var saidStart = false;
  var resting = false;
  var seed = 20260916;
  var blink = 0;

  function mulberry(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function say(text, holdLong) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!holdLong) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5600);
  }

  var L = {};
  function layout() {
    L.w = window.innerWidth;
    L.h = window.innerHeight;
    L.floorY = L.h * 0.76;
    L.bx = L.w * 0.44;
    L.by = L.h * 0.58;                     // 布包中心
    L.bR = Math.min(L.w * 0.17, L.h * 0.15, 130);
    L.kX = Math.min(L.w - L.bR * 1.4, L.bx + L.bR * 2.4);
    L.kY = L.floorY - L.h * 0.06;          // 水壶位置
  }
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  window.addEventListener('resize', function () {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  });

  // 豆：位置与各自芽的参数
  var beans = [];
  (function () {
    var rng = mulberry(seed);
    for (var i = 0; i < 9; i++) {
      beans.push({
        ox: (i % 3 - 1) * 0.55 + (rng() - 0.5) * 0.18,
        oy: (Math.floor(i / 3) - 1) * 0.4 + (rng() - 0.5) * 0.14,
        s: 0.9 + rng() * 0.25,
        rot: rng() * Math.PI,
        lean: rng() * 0.6 - 0.3,
        len: 0.8 + rng() * 0.5
      });
    }
  })();

  function drawSprout(b, grow, now) {
    // 豆（绿豆瓣）与芽（白茎）——grow 0..1
    var x = L.bx + b.ox * L.bR;
    var y = L.by + b.oy * L.bR * 0.7;
    var r = L.bR * 0.16 * b.s;
    ctx.save();
    ctx.translate(x, y);
    // 豆瓣（grow 前期鼓、后期被芽顶开）
    var split = grow * 0.35;
    var beanC = ['#7d9a4a', '#6c8a3e'];
    for (var half = -1; half <= 1; half += 2) {
      ctx.fillStyle = beanC[(half + 1) / 2];
      ctx.beginPath();
      ctx.ellipse(half * r * (0.35 + split), 0, r * (0.62 - split * 0.12), r * 0.8, b.rot + half * 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
    // 芽：白茎从豆缝钻出，向上弯
    if (grow > 0.15) {
      var g2 = Math.min(1, (grow - 0.15) / 0.85) * b.len;
      var lean = b.lean;
      ctx.strokeStyle = '#e9e6d2';
      ctx.lineWidth = 3.4 * b.s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.3);
      ctx.quadraticCurveTo(lean * 18 * g2, -r * (0.8 + g2 * 1.3), lean * 30 * g2 + Math.sin(now / 500 + b.rot) * 1.5, -r * (1.1 + g2 * 2.6));
      ctx.stroke();
      // 芽尖微黄
      ctx.fillStyle = '#d8d38a';
      ctx.beginPath();
      ctx.arc(lean * 30 * g2, -r * (1.1 + g2 * 2.6), 2.2 * b.s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (resting) {
      resting = false;
      watered = 0;
      drops = [];
      pouring = 0;
      saidStart = false;
      return;
    }
    if (watered >= TOTAL || pouring > 0) return;
    var dx = ev.clientX - L.kX, dy = ev.clientY - L.kY;
    if (dx * dx + dy * dy < Math.pow(L.bR * 0.6, 2)) {
      pouring = 0.001;
      if (!saidStart) { saidStart = true; say('水要浇透——豆子喝饱了才肯动。'); }
    }
  });

  var last = Date.now();

  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var w = L.w, h = L.h;

    if (pouring > 0) {
      pouring += dt;
      if (pouring < 1.2 && Math.random() < 0.6) {
        drops.push({
          x: L.bx - L.bR * 0.7 + Math.random() * L.bR * 1.4,
          y: L.by - L.bR * 1.1,
          vy: 90 + Math.random() * 50,
          life: 1
        });
      }
      if (pouring >= 1.2) {
        pouring = 0;
        watered++;
        if (watered === 1) say('喝饱第一顿。盖上布，别见光。');
        if (watered === 2) say('有动静了——豆子裂了条缝。');
        if (watered === 3) say('芽尖顶出来了，弯着腰。');
        if (watered >= TOTAL) {
          resting = true;
          say('一夜就长这么高。豆子的一生，最勤快的一晚。', true);
        }
      }
    }
    for (var di = drops.length - 1; di >= 0; di--) {
      var dp = drops[di];
      dp.y += dp.vy * dt;
      if (dp.y > L.by + L.bR * 0.35) drops.splice(di, 1);
    }

    // ── 背景：屋角晨光渐亮（随水ed 微亮）──
    var amb = 0.5 + watered * 0.12;
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, mix('#0c0f14', '#12141a', (amb - 0.5) * 0.5));
    bg.addColorStop(1, mix('#131217', '#191a1c', (amb - 0.5) * 0.5));
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    // 地面
    ctx.fillStyle = '#191410';
    ctx.fillRect(0, L.floorY, w, h - L.floorY);
    ctx.fillStyle = 'rgba(122,96,62,0.35)';
    ctx.fillRect(0, L.floorY, w, 2);

    // ── 湿布包（摊开的白布托着豆子）──
    var bx2 = L.bx, by2 = L.by, bR = L.bR;
    // 布褶
    ctx.fillStyle = '#cfc8b4';
    ctx.beginPath();
    ctx.ellipse(bx2, by2 + bR * 0.4, bR * 1.25, bR * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,125,95,0.4)';
    ctx.lineWidth = 1.4;
    for (var fold = -2; fold <= 2; fold++) {
      ctx.beginPath();
      ctx.moveTo(bx2 + fold * bR * 0.4, by2 + bR * 0.05);
      ctx.quadraticCurveTo(bx2 + fold * bR * 0.5, by2 + bR * 0.32, bx2 + fold * bR * 0.34, by2 + bR * 0.62);
      ctx.stroke();
    }
    // 布上的豆与芽
    for (var bi = 0; bi < beans.length; bi++) {
      var b = beans[bi];
      var bGrow = Math.min(1, (watered - 0.5) / 3 + (watered >= TOTAL ? 0.05 : 0));
      drawSprout(b, Math.max(0, bGrow), now);
    }

    // ── 水珠 ──
    ctx.fillStyle = 'rgba(165,200,230,0.75)';
    for (var di = 0; di < drops.length; di++) {
      ctx.beginPath();
      ctx.ellipse(drops[di].x, drops[di].y, 2, 3.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // ── 水壶 ──
    var kx = L.kX, ky = L.kY;
    var tilt = pouring > 0 ? Math.min(1, pouring * 3) * 0.5 : 0;
    ctx.save();
    ctx.translate(kx, ky);
    ctx.rotate(tilt);
    // 壶身
    var kg = ctx.createLinearGradient(-bR * 0.5, 0, bR * 0.5, 0);
    kg.addColorStop(0, '#5a6b78');
    kg.addColorStop(0.5, '#7d909c');
    kg.addColorStop(1, '#4d5b66');
    ctx.fillStyle = kg;
    ctx.beginPath();
    ctx.moveTo(-bR * 0.42, bR * 0.5);
    ctx.lineTo(bR * 0.42, bR * 0.5);
    ctx.quadraticCurveTo(bR * 0.5, -bR * 0.6, 0, -bR * 0.66);
    ctx.quadraticCurveTo(-bR * 0.5, -bR * 0.6, -bR * 0.42, bR * 0.5);
    ctx.closePath();
    ctx.fill();
    // 壶身高光
    ctx.fillStyle = 'rgba(220,235,245,0.25)';
    ctx.beginPath();
    ctx.ellipse(-bR * 0.16, -bR * 0.05, bR * 0.09, bR * 0.3, 0.08, 0, Math.PI * 2);
    ctx.fill();
    // 壶盖钮
    ctx.fillStyle = '#3d4a54';
    ctx.beginPath();
    ctx.arc(0, -bR * 0.72, bR * 0.09, 0, Math.PI * 2);
    ctx.fill();
    // 壶嘴
    ctx.strokeStyle = '#6b7d89';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-bR * 0.3, -bR * 0.2);
    ctx.quadraticCurveTo(-bR * 0.75, -bR * 0.4, -bR * 0.8, -bR * 0.72);
    ctx.stroke();
    // 提梁
    ctx.strokeStyle = '#4d5b66';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, -bR * 0.3, bR * 0.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    ctx.restore();

    // 进度：壶上四个水滴记号
    for (var ni = 0; ni < TOTAL; ni++) {
      ctx.fillStyle = ni < watered ? 'rgba(165,200,230,0.85)' : 'rgba(165,200,230,0.2)';
      ctx.beginPath();
      ctx.moveTo(kx - 24 + ni * 16, ky + bR * 0.9);
      ctx.quadraticCurveTo(kx - 21 + ni * 16, ky + bR * 0.9 + 6, kx - 24 + ni * 16, ky + bR * 0.9 + 8);
      ctx.quadraticCurveTo(kx - 27 + ni * 16, ky + bR * 0.9 + 6, kx - 24 + ni * 16, ky + bR * 0.9);
      ctx.fill();
    }

    // 引导
    if (!saidStart && watered === 0) {
      ctx.fillStyle = 'rgba(200,138,106,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
      ctx.font = '13px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('点水壶，浇头一遍', kx, ky - bR * 1.1);
      ctx.textAlign = 'left';
    }
    if (resting) {
      ctx.fillStyle = 'rgba(230,210,170,' + (0.34 + 0.16 * Math.sin(now / 600)) + ')';
      ctx.font = '12px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('再发一盆', L.bx, L.floorY + 34);
      ctx.textAlign = 'left';
    }
  }

  function mix(c1, c2, t) {
    function px(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
    var a = px(c1), b = px(c2);
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // QA 钩子（无私人信息；与真实点击共用状态机）
  window.__sprout = {
    watered: function () { return watered; },
    done: function () { return resting; },
    tap: function () {
      if (resting || watered >= TOTAL || pouring > 0) return;
      pouring = 0.001;
      saidStart = true;
    }
  };
})();
</script>
</body>
</html>
