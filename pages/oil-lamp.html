<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挑灯芯</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d1218;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #4a4a44;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #c88a6a; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #7a6250; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #c88a6a;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #565a54;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #7a6250;
    text-decoration: none;
    border-bottom: 1px dotted #7a6250;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #c88a6a; border-color: #c88a6a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>挑灯芯</h1>
  <p>灯苗豆大，屋里什么也看不真切。<br>点一下灯芯，挑亮一分——灯花爆的时候，夜里最亮。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  var level = 0;        // 0 豆火 / 1..3 挑过几级
  var picking = false;  // 挑针动画中
  var pickT = 0;
  var spark = 0;        // 火花闪 0→1→0
  var burst = 0;        // 第三次灯花爆
  var saidStart = false;
  var resting = false;
  var seed = 20260916;
  var moths = [];       // 灯下小飞虫剪影

  function mulberry(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function say(text, holdLong) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!holdLong) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5600);
  }

  var L = {};
  function layout() {
    L.w = window.innerWidth;
    L.h = window.innerHeight;
    L.floorY = L.h * 0.8;
    L.lx = L.w * 0.5;
    L.ly = L.h * 0.58;                       // 灯座顶（火焰根）
    L.lR = Math.min(L.w * 0.05, L.h * 0.05, 42);
  }
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  window.addEventListener('resize', function () {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  });

  (function () {
    var rng = mulberry(seed);
    for (var i = 0; i < 3; i++) {
      moths.push({ a: rng() * Math.PI * 2, d: 0.6 + rng() * 0.8, sp: 0.4 + rng() * 0.5, ph: rng() * 9 });
    }
  })();

  // 火焰层数与尺寸随 level
  function flameSize() {
    return L.lR * (0.55 + level * 0.42);
  }

  function drawFlame(x, y, now) {
    var size = flameSize();
    var layers = level >= 3 ? 4 : 3;
    var cols = ['rgba(226,120,52,0.9)', 'rgba(240,180,80,0.92)', 'rgba(250,232,180,0.95)', 'rgba(255,250,235,0.9)'];
    for (var li = 0; li < layers; li++) {
      var s = 1 - li * 0.26;
      var ph = li * 2.1;
      var wob = Math.sin(now / (110 + li * 55) + ph) * 0.1 + Math.sin(now / (67 + li * 29) + ph * 2) * 0.07;
      var tip = size * s * (1.5 + wob) + Math.sin(now / 190 + ph) * size * 0.12;
      ctx.fillStyle = cols[li];
      ctx.beginPath();
      ctx.moveTo(x, y + size * 0.16);
      ctx.bezierCurveTo(
        x - size * s * 0.6, y + size * 0.08,
        x - size * s * 0.38, y - tip * 0.55,
        x + wob * size * 0.5, y - tip
      );
      ctx.bezierCurveTo(
        x + size * s * 0.38, y - tip * 0.55,
        x + size * s * 0.6, y + size * 0.08,
        x, y + size * 0.16
      );
      ctx.fill();
    }
    // 灯芯
    ctx.strokeStyle = '#2c2620';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.14);
    ctx.lineTo(x, y);
    ctx.stroke();
    // 火花
    if (spark > 0) {
      var rng = mulberry(31);
      for (var si = 0; si < 5; si++) {
        var sa = rng() * Math.PI * 2, sd = (1 - spark) * 26 + 6;
        ctx.fillStyle = 'rgba(255,200,110,' + spark + ')';
        ctx.fillRect(x + Math.cos(sa) * sd, y - size * 0.9 + Math.sin(sa) * sd * 0.6, 2, 2);
      }
    }
  }

  var last = Date.now();

  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var w = L.w, h = L.h;

    if (picking) {
      pickT += dt * 1.6;
      if (pickT >= 0.45 && spark === 0) spark = 1;
      if (pickT >= 1) {
        picking = false;
        level++;
        if (level === 1) say('灯苗蹿了一截——桌角还藏着一只茶杯。');
        if (level === 2) say('又亮一分。那本书摊在那儿好几天了。');
        if (level >= 3) {
          burst = 1;
          resting = true;
          say('啪——灯花爆了一声。夜里最亮的一下，是个好兆头。', true);
        }
      }
    }
    if (spark > 0) spark = Math.max(0, spark - dt * 1.8);
    if (burst > 0) burst = Math.max(0, burst - dt * 0.4);

    // ── 背景：暗屋，亮度随 level ──
    var amb = 0.04 + level * 0.05;
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, mix('#0b0e13', '#171310', level * 0.28));
    bg.addColorStop(1, mix('#101318', '#1b1610', level * 0.28));
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // ── 桌面 ──
    var tableY = L.ly + L.lR * 2.6;
    var tg = ctx.createLinearGradient(0, tableY, 0, h);
    tg.addColorStop(0, mix('#1a140d', '#4a3620', level * 0.3));
    tg.addColorStop(1, mix('#14100a', '#332413', level * 0.3));
    ctx.fillStyle = tg;
    ctx.fillRect(0, tableY, w, h - tableY);
    ctx.fillStyle = 'rgba(200,170,120,' + (0.1 + level * 0.08) + ')';
    ctx.fillRect(0, tableY, w, 2);

    // ── 灯的光晕（主光源）──
    var glowR = Math.min(w, h) * (0.22 + level * 0.17);
    var flick = 1 + Math.sin(now / 87) * 0.025 + Math.sin(now / 41) * 0.015;
    var g = ctx.createRadialGradient(L.lx, L.ly - flameSize() * 0.6, 0, L.lx, L.ly - flameSize() * 0.6, glowR * flick);
    g.addColorStop(0, 'rgba(232,176,104,' + (0.3 + level * 0.09) * flick + ')');
    g.addColorStop(0.45, 'rgba(220,160,90,' + (0.12 + level * 0.045) + ')');
    g.addColorStop(1, 'rgba(220,160,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // ── 桌上物件（随亮度渐显）──
    ctx.save();
    var vis = Math.min(1, level / 2);
    // 茶杯（左）
    ctx.globalAlpha = Math.max(0.12, vis);
    var cupX = L.lx - L.lR * 4.6, cupY = tableY + L.lR * 0.8;
    var cR = L.lR * 0.52;
    var cgr = ctx.createLinearGradient(cupX - cR, 0, cupX + cR, 0);
    cgr.addColorStop(0, '#65727c');
    cgr.addColorStop(0.5, '#8b98a2');
    cgr.addColorStop(1, '#5a6670');
    ctx.fillStyle = cgr;
    ctx.beginPath();
    ctx.moveTo(cupX - cR, cupY - cR * 1.15);
    ctx.lineTo(cupX + cR, cupY - cR * 1.15);
    ctx.quadraticCurveTo(cupX + cR * 0.82, cupY + cR * 0.5, cupX + cR * 0.7, cupY + cR * 0.72);
    ctx.lineTo(cupX - cR * 0.7, cupY + cR * 0.72);
    ctx.quadraticCurveTo(cupX - cR * 0.82, cupY + cR * 0.5, cupX - cR, cupY - cR * 1.15);
    ctx.closePath();
    ctx.fill();
    // 杯口沿
    ctx.fillStyle = '#4a545e';
    ctx.beginPath();
    ctx.ellipse(cupX, cupY - cR * 1.15, cR, cR * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();
    // 把手（连在杯身右侧）
    ctx.strokeStyle = '#7d8a94';
    ctx.lineWidth = cR * 0.18;
    ctx.beginPath();
    ctx.arc(cupX + cR * 1.02, cupY - cR * 0.28, cR * 0.42, -1.2, 1.2);
    ctx.stroke();
    // 摊开的书（右）
    ctx.globalAlpha = Math.max(0.12, Math.min(1, (level - 0.5) / 1.5));
    var bkX = L.lx + L.lR * 3.6, bkY = tableY + L.lR * 0.9;
    ctx.fillStyle = '#c9bfa8';
    ctx.beginPath();
    ctx.moveTo(bkX - L.lR * 1.1, bkY);
    ctx.quadraticCurveTo(bkX, bkY - L.lR * 0.28, bkX, bkY - L.lR * 0.16);
    ctx.quadraticCurveTo(bkX, bkY - L.lR * 0.28, bkX + L.lR * 1.1, bkY);
    ctx.lineTo(bkX + L.lR * 1.1, bkY + L.lR * 0.18);
    ctx.quadraticCurveTo(bkX, bkY + L.lR * 0.34, bkX - L.lR * 1.1, bkY + L.lR * 0.18);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,74,52,0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(bkX, bkY - L.lR * 0.16);
    ctx.lineTo(bkX, bkY + L.lR * 0.3);
    ctx.stroke();
    // 针线笸箩（第二夜的小物彩蛋：只露个沿）
    ctx.globalAlpha = Math.max(0.1, Math.min(1, (level - 1.5) / 1.5));
    ctx.fillStyle = '#6b4a32';
    ctx.beginPath();
    ctx.ellipse(L.lx - L.lR * 7.4, tableY + L.lR * 1.1, L.lR * 0.72, L.lR * 0.2, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    // ── 油灯 ──
    var lx = L.lx, ly = L.ly, lR = L.lR;
    // 灯影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(lx, tableY + 6, lR * 1.7, lR * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    // 铜座（葫芦形）
    var lg2 = ctx.createLinearGradient(lx - lR, 0, lx + lR, 0);
    lg2.addColorStop(0, '#6b5230');
    lg2.addColorStop(0.45, '#a8853e');
    lg2.addColorStop(1, '#5c4527');
    ctx.fillStyle = lg2;
    ctx.beginPath();
    ctx.moveTo(lx - lR * 0.36, ly + lR * 2.45);
    ctx.bezierCurveTo(lx - lR * 1.05, ly + lR * 2.4, lx - lR * 0.95, ly + lR * 1.5, lx - lR * 0.4, ly + lR * 1.35);
    ctx.bezierCurveTo(lx - lR * 0.72, ly + lR * 0.9, lx - lR * 0.55, ly + lR * 0.5, lx - lR * 0.62, ly + lR * 0.12);
    ctx.lineTo(lx + lR * 0.62, ly + lR * 0.12);
    ctx.bezierCurveTo(lx + lR * 0.55, ly + lR * 0.5, lx + lR * 0.72, ly + lR * 0.9, lx + lR * 0.4, ly + lR * 1.35);
    ctx.bezierCurveTo(lx + lR * 0.95, ly + lR * 1.5, lx + lR * 1.05, ly + lR * 2.4, lx + lR * 0.36, ly + lR * 2.45);
    ctx.closePath();
    ctx.fill();
    // 灯碗
    ctx.fillStyle = '#8f7038';
    ctx.beginPath();
    ctx.moveTo(lx - lR * 0.72, ly + lR * 0.12);
    ctx.quadraticCurveTo(lx, ly + lR * 0.62, lx + lR * 0.72, ly + lR * 0.12);
    ctx.lineTo(lx + lR * 0.62, ly + lR * 0.12);
    ctx.closePath();
    ctx.fill();
    // 灯嘴（朝左的小嘴）
    ctx.fillStyle = '#8f7038';
    ctx.beginPath();
    ctx.moveTo(lx - lR * 0.7, ly + lR * 0.16);
    ctx.lineTo(lx - lR * 1.08, ly + lR * 0.04);
    ctx.lineTo(lx - lR * 0.7, ly - lR * 0.06);
    ctx.closePath();
    ctx.fill();
    // 火苗从灯嘴位置起
    var flameX = lx - lR * 0.95, flameY = ly - lR * 0.02;

    // 灯下小飞虫（亮起来才有）
    if (level >= 2) {
      for (var mi = 0; mi < moths.length; mi++) {
        var mo = moths[mi];
        mo.a += dt * mo.sp;
        var mx2 = flameX + Math.cos(mo.a) * lR * mo.d * 2.2;
        var my2 = flameY - size0() * 0.7 + Math.sin(mo.a * 2 + mo.ph) * lR * 0.7;
        ctx.fillStyle = 'rgba(40,36,28,' + (0.5 + Math.sin(now / 90 + mo.ph) * 0.2) + ')';
        ctx.fillRect(mx2, my2, 2, 2);
      }
    }

    // 挑针（动画中从右侧伸入）
    if (picking) {
      var pt = picking ? Math.min(1, pickT) : 0;
      var reach = Math.sin(pt * Math.PI);
      var nx = flameX + lR * 3.4 - reach * lR * 3.1;
      var ny = flameY - lR * 0.7 - reach * lR * 0.5;
      ctx.strokeStyle = '#c8ccd2';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(nx + lR * 1.6, ny + lR * 0.5);
      ctx.lineTo(nx, ny);
      ctx.stroke();
    }

    drawFlame(flameX, flameY, now);

    // 灯花爆闪（第三下）
    if (burst > 0) {
      ctx.globalAlpha = burst * 0.8;
      ctx.fillStyle = 'rgba(255,240,210,0.25)';
      ctx.fillRect(0, 0, w, h);
      ctx.globalAlpha = 1;
    }

    // 引导
    if (!saidStart && level === 0 && !picking) {
      ctx.fillStyle = 'rgba(200,138,106,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
      ctx.font = '13px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('点一下灯芯', lx, ly - lR * 3.1);
      ctx.textAlign = 'left';
    }
    if (resting) {
      ctx.fillStyle = 'rgba(230,210,170,' + (0.34 + 0.16 * Math.sin(now / 600)) + ')';
      ctx.font = '12px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('再挑一回', lx, tableY + L.lR * 2.2);
      ctx.textAlign = 'left';
    }

    function size0() { return flameSize(); }
  }

  function mix(c1, c2, t) {
    function px(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
    var a = px(c1), b = px(c2);
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (resting) {
      resting = false;
      level = 0; picking = false; pickT = 0; spark = 0; burst = 0;
      saidStart = false;
      return;
    }
    if (picking || level >= 3) return;
    var dx = ev.clientX - L.lx, dy = ev.clientY - (L.ly - L.lR * 0.6);
    if (dx * dx + dy * dy < Math.pow(L.lR * 3.2, 2)) {
      picking = true;
      pickT = 0.001;
      if (!saidStart) { saidStart = true; say('针尖轻轻一挑——别碰灭了它。'); }
    }
  });

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // QA 钩子（无私人信息；与真实点击共用判定）
  window.__lamp = {
    level: function () { return level; },
    done: function () { return resting; },
    picking: function () { return picking ? 1 : 0; },
    tap: function () {
      if (picking || level >= 3) return;
      picking = true;
      pickT = 0.001;
      saidStart = true;
    }
  };
})();
</script>
</body>
</html>
