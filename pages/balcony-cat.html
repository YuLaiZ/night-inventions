<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阳台上的猫</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 28px) 40px;
  }
  .back-home {
    display: inline-block;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: clamp(18px, 4vw, 30px);
  }
  .back-home:hover { color: var(--ice); }
  h1 {
    color: var(--ink-strong);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sub { margin-top: 8px; color: var(--ink-dim); font-size: 15px; text-align: center; }
  .sub em { font-style: normal; color: var(--gold); }

  .stage {
    position: relative;
    margin-top: clamp(18px, 4vw, 26px);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
  }
  .stage canvas { display: block; width: 100%; }

  .hint {
    margin-top: 14px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  footer { margin-top: clamp(32px, 6vw, 44px); }
  .sig { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>

  <h1>阳台上的猫</h1>
  <p class="sub">它蹲在栏杆上，看了很久的远处。<em>你点什么它都不理——猫的耳朵只会为自己转。</em></p>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
  </div>

  <p class="hint">夜里的城市在它眼里，大概就是一盆很大的、不会动的鱼。</p>

  <footer>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ · <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener" style="color:inherit">GitHub 源码</a></p>
  </footer>
</main>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var W = 0, H = 0;

  var tailPhase = 0;
  var lookUntil = 0;        /* 被点到时：回头看一眼 */
  var earTwitch = 0;
  var blinkAt = Date.now() + 3000;
  var blinking = 0;
  var lastFrame = Date.now();

  function resize() {
    var w = stage.clientWidth;
    var h = Math.round(Math.min(400, Math.max(300, w * 0.72)));
    cv.width = w;
    cv.height = h;
    cv.style.height = h + 'px';
    W = w; H = h;
  }

  function draw(now) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#080c15');
    g.addColorStop(0.7, '#101825');
    g.addColorStop(1, '#141b28');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 远处城市：一片窗灯 */
    var lights = [
      [0.10, 0.52], [0.16, 0.47], [0.24, 0.55], [0.31, 0.50], [0.40, 0.45],
      [0.48, 0.53], [0.57, 0.48], [0.66, 0.44], [0.74, 0.52], [0.83, 0.47], [0.90, 0.55]
    ];
    for (var i = 0; i < lights.length; i++) {
      var lx = W * lights[i][0], ly = H * lights[i][1];
      var tw = 0.5 + 0.5 * Math.sin(now / 800 + i * 2.1);
      ctx.fillStyle = 'rgba(242, 199, 110,' + (0.25 + 0.45 * tw) + ')';
      ctx.fillRect(lx, ly, 4, 5);
    }

    /* 月牙 */
    ctx.fillStyle = '#e8e2c9';
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.16, 13, 0, 6.29);
    ctx.fill();
    ctx.fillStyle = '#0a0f1a';
    ctx.beginPath();
    ctx.arc(W * 0.82 - 6, H * 0.16 - 4, 12, 0, 6.29);
    ctx.fill();

    /* 栏杆（前景） */
    ctx.fillStyle = '#1a2233';
    ctx.fillRect(0, H * 0.68, W, 10);
    for (var p = 0; p < 6; p++) {
      ctx.fillRect(W * 0.06 + p * W * 0.17, H * 0.68, 7, H * 0.32);
    }
    ctx.fillRect(0, H * 0.96, W, H * 0.04);

    /* 猫（蹲坐在栏杆上方，剪影 + 暖边） */
    var catX = W * 0.5;
    var catBase = H * 0.68;
    var s = Math.min(W, H) * 0.0060;
    var tailSway = Math.sin(tailPhase) * s * 0.5;
    var looking = now < lookUntil;

    ctx.save();
    ctx.fillStyle = '#0c1019';
    ctx.strokeStyle = 'rgba(242, 199, 110, 0.20)';
    ctx.lineWidth = 1.5;

    /* 尾巴：从身后弯出，摆动 */
    ctx.beginPath();
    ctx.moveTo(catX + s * 2.4, catBase - s * 0.4);
    ctx.quadraticCurveTo(catX + s * 3.4, catBase - s * 1.1, catX + s * 3.3 + tailSway, catBase - s * 2.0);
    ctx.lineWidth = s * 0.22;
    ctx.strokeStyle = '#0c1019';
    ctx.stroke();

    /* 身体（坐姿水滴形） */
    ctx.beginPath();
    ctx.moveTo(catX - s * 1.15, catBase);
    ctx.quadraticCurveTo(catX - s * 1.25, catBase - s * 1.7, catX - s * 0.25, catBase - s * 2.0);
    ctx.quadraticCurveTo(catX + s * 0.55, catBase - s * 2.1, catX + s * 0.75, catBase - s * 1.55);
    ctx.quadraticCurveTo(catX + s * 1.05, catBase - s * 0.9, catX + s * 1.15, catBase);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    /* 头（looking 时转向观众） */
    var headX = looking ? catX - s * 0.1 : catX - s * 0.35;
    var headY = catBase - s * 2.15;
    ctx.beginPath();
    ctx.arc(headX, headY, s * 0.52, 0, 6.29);
    ctx.fill();
    /* 耳朵 */
    ctx.beginPath();
    ctx.moveTo(headX - s * 0.42, headY - s * 0.28);
    ctx.lineTo(headX - s * 0.52, headY - s * 0.85 + (earTwitch > 0 ? s * 0.12 : 0));
    ctx.lineTo(headX - s * 0.10, headY - s * 0.44);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(headX + s * 0.06, headY - s * 0.46);
    ctx.lineTo(headX + s * 0.30, headY - s * 0.92 + (earTwitch > 0 ? s * 0.12 : 0));
    ctx.lineTo(headX + s * 0.48, headY - s * 0.30);
    ctx.closePath();
    ctx.fill();

    /* 眼睛：平时闭目/望远处一条缝，被点时睁圆看你 */
    if (looking) {
      ctx.fillStyle = '#f2c76e';
      ctx.beginPath();
      ctx.arc(headX + s * 0.04, headY - s * 0.02, s * 0.22, 0, 6.29);
      ctx.arc(headX + s * 0.36, headY - s * 0.02, s * 0.22, 0, 6.29);
      ctx.fill();
      ctx.fillStyle = '#0c1019';
      ctx.beginPath();
      ctx.arc(headX + s * 0.04, headY - s * 0.02, s * 0.09, 0, 6.29);
      ctx.arc(headX + s * 0.36, headY - s * 0.02, s * 0.09, 0, 6.29);
      ctx.fill();
    } else if (blinking > 0) {
      ctx.strokeStyle = 'rgba(242, 199, 110, 0.5)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(headX - s * 0.08, headY - s * 0.05);
      ctx.lineTo(headX + s * 0.10, headY - s * 0.05);
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(242, 199, 110, 0.55)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(headX - s * 0.02, headY + s * 0.02, s * 0.10, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(headX + s * 0.26, headY + s * 0.02, s * 0.10, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    }
    ctx.restore();

    /* 尾巴相位与耳朵/眨眼节奏 */
    tailPhase += 0.028;
    if (earTwitch > 0) earTwitch -= 1;
    if (Math.random() < 0.004) earTwitch = 22;
    if (now > blinkAt) { blinking = 6; blinkAt = now + 2600 + Math.random() * 3400; }
    if (blinking > 0) blinking -= 1;
  }

  function loop() {
    draw(Date.now());
    setTimeout(loop, 60);
  }

  stage.addEventListener('pointerdown', function () {
    lookUntil = Date.now() + 2200;
    earTwitch = 0;
  });

  window.addEventListener('resize', resize);
  resize();
  loop();
})();
</script>
</body>
</html>
