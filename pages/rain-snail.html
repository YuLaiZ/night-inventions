<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨夜的蜗牛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0b1013;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #7e8a90;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    touch-action: none;
  }
  .copy {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #6f8d7c; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #5d6a70; letter-spacing: 0.08em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    text-align: center;
    font-size: 14px; letter-spacing: 0.12em;
    color: #7a8a82;
    min-height: 24px;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 3;
    pointer-events: none;
  }
  .caption.show { opacity: 1; }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #525a5e;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #636d72;
    text-decoration: none;
    border-bottom: 1px dotted #636d72;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .back:hover { color: #6f8d7c; border-color: #6f8d7c; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>
<canvas id="fx"></canvas>

<div class="copy">
  <h1>雨夜的蜗牛</h1>
  <p>雨停了，有只蜗牛还在赶路。<br>按住屏幕下一小会儿雨，它就走得欢喜。</p>
</div>

<div class="caption" id="caption"></div>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var caption = document.getElementById('caption');
  var capTimer = null;

  function say(text, hold) {
    caption.textContent = text;
    caption.classList.add('show');
    if (capTimer) clearTimeout(capTimer);
    if (!hold) capTimer = setTimeout(function () { caption.classList.remove('show'); }, 5200);
  }

  var raining = false;        // 按住=下雨
  var wetness = 0;            // 路面湿润度 0-1（雨涨晴缓降）
  var rain = [];              // 雨线 {x,y,vy,len}
  var hits = [];              // 地面雨点涟漪 {x,y,r,a}
  var trail = [];             // 蜗牛爬痕 {x,y}
  var home = false;           // 本只已到家
  var homeFade = 0;           // 到家淡出
  var trip = 0;               // 第几只（决定壳色）
  var saidRain = false, saidHome = false;
  var shellTones = [
    { a: '#a4835c', b: '#7c6040', rim: '#cfa96f' },
    { a: '#8d7a9c', b: '#655678', rim: '#bfa9d4' },
    { a: '#b08050', b: '#865e36', rim: '#e0b57f' }
  ];

  var L = {};
  function layout() {
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * DPR;
    canvas.height = h * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    L.w = w; L.h = h;
    L.groundY = h * 0.72;                  // 路面线
    L.grassX = w - Math.min(110, w * 0.2); // 草丛起始 x
    L.lampX = w * 0.5;                     // 路灯（光锥中心）
  }
  window.addEventListener('resize', layout);
  layout();

  function snailX() { return L.w * (0.1 + 0.78 * tripProgress()); }
  function tripProgress() { return prog; }

  var prog = 0;               // 本只旅程进度 0-1
  var squish = 0;             // 身体伸缩相位

  window.addEventListener('pointerdown', function () { raining = true; });
  window.addEventListener('pointerup', function () { raining = false; });
  window.addEventListener('pointercancel', function () { raining = false; });

  function rnd(i) { return Math.abs(Math.sin(i * 127.1 + 47.3) * 43758.5453) % 1; }

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var w = L.w, h = L.h;

    // 湿度：雨涨晴降
    if (raining) wetness = Math.min(1, wetness + dt * 0.8);
    else wetness = Math.max(0, wetness - dt * 0.06);

    // 蜗牛速度：干 0.012/s，雨中 0.038/s
    if (!home) {
      var v = 0.012 + wetness * 0.026;
      prog = Math.min(1, prog + dt * v);
      squish += dt * (2 + wetness * 6);
      if (prog >= 1 && !home) {
        home = true;
        if (!saidHome) { saidHome = true; say('到家了。你也是，晚安。', true); }
      }
    } else {
      homeFade = Math.min(1, homeFade + dt * 0.5);
      if (homeFade >= 1) {
        // 新的一只
        home = false; homeFade = 0; prog = 0;
        trail = [];
        trip++;
      }
    }

    // 雨线生成
    if (raining && Math.random() < dt * 90) {
      rain.push({ x: Math.random() * w * 1.1 - w * 0.05, y: -20, vy: 620 + Math.random() * 180, len: 10 + Math.random() * 14 });
    }
    for (var i = rain.length - 1; i >= 0; i--) {
      var rd = rain[i];
      rd.y += rd.vy * dt; rd.x += rd.vy * dt * 0.06;
      if (rd.y > L.groundY + Math.random() * (h - L.groundY)) {
        hits.push({ x: rd.x, y: rd.y, r: 1.5, a: 0.4 });
        rain.splice(i, 1);
      }
    }
    for (var h2 = hits.length - 1; h2 >= 0; h2--) {
      var ht = hits[h2];
      ht.r += dt * 16;
      ht.a -= dt * 1.1;
      if (ht.a <= 0) hits.splice(h2, 1);
    }

    // 爬痕采样
    if (!home) {
      var lastTx = trail.length ? trail[trail.length - 1].x : -99;
      if (Math.abs(snailX() - lastTx) > 6) trail.push({ x: snailX(), y: L.groundY + 26 });
    }

    // ── 背景：夜街 ──
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#0d1216');
    bg.addColorStop(1, '#0a0e10');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    // 远处街影
    ctx.fillStyle = 'rgba(20,28,34,0.8)';
    for (var b = 0; b < 6; b++) {
      var bw = w * (0.06 + rnd(b) * 0.09);
      var bh = h * (0.10 + rnd(b + 30) * 0.16);
      ctx.fillRect((b * w / 6 + rnd(b + 70) * 20) % w, L.groundY - bh - 2, bw, bh);
      // 零星亮窗
      if (rnd(b + 11) > 0.4) {
        ctx.fillStyle = 'rgba(210,190,130,' + 0.12 + rnd(b + 5) * 0.1 + ')';
        ctx.fillRect((b * w / 6 + rnd(b + 70) * 20) % w + bw * 0.3, L.groundY - bh * 0.7, 3, 4);
        ctx.fillStyle = 'rgba(20,28,34,0.8)';
      }
    }

    // ── 路面 ──
    var road = ctx.createLinearGradient(0, L.groundY, 0, h);
    road.addColorStop(0, '#161d21');
    road.addColorStop(1, '#10151a');
    ctx.fillStyle = road;
    ctx.fillRect(0, L.groundY, w, h - L.groundY);
    // 湿路反光（路灯下的竖光带）
    var refl = ctx.createLinearGradient(0, L.groundY, 0, h);
    refl.addColorStop(0, 'rgba(190,215,190,' + 0.10 * (0.35 + wetness * 0.65) + ')');
    refl.addColorStop(1, 'rgba(190,215,190,0)');
    ctx.fillStyle = refl;
    ctx.fillRect(L.lampX - w * 0.18, L.groundY, w * 0.36, h - L.groundY);
    // 路缘线
    ctx.strokeStyle = 'rgba(180,200,190,' + 0.14 + wetness * 0.08 + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, L.groundY); ctx.lineTo(w, L.groundY); ctx.stroke();

    // ── 草丛（家）──
    for (var g2 = 0; g2 < 14; g2++) {
      var gx = L.grassX + rnd(g2 + 3) * (w - L.grassX);
      var gh = 16 + rnd(g2 + 8) * 26;
      ctx.strokeStyle = 'rgba(' + (70 + rnd(g2) * 30 | 0) + ',' + (110 + rnd(g2 + 2) * 40 | 0) + ',' + 74 + ',0.75)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx, L.groundY + 4);
      ctx.quadraticCurveTo(gx + (rnd(g2 + 6) - 0.5) * 10, L.groundY - gh * 0.6, gx + (rnd(g2 + 9) - 0.5) * 14, L.groundY - gh);
      ctx.stroke();
    }

    // ── 路灯光锥 ──
    var cone = ctx.createLinearGradient(0, 0, 0, L.groundY);
    cone.addColorStop(0, 'rgba(215,230,200,0.14)');
    cone.addColorStop(1, 'rgba(215,230,200,0.02)');
    ctx.fillStyle = cone;
    ctx.beginPath();
    ctx.moveTo(L.lampX - 8, 0);
    ctx.lineTo(L.lampX + 8, 0);
    ctx.lineTo(L.lampX + w * 0.16, L.groundY);
    ctx.lineTo(L.lampX - w * 0.16, L.groundY);
    ctx.closePath();
    ctx.fill();
    // 灯头
    ctx.fillStyle = 'rgba(225,240,205,' + 0.75 + 0.06 * Math.sin(now / 700) + ')';
    ctx.beginPath(); ctx.arc(L.lampX, 8, 5, 0, Math.PI * 2); ctx.fill();

    // ── 雨中涟漪 ──
    for (var r2 = 0; r2 < hits.length; r2++) {
      var rr = hits[r2];
      ctx.strokeStyle = 'rgba(185,215,205,' + rr.a * 0.7 + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(rr.x, rr.y, rr.r, rr.r * 0.3, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ── 爬痕（亮水线）──
    if (trail.length > 1) {
      ctx.strokeStyle = 'rgba(180,210,200,' + 0.10 + wetness * 0.08 + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(trail[0].x, trail[0].y);
      for (var t3 = 1; t3 < trail.length; t3++) ctx.lineTo(trail[t3].x, trail[t3].y);
      ctx.stroke();
    }

    // ── 蜗牛 ──
    if (!(home && homeFade >= 1)) drawSnail(now);

    // ── 雨线（最上层）──
    ctx.strokeStyle = 'rgba(175,205,200,0.32)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var r3 = 0; r3 < rain.length; r3++) {
      var rl = rain[r3];
      ctx.moveTo(rl.x, rl.y);
      ctx.lineTo(rl.x + rl.len * 0.06, rl.y - rl.len);
    }
    ctx.stroke();

    // 引导
    if (!raining && wetness < 0.05 && !home) {
      ctx.fillStyle = 'rgba(140,165,150,' + (0.3 + 0.2 * Math.sin(now / 520)) + ')';
      ctx.font = '13px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('按住屏幕，下一会儿雨', w / 2, L.groundY + 52);
    }
    if (raining && !saidRain) {
      saidRain = true;
      say('不急，雨停之前它慢慢走。');
    }
  }

  function drawSnail(now) {
    var x = snailX();
    var gy = L.groundY + 24;
    var s = Math.min(1, L.w / 720) * 1.05;
    var alpha = home ? 1 - homeFade : 1;
    var hop = home ? homeFade * 14 : 0; // 到家沉入草丛
    // 身体（前伸-收缩）
    var stretch = Math.sin(squish) * 0.5 + 0.5;   // 0-1
    var bodyL = (46 + stretch * 16) * s;
    var bodyH = 15 * s;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, gy - hop);

    // 影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(-bodyL * 0.15, bodyH + 3, bodyL * 0.7, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // 身体（趴地，前端上扬一点）
    var bodyC = '#8fa07f';
    ctx.fillStyle = bodyC;
    ctx.beginPath();
    ctx.moveTo(-bodyL * 0.55, bodyH);
    ctx.quadraticCurveTo(-bodyL * 0.6, bodyH * 0.4, -bodyL * 0.4, bodyH * 0.55);
    ctx.lineTo(bodyL * 0.28, bodyH * 0.45);
    ctx.quadraticCurveTo(bodyL * 0.52, bodyH * 0.4, bodyL * 0.62, -bodyH * 0.5);
    ctx.quadraticCurveTo(bodyL * 0.7, bodyH * 0.1, bodyL * 0.55, bodyH);
    ctx.closePath();
    ctx.fill();
    // 身体高光
    ctx.strokeStyle = 'rgba(215,230,190,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-bodyL * 0.5, bodyH * 0.75);
    ctx.quadraticCurveTo(bodyL * 0.2, bodyH * 0.5, bodyL * 0.5, bodyH * 0.2);
    ctx.stroke();

    // 壳（螺旋）
    var tone = shellTones[trip % shellTones.length];
    var shellR = 17 * s;
    var shx = -bodyL * 0.18, shy = -shellR * 0.72;
    var sg = ctx.createRadialGradient(shx - shellR * 0.3, shy - shellR * 0.3, 2, shx, shy, shellR);
    sg.addColorStop(0, tone.a);
    sg.addColorStop(1, tone.b);
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(shx, shy, shellR, 0, Math.PI * 2); ctx.fill();
    // 壳缘
    ctx.strokeStyle = tone.rim;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(shx, shy, shellR - 0.7, 0, Math.PI * 2); ctx.stroke();
    // 螺旋纹（2.5 圈）
    ctx.strokeStyle = 'rgba(40,30,20,0.45)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    for (var a = 0; a < Math.PI * 5; a += 0.15) {
      var rr2 = shellR * 0.82 * (1 - a / (Math.PI * 5.4));
      var px2 = shx + Math.cos(a + squish * 0.05) * rr2;
      var py2 = shy + Math.sin(a + squish * 0.05) * rr2;
      if (a === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.stroke();

    // 触角（两根，随伸缩晃）
    ctx.strokeStyle = bodyC;
    ctx.lineWidth = 2 * s;
    ctx.lineCap = 'round';
    var sway = Math.sin(now / 420) * 3 + stretch * 3;
    ctx.beginPath();
    ctx.moveTo(bodyL * 0.52, -bodyH * 0.3);
    ctx.quadraticCurveTo(bodyL * 0.6 + sway, -bodyH * 1.3, bodyL * 0.63 + sway, -bodyH * 1.75);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bodyL * 0.62, -bodyH * 0.1);
    ctx.quadraticCurveTo(bodyL * 0.74 - sway, -bodyH * 1.1, bodyL * 0.8 - sway, -bodyH * 1.5);
    ctx.stroke();
    // 触角顶的小球
    ctx.fillStyle = bodyC;
    ctx.beginPath(); ctx.arc(bodyL * 0.63 + sway, -bodyH * 1.75, 1.8 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bodyL * 0.8 - sway, -bodyH * 1.5, 1.8 * s, 0, Math.PI * 2); ctx.fill();
    ctx.lineCap = 'butt';

    ctx.restore();
  }

  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250); // rAF 停摆（后台标签页）时的兜底驱动

  // QA 钩子（无私人信息）
  window.__snail = {
    x: function () { return +snailX().toFixed(1); },
    prog: function () { return +prog.toFixed(3); },
    wetness: function () { return +wetness.toFixed(2); },
    raining: function () { return raining; },
    home: function () { return home; },
    trip: function () { return trip; },
    press: function () { raining = true; },
    release: function () { raining = false; },
    boost: function () { prog = Math.min(1, prog + 0.9); } // QA：快进到家门口
  };
})();
</script>
</body>
</html>
