<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>划掉焦虑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06080d;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #c9c2b4;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .copy {
    position: absolute; top: 80px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 3;
    transition: opacity 1s ease;
  }
  .copy h1 {
    font-size: 20px; font-weight: 500; letter-spacing: 0.28em;
    color: #8a857a; margin-bottom: 12px; padding-left: 0.28em;
  }
  .copy p { font-size: 13px; line-height: 2; color: #565a63; letter-spacing: 0.08em; }
  body.clear .copy { opacity: 0; }
  .notif {
    position: absolute; top: 150px; left: 50%;
    width: min(400px, 86vw);
    transform: translateX(-50%);
    background: rgba(28,33,44,0.92);
    border: 1px solid #39414f;
    border-radius: 14px;
    padding: 13px 18px;
    z-index: 5;
    cursor: pointer;
    transition: transform 0.45s ease, opacity 0.45s ease;
    backdrop-filter: blur(4px);
  }
  .notif .app {
    font-size: 10px; letter-spacing: 0.16em;
    color: #6d727c;
    margin-bottom: 4px;
  }
  .notif .txt {
    font-size: 14px; line-height: 1.7;
    color: #cfc8b8;
  }
  .notif.gone {
    transform: translateX(-50%) translateY(-90px) rotate(-3deg);
    opacity: 0;
    pointer-events: none;
  }
  .count-line {
    position: absolute; bottom: 6vh; left: 0; right: 0;
    text-align: center;
    font-size: 13px; letter-spacing: 0.16em;
    color: #7d7668;
    z-index: 3;
    transition: opacity 1s ease;
  }
  body.clear .count-line { color: #e8d9b0; }
  .clear-line {
    position: absolute; top: 44%; left: 0; right: 0;
    text-align: center;
    font-size: 19px; letter-spacing: 0.3em;
    color: #e8d9b0;
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 3;
    pointer-events: none;
    padding-left: 0.3em;
  }
  body.clear .clear-line { opacity: 1; }
  .stardust {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 6;
  }
  footer {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #3c4048;
    letter-spacing: 0.04em;
    z-index: 4;
  }
  footer a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .back {
    position: absolute; top: 16px; left: 18px;
    font-size: 12px; color: #565a63;
    text-decoration: none;
    border-bottom: 1px dotted #565a63;
    padding-bottom: 2px;
    letter-spacing: 0.06em;
    z-index: 6;
  }
  .back:hover { color: #9b948a; border-color: #9b948a; }
</style>
</head>
<body>
<a class="back" href="../">← 返回陈列馆</a>

<div class="copy">
  <h1>划掉焦虑</h1>
  <p>凌晨的手机，推送都不重要。<br>点一下，划掉一条——试试能不能划干净。</p>
</div>

<div class="clear-line">清净了。睡吧。</div>
<div class="count-line" id="countLine"></div>
<canvas class="stardust" id="fx"></canvas>

<footer>
  夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ ·
  <a href="https://github.com/YuLaiZ/night-inventions" target="_blank" rel="noopener">GitHub 源码</a>
</footer>

<script>
(function () {
  'use strict';

  var POOL = [
    ['日程', '明天 09:30 有会。材料还没写。'],
    ['工作群', '「这个今晚能出吗？」——发的时间是 23:47。'],
    ['邮件', '「Re: Re: Re: 关于那件谁都不想接的事」'],
    ['账单', '本月还剩 3 天，余额已就位，勇气未就位。'],
    ['社交', '有 2 条未读消息。都不是找你的。'],
    ['闹钟', '已设置 06:30。你现在一点都困不起来。'],
    ['日程', '别忘了：今天立的 flag，明天会倒。'],
    ['邮件', '「亲，方案我们再对齐一下」——共 47 页。'],
    ['工作群', '有人@了你，又取消。有人@了你，又取消。'],
    ['健康', '您已连续熬夜 7 天。这个数据它自己也在熬。'],
    ['妈妈的未读', '「睡了没？记得盖被子。」——这条可以不划。'],
    ['回忆', '三年前的今天你在干嘛？想不起来就算了。']
  ];

  var countLine = document.getElementById('countLine');
  var dismissed = 0;
  var queue = POOL.slice();
  // 洗牌
  for (var i = queue.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = queue[i]; queue[i] = queue[j]; queue[j] = t;
  }
  var current = null;
  var cleared = false;

  function next() {
    if (cleared) return;
    if (!queue.length) {
      cleared = true;
      document.body.classList.add('clear');
      countLine.textContent = '';
      return;
    }
    var item = queue.shift();
    var el = document.createElement('div');
    el.className = 'notif';
    el.innerHTML = '<div class="app">' + item[0] + '</div><div class="txt">' + item[1] + '</div>';
    document.body.appendChild(el);
    current = { el: el, kind: item[0] };
    updateCount();
  }

  function updateCount() {
    countLine.textContent = '已划掉 ' + dismissed + ' 条 · 还剩 ' + queue.length + ' 条';
  }

  document.addEventListener('click', function (e) {
    if (cleared || !current) return;
    if (!current.el.contains(e.target)) return;
    // 划掉
    current.el.classList.add('gone');
    stardustBurst(current.el);
    dismissed++;
    if (current.kind === '妈妈的未读') {
      setTimeout(function () {
        countLine.textContent = '那条不该划的……算了，明天一早回她。';
      }, 500);
    }
    current = null;
    setTimeout(next, 650);
  });

  // ── 星尘粒子 ─────────────────────────────────────────
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var dusts = [];

  function resize() {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function stardustBurst(el) {
    var r = el.getBoundingClientRect();
    for (var i = 0; i < 26; i++) {
      dusts.push({
        x: r.left + Math.random() * r.width,
        y: r.top + Math.random() * r.height,
        vx: (Math.random() - 0.5) * 120,
        vy: -40 - Math.random() * 110,
        life: 0.7 + Math.random() * 0.7,
        s: 1 + Math.random() * 2.2
      });
    }
  }

  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = dusts.length - 1; i >= 0; i--) {
      var d = dusts[i];
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.vy += 120 * dt;
      d.life -= dt;
      if (d.life <= 0) { dusts.splice(i, 1); continue; }
      ctx.fillStyle = 'rgba(232,217,176,' + Math.max(0, Math.min(1, d.life)) + ')';
      ctx.fillRect(d.x, d.y, d.s, d.s);
    }
  }
  function rafLoop() { tick(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);
  setInterval(tick, 250);

  next();
})();
</script>
</body>
</html>
