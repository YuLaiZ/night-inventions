<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星星邮局</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: clamp(30px, 6vw, 52px) 22px 40px;
  }
  .back-home {
    display: inline-block;
    font-size: 13px;
    color: var(--ink-dim);
    text-decoration: none;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .back-home:hover { color: var(--gold); }
  header h1 {
    font-weight: 600;
    font-size: clamp(26px, 6vw, 34px);
    letter-spacing: 0.02em;
    color: var(--ink-strong);
  }
  .intro {
    margin-top: 10px;
    color: var(--ink-dim);
    font-size: 15px;
    max-width: 34em;
  }
  .form {
    margin-top: clamp(22px, 5vw, 30px);
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(16, 22, 40, 0.55);
    padding: clamp(18px, 4vw, 26px);
  }
  .form .label { font-size: 13px; color: var(--ink-dim); }
  #txt {
    width: 100%;
    margin-top: 8px;
    background: rgba(10, 13, 23, 0.6);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink-strong);
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1.6;
    padding: 10px 14px;
    outline: none;
    resize: none;
  }
  #txt:focus { border-color: rgba(156, 200, 255, 0.4); }
  .send-row {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .send-row .cnt { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  #btn-send {
    background: rgba(242, 199, 110, 0.12);
    border: 1px solid rgba(242, 199, 110, 0.55);
    color: var(--gold);
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    padding: 9px 26px;
    border-radius: 999px;
    cursor: pointer;
  }
  #btn-send:hover { background: rgba(242, 199, 110, 0.2); }
  .sky-frame {
    margin-top: clamp(20px, 4vw, 28px);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    background: radial-gradient(ellipse at 70% 20%, #131c33 0%, #070a14 70%);
  }
  #sky { display: block; width: 100%; cursor: pointer; }
  .sky-hint {
    padding: 8px 16px 12px;
    font-size: 12.5px;
    color: var(--ink-dim);
    border-top: 1px solid var(--line);
  }
  #reading {
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(16, 22, 40, 0.55);
    padding: 14px 18px;
    display: none;
    align-items: center;
    gap: 14px;
  }
  #reading.show { display: flex; }
  #reading .r-text { flex: 1; font-size: 14.5px; color: var(--ink-strong); }
  #reading .r-meta { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  #reading button {
    flex: none;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--sans);
  }
  #reading button:hover { color: var(--ink-strong); border-color: rgba(156, 200, 255, 0.4); }
  .hint {
    margin-top: 22px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  footer { margin-top: clamp(36px, 7vw, 52px); }
  .motto { font-size: 15px; color: #a8b3c9; letter-spacing: 0.04em; }
  .sig { margin-top: 12px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>
  <header>
    <h1>星星邮局</h1>
    <p class="intro">写一句想留给夜空的话，邮局把它寄成一颗星。星星挂在你的天上，想读就去读，不想要了就让流星带走。</p>
  </header>

  <div class="form">
    <p class="label">要寄上天的（40 字以内）</p>
    <textarea id="txt" rows="2" maxlength="40" placeholder="比如：今天也没有放弃。"></textarea>
    <div class="send-row">
      <span class="cnt"><span id="cnt">0</span> / 40</span>
      <button type="button" id="btn-send">寄 出</button>
    </div>
  </div>

  <div class="sky-frame">
    <canvas id="sky"></canvas>
    <p class="sky-hint">点一颗星，可以重读那句话；不想要的，让流星带走。</p>
  </div>

  <div id="reading">
    <div>
      <div class="r-text" id="r-text"></div>
      <div class="r-meta" id="r-meta"></div>
    </div>
    <button type="button" id="btn-meteor">让流星带走</button>
  </div>

  <p class="hint">星星只存在你自己的设备里。邮局不备份，夜空也不问缘由。</p>

  <footer>
    <p class="motto">寄出一句话，夜空就多认识你一点。</p>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ</p>
  </footer>
</main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'star-post-office-v1';
  var cv = $('sky');
  var c = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  var stars = [];
  var selected = -1;
  var t0 = Date.now();
  var meteors = [];

  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) stars = arr;
      }
    } catch (e) { /* 新访客从空天空开始 */ }
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(stars)); } catch (e) { /* 安静跳过 */ }
  }

  function hashPos(text, salt) {
    var h = 2166136261;
    var s = text + '#' + salt;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    var a = (h >>> 0) / 4294967296;
    var b = ((h >>> 8) % 1000) / 1000;
    return { x: 0.08 + a * 0.84, y: 0.12 + b * 0.72 };
  }

  function twinkle(base, t) { return base * (0.72 + 0.28 * Math.sin(t / 500 + base * 40)); }

  function render() {
    var t = Date.now() - t0;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    /* 渐变夜空 */
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a0f1e');
    g.addColorStop(1, '#0d1224');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    /* 背景碎星 */
    c.fillStyle = 'rgba(200, 210, 235, 0.35)';
    for (var i = 0; i < 40; i++) {
      var bx = (i * 137.5) % W, by = (i * 61.8) % H;
      c.fillRect(bx, by, 1, 1);
    }
    /* 星座连线（寄出顺序） */
    if (stars.length > 1) {
      c.strokeStyle = 'rgba(156, 200, 255, 0.12)';
      c.lineWidth = 1;
      c.beginPath();
      stars.forEach(function (s, idx) {
        var p = hashPos(s.text, s.salt);
        var px = p.x * W, py = p.y * H;
        if (idx === 0) c.moveTo(px, py); else c.lineTo(px, py);
      });
      c.stroke();
    }
    /* 邮寄的星星 */
    stars.forEach(function (s, idx) {
      var p = hashPos(s.text, s.salt);
      var x = p.x * W, y = p.y * H;
      var sel = idx === selected;
      var r = sel ? twinkle(4.5, t) + 1.5 : twinkle(3, t);
      c.save();
      c.shadowColor = sel ? 'rgba(242, 199, 110, 0.9)' : 'rgba(233, 228, 211, 0.8)';
      c.shadowBlur = sel ? 14 : 8;
      c.fillStyle = sel ? '#f2c76e' : '#e9e4d3';
      c.beginPath();
      for (var k = 0; k < 5; k++) {
        var ang = -Math.PI / 2 + k * 2 * Math.PI / 5;
        var inn = ang + Math.PI / 5;
        c.lineTo(x + Math.cos(ang) * r, y + Math.sin(ang) * r);
        c.lineTo(x + Math.cos(inn) * r * 0.42, y + Math.sin(inn) * r * 0.42);
      }
      c.closePath();
      c.fill();
      c.restore();
    });
    /* 流星 */
    meteors = meteors.filter(function (m) { return m.p < 1; });
    meteors.forEach(function (m) {
      m.p += 0.022;
      var mx = m.x + m.p * W * 0.5;
      var my = m.y + m.p * H * 0.35;
      c.strokeStyle = 'rgba(242, 199, 110, ' + (1 - m.p) + ')';
      c.lineWidth = 1.6;
      c.beginPath();
      c.moveTo(mx, my);
      c.lineTo(mx - 34 * (1 - m.p), my - 12 * (1 - m.p));
      c.stroke();
    });
  }

  function findStar(x, y) {
    for (var i = stars.length - 1; i >= 0; i--) {
      var p = hashPos(stars[i].text, stars[i].salt);
      var px = p.x * W, py = p.y * H;
      if (Math.sqrt(Math.pow(x - px, 2) + Math.pow(y - py, 2)) < 14) return i;
    }
    return -1;
  }

  function send() {
    var t = $('txt').value.trim();
    if (!t) return;
    if (stars.length >= 60) {
      $('cnt').textContent = '夜空满了（60 颗）。让流星带走一颗再寄。';
      return;
    }
    var salt = Math.floor(Math.random() * 100000);
    var p = hashPos(t, salt);
    stars.push({ text: t, salt: salt, born: new Date().toLocaleDateString('sv') });
    save();
    $('txt').value = '';
    $('cnt').textContent = '0';
    /* 入场闪烁由渲染循环自然呈现 */
  }

  $('btn-send').addEventListener('click', send);
  $('txt').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $('txt').addEventListener('input', function () {
    $('cnt').textContent = String(this.value.length);
  });

  cv.addEventListener('click', function (e) {
    var rect = cv.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width * W;
    var y = (e.clientY - rect.top) / rect.height * H;
    var idx = findStar(x, y);
    if (idx === -1) {
      selected = -1;
      $('reading').classList.remove('show');
      return;
    }
    selected = idx;
    var s = stars[idx];
    $('r-text').textContent = '「' + s.text + '」';
    $('r-meta').textContent = '寄于 ' + s.born;
    $('reading').classList.add('show');
  });

  $('btn-meteor').addEventListener('click', function () {
    if (selected === -1) return;
    var s = stars[selected];
    var p = hashPos(s.text, s.salt);
    meteors.push({ x: p.x * W, y: p.y * H, p: 0 });
    stars.splice(selected, 1);
    selected = -1;
    save();
    $('reading').classList.remove('show');
  });

  function sizeAndRender() {
    W = cv.clientWidth || 600;
    H = Math.round(W * 0.5);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.height = H + 'px';
    render();
  }
  window.addEventListener('resize', function () { sizeAndRender(); });
  (function loop() {
    render();
    setTimeout(loop, 120);
  })();
  sizeAndRender();
  load();
  sizeAndRender();
})();
</script>
</body>
</html>
