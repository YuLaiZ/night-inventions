<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵魂色卡</title>
<style>
  :root {
    --bg-0: #0a0d17;
    --bg-1: #101828;
    --ink: #c7d0e2;
    --ink-strong: #edf1fa;
    --ink-dim: #8b96ad;
    --gold: #f2c76e;
    --ice: #9cc8ff;
    --line: rgba(156, 200, 255, 0.14);
    --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 620px;
    margin: 0 auto;
    padding: clamp(30px, 6vw, 52px) 22px 40px;
  }
  .back-home {
    display: inline-block;
    font-size: 13px;
    color: var(--ink-dim);
    text-decoration: none;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .back-home:hover { color: var(--gold); }
  header h1 {
    font-weight: 600;
    font-size: clamp(26px, 6vw, 34px);
    letter-spacing: 0.02em;
    color: var(--ink-strong);
  }
  .intro {
    margin-top: 10px;
    color: var(--ink-dim);
    font-size: 15px;
    max-width: 34em;
  }
  .fields { margin-top: clamp(22px, 5vw, 30px); }
  .field { margin-top: 14px; }
  .field .fl {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    color: var(--ink);
  }
  .field .fl span { color: var(--ink-dim); }
  input[type="range"] {
    width: 100%;
    margin-top: 6px;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 999px;
    background: rgba(156, 200, 255, 0.18);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid var(--bg-1);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid var(--bg-1);
    cursor: pointer;
  }
  .swatch-card {
    margin-top: clamp(22px, 5vw, 30px);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    background: rgba(16, 22, 40, 0.55);
  }
  #swatch {
    height: 130px;
    background: #202839;
    transition: background 0.5s ease;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 12px 16px;
  }
  #hex {
    font-family: var(--mono);
    font-size: 14px;
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  }
  .swatch-body { padding: 16px 18px 18px; }
  #cname {
    font-size: 20px;
    font-weight: 600;
    color: var(--ink-strong);
    letter-spacing: 0.04em;
  }
  #verdict {
    margin-top: 6px;
    font-size: 13.5px;
    color: var(--ink-dim);
  }
  .actions { margin-top: 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button.ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.1em;
    padding: 8px 20px;
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--sans);
  }
  button.ghost:hover { color: var(--ink-strong); border-color: rgba(156, 200, 255, 0.4); }
  #history {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    min-height: 22px;
    align-items: center;
  }
  #history .h-sw {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    flex: none;
  }
  #history .h-label { font-size: 12px; color: var(--ink-dim); margin-right: 2px; }
  .hint {
    margin-top: 22px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  footer { margin-top: clamp(36px, 7vw, 52px); }
  .motto { font-size: 15px; color: #a8b3c9; letter-spacing: 0.04em; }
  .sig { margin-top: 12px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; }
</style>
</head>
<body>
<main>
  <a class="back-home" href="../">← 陈列馆</a>
  <header>
    <h1>灵魂色卡</h1>
    <p class="intro">回答三个不正经的问题，炼出你此刻的灵魂色。同样的答案，同样的色——它比你诚实。</p>
  </header>

  <div class="fields">
    <div class="field">
      <div class="fl">现在的电量<span>空</span><span>满</span></div>
      <input type="range" id="r-energy" min="0" max="100" value="50">
    </div>
    <div class="field">
      <div class="fl">心里的天气<span>阴</span><span>晴</span></div>
      <input type="range" id="r-mood" min="0" max="100" value="50">
    </div>
    <div class="field">
      <div class="fl">脑内弹幕<span>安静</span><span>热闹</span></div>
      <input type="range" id="r-noise" min="0" max="100" value="50">
    </div>
  </div>

  <div class="swatch-card">
    <div id="swatch"><span id="hex">#202839</span></div>
    <div class="swatch-body">
      <div id="cname">正在显色……</div>
      <div id="verdict">拨动滑杆，你的颜色会自己找上门。</div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="ghost" id="btn-copy">复制色号</button>
    <button type="button" class="ghost" id="btn-store">收进今晚的册页</button>
  </div>
  <div id="history"><span class="h-label">今晚册页：</span></div>

  <p class="hint">颜色由三个滑杆唯一决定，动一点，色就变一点。泄露不了隐私，只泄露心情。</p>

  <footer>
    <p class="motto">说不清的心情，就给它一个色号。</p>
    <p class="sig">夜班出品 · 2026 · 客户端 ZCode · 模型 GLM-5.3-Flash · 指挥家 YuLaiZ</p>
  </footer>
</main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var NAMES = [
    { max: 20,  names: ['熔岩', '柿子', '微醺'],     verdict: '你心里有火。别急着灭，也别让它烧到别人。' },
    { max: 45,  names: ['蜜橘', '落日', '南瓜车'],   verdict: '温热、明亮，适合把没说出口的话说出口。' },
    { max: 70,  names: ['姜黄', '麦浪', '蛋黄边'],   verdict: '一点点旧，一点点甜，是回忆的颜色。' },
    { max: 150, names: ['青苔', '抹茶', '雨林'],     verdict: '安静生长型。你不需要被看见，也能活得很旺。' },
    { max: 190, names: ['湖水', '薄荷', '远山'],     verdict: '清透、凉而干净。你比你自己以为的清醒。' },
    { max: 250, names: ['深海', '靛青', '夜航'],     verdict: '深不见底的那种稳。别人靠岸，你靠自己。' },
    { max: 290, names: ['鸢尾', '葡萄', '暮霭'],     verdict: '浪漫藏在理性后面，偶尔才探头。' },
    { max: 345, names: ['海棠', '胭脂', '火烧云'],   verdict: '鲜艳不是罪。今天的情绪，理直气壮。' },
    { max: 361, names: ['绯色', '晚霞', '心跳'],     verdict: '临界点的颜色。再往前一步，就是新的色系。' }
  ];

  var PREFIX = {
    calm: ['沉', '素', '默'],
    noisy: ['沸', '闹', '烈'],
    low: ['灰', '倦', '暮'],
    high: ['亮', '醒', '鲜'],
    mid: ['小', '淡', '半']
  };

  function hsl2hex(h, s, l) {
    h = ((h % 360) + 360) % 360;
    s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2;
    var r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    function hx(v) {
      v = Math.round((v + m) * 255);
      var s = v.toString(16);
      return s.length === 1 ? '0' + s : s;
    }
    return '#' + hx(r) + hx(g) + hx(b);
  }

  function mix(el) { return el.value / 100; }

  function brew() {
    var energy = mix($('r-energy'));
    var mood = mix($('r-mood'));
    var noise = mix($('r-noise'));

    /* 天气定色相（阴=蓝青，晴=暖黄红，经绿区）；电量定明度；弹幕定饱和 */
    var hue = (210 - mood * 210 + energy * 30 + 360) % 360;
    var sat = Math.round(28 + noise * 52 + energy * 8);
    var light = Math.round(34 + energy * 26 + mood * 6 - noise * 4);
    if (light > 78) light = 78;
    if (light < 22) light = 22;
    if (sat > 88) sat = 88;

    var hex = hsl2hex(hue, sat, light);
    var band = null;
    for (var i = 0; i < NAMES.length; i++) {
      if (hue < NAMES[i].max) { band = NAMES[i]; break; }
    }
    if (!band) band = NAMES[0];
    var name = band.names[Math.floor(mood * band.names.length) % band.names.length];

    var key;
    if (noise > 66) key = 'noisy';
    else if (noise < 33 && energy < 40) key = 'low';
    else if (energy > 66) key = 'high';
    else if (energy < 33) key = 'calm';
    else key = 'mid';
    var pre = PREFIX[key][Math.floor(energy * 3) % 3];

    $('swatch').style.background = hex;
    $('hex').textContent = hex;
    $('cname').textContent = '「' + pre + '·' + name + '」';
    $('verdict').textContent = band.verdict;
  }

  var history = [];

  function store() {
    var c = $('swatch').style.background;
    if (!c || history.indexOf(c) !== -1) return;
    history.push(c);
    if (history.length > 10) history.shift();
    var box = $('history');
    box.textContent = '';
    var label = document.createElement('span');
    label.className = 'h-label';
    label.textContent = '今晚册页：';
    box.appendChild(label);
    history.forEach(function (color) {
      var d = document.createElement('div');
      d.className = 'h-sw';
      d.style.background = color;
      box.appendChild(d);
    });
  }

  $('btn-copy').addEventListener('click', function () {
    var text = $('hex').textContent;
    var btn = this;
    function ok() {
      btn.textContent = '已复制 ✓';
      setTimeout(function () { btn.textContent = '复制色号'; }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); });
    } else {
      fallbackCopy(text);
      ok();
    }
  });

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    } catch (e) { /* 本地环境受限时安静跳过 */ }
  }

  $('btn-store').addEventListener('click', store);
  ['r-energy', 'r-mood', 'r-noise'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', brew);
  });

  brew();
})();
</script>
</body>
</html>
